<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词学习 · 小禾英语</title>
<style>
  :root { --blue:#1a73e8; --muted:#5f6368; --line:#dadce0; --bg:#f0f4fa; --card:#fff; --ink:#202124; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; margin:0; background:var(--bg); color:var(--ink); }
  #topbar { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; gap:12px; }
  #topbar b { font-size:19px; font-weight:800; }
  #topbar .back { border:0; background:#e8f0fe; font-size:16px; color:var(--blue); cursor:pointer; padding:8px 16px; border-radius:999px; font-weight:600; }
  #wrap { max-width:720px; margin:0 auto; padding:20px 16px 120px; }
  .unit-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .unit-card { background:var(--card); border:2px solid var(--line); border-radius:16px; padding:20px 16px; text-align:center; cursor:pointer; transition:all .2s; }
  .unit-card:active { transform:scale(.96); }
  .unit-card.sel { border-color:var(--blue); background:#e8f0fe; }
  .unit-card .un { font-size:15px; font-weight:800; color:var(--blue); }
  .unit-card .ut { font-size:13px; color:var(--muted); margin-top:4px; }
  .unit-card .uc { font-size:12px; color:var(--muted); margin-top:8px; }
  .mode-bar { display:flex; gap:10px; margin-bottom:16px; }
  .mode-bar button { flex:1; padding:14px; border:2px solid var(--line); background:var(--card); border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; }
  .mode-bar button.sel { border-color:var(--blue); background:var(--blue); color:#fff; }
  #wordCard { background:var(--card); border-radius:20px; padding:40px 24px; text-align:center; min-height:280px; display:flex; flex-direction:column; justify-content:center; box-shadow:0 4px 16px rgba(60,64,67,.1); margin-bottom:16px; }
  #wordCard .en { font-size:36px; font-weight:800; letter-spacing:.5px; }
  #wordCard .pos { font-size:14px; color:var(--muted); margin-top:8px; }
  #wordCard .cn { font-size:24px; font-weight:700; color:var(--blue); margin-top:16px; }
  #wordCard .hint { font-size:13px; color:var(--muted); margin-top:20px; }
  .btn-row { display:flex; gap:10px; }
  .btn-row button { flex:1; padding:16px; border:0; border-radius:14px; font-size:16px; font-weight:800; cursor:pointer; }
  #btnKnow { background:#e8f5e9; color:#2e7d32; }
  #btnUnknown { background:#fce8e6; color:#c5221f; }
  #btnShow { background:var(--blue); color:#fff; }
  #spellInput { width:100%; padding:16px; font-size:20px; border:2px solid var(--line); border-radius:12px; text-align:center; margin-bottom:12px; }
  #spellInput:focus { outline:none; border-color:var(--blue); }
  .progress { text-align:center; color:var(--muted); font-size:14px; margin-bottom:12px; }
  .tabbar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; padding:8px 0; z-index:20; }
  .tabbar a { flex:1; text-align:center; text-decoration:none; color:var(--muted); font-size:11px; padding:6px 0; }
  .tabbar a .ticon { display:block; font-size:20px; margin-bottom:2px; }
  .tabbar a.active { color:var(--blue); }
</style>
</head>
<body>
<div id="topbar">
  <button class="back" onclick="location.href='/'">← 首页</button>
  <b>📚 单词学习</b>
</div>
<div id="wrap">
  <div class="unit-grid" id="unitGrid"></div>
  <div class="mode-bar" id="modeBar" style="display:none;">
    <button data-mode="card" class="sel">📇 卡片记忆</button>
    <button data-mode="spell">✍️ 拼写练习</button>
  </div>
  <div id="learnArea" style="display:none;">
    <div class="progress" id="progress"></div>
    <div id="wordCard">
      <div class="en" id="wEn"></div>
      <div class="pos" id="wPos"></div>
      <div class="cn" id="wCn" style="display:none;"></div>
      <div class="hint" id="wHint">点"显示中文"看意思</div>
    </div>
    <div id="cardBtns" class="btn-row">
      <button id="btnShow">显示中文</button>
    </div>
    <div id="knowBtns" class="btn-row" style="display:none;">
      <button id="btnUnknown">不认识</button>
      <button id="btnKnow">认识 ✓</button>
    </div>
    <div id="spellArea" style="display:none;">
      <input id="spellInput" placeholder="听发音，拼出单词" autocomplete="off">
      <div class="btn-row">
        <button id="btnSpellSub" style="background:var(--blue);color:#fff;">提交</button>
        <button id="btnSpellSkip" style="background:#f1f3f4;color:var(--muted);">跳过</button>
      </div>
      <div style="text-align:center;margin-top:12px;">
        <button id="btnPlayAudio" style="padding:12px 24px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:15px;cursor:pointer;">🔊 播放发音</button>
      </div>
    </div>
  </div>
</div>
<div class="tabbar">
  <a href="/"><span class="ticon">🏠</span>首页</a>
  <a href="/vocab.html"><span class="ticon">📖</span>生词本</a>
  <a href="/progress.html"><span class="ticon">📊</span>学习报告</a>
  <a href="/growth.html"><span class="ticon">🌱</span>成长</a>
  <a href="/settings.html"><span class="ticon">⚙️</span>设置</a>
</div>
<script>
// 单词学习页（2026-10-16 Elouise：按课本单元系统背单词）
const UNITS = [
  { id: 'unit3', name: 'Unit 3', title: 'Computers', desc: '电脑 · 比较级最高级' },
  { id: 'unit4', name: 'Unit 4', title: 'Inventions', desc: '发明 · 被动语态' },
  { id: 'unit5', name: 'Unit 5', title: 'Educational exchanges', desc: '教育交流 · 现在完成时' },
  { id: 'unit6', name: 'Unit 6', title: 'Ancient stories', desc: '古代故事 · 现在完成时' },
];
let curUnit = null, words = [], idx = 0, mode = 'card';
let known = JSON.parse(localStorage.getItem('xh_words_known') || '{}');

// 渲染单元选择
const grid = document.getElementById('unitGrid');
UNITS.forEach(u => {
  const d = document.createElement('div');
  d.className = 'unit-card';
  d.innerHTML = `<div class="un">${u.name}</div><div class="ut">${u.title}</div><div class="uc">${u.desc}</div><div class="uc" id="cnt-${u.id}">加载中…</div>`;
  d.onclick = () => selectUnit(u, d);
  grid.appendChild(d);
  // 预加载词数
  fetch(`/words/${u.id}.json`).then(r => r.json()).then(j => {
    document.getElementById(`cnt-${u.id}`).textContent = `${j.words.length} 个词`;
  }).catch(() => {
    document.getElementById(`cnt-${u.id}`).textContent = '暂无';
  });
});

async function selectUnit(u, el) {
  document.querySelectorAll('.unit-card').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel');
  curUnit = u;
  try {
    const r = await fetch(`/words/${u.id}.json`);
    const j = await r.json();
    words = j.words;
    idx = 0;
    document.getElementById('modeBar').style.display = 'flex';
    document.getElementById('learnArea').style.display = 'block';
    renderWord();
  } catch (e) {
    alert('单词表加载失败，请检查网络');
  }
}

// 模式切换
document.querySelectorAll('#modeBar button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#modeBar button').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    mode = b.dataset.mode;
    idx = 0;
    renderWord();
  };
});

function renderWord() {
  if (!words.length) return;
  const w = words[idx];
  document.getElementById('progress').textContent = `${idx + 1} / ${words.length}`;
  document.getElementById('wEn').textContent = w.en;
  document.getElementById('wPos').textContent = w.pos || '';
  document.getElementById('wCn').style.display = 'none';
  document.getElementById('wCn').textContent = w.cn;
  
  if (mode === 'card') {
    document.getElementById('spellArea').style.display = 'none';
    document.getElementById('cardBtns').style.display = 'flex';
    document.getElementById('knowBtns').style.display = 'none';
    document.getElementById('wHint').textContent = '点"显示中文"看意思';
    document.getElementById('wHint').style.display = 'block';
  } else {
    document.getElementById('cardBtns').style.display = 'none';
    document.getElementById('knowBtns').style.display = 'none';
    document.getElementById('spellArea').style.display = 'block';
    document.getElementById('wHint').textContent = w.cn;
    document.getElementById('wHint').style.display = 'block';
    document.getElementById('spellInput').value = '';
    document.getElementById('spellInput').focus();
    playAudio(w.en);
  }
}

document.getElementById('btnShow').onclick = () => {
  document.getElementById('wCn').style.display = 'block';
  document.getElementById('wHint').style.display = 'none';
  document.getElementById('cardBtns').style.display = 'none';
  document.getElementById('knowBtns').style.display = 'flex';
};

function nextWord(remembered) {
  const w = words[idx];
  const key = curUnit.id + ':' + w.en;
  if (remembered) known[key] = 1; else delete known[key];
  localStorage.setItem('xh_words_known', JSON.stringify(known));
  idx++;
  if (idx >= words.length) {
    const knownCount = words.filter(x => known[curUnit.id + ':' + x.en]).length;
    alert(`本单元完成！认识 ${knownCount}/${words.length} 个词`);
    idx = 0;
  }
  renderWord();
}

document.getElementById('btnKnow').onclick = () => nextWord(true);
document.getElementById('btnUnknown').onclick = () => nextWord(false);

document.getElementById('btnSpellSub').onclick = () => {
  const w = words[idx];
  const input = document.getElementById('spellInput').value.trim().toLowerCase();
  if (input === w.en.toLowerCase()) {
    nextWord(true);
  } else {
    alert(`不对，正确是：${w.en}\n再试一次`);
    document.getElementById('spellInput').value = '';
    document.getElementById('spellInput').focus();
  }
};
document.getElementById('btnSpellSkip').onclick = () => nextWord(false);
document.getElementById('spellInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('btnSpellSub').click();
});

function playAudio(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch {}
}
document.getElementById('btnPlayAudio').onclick = () => {
  if (words[idx]) playAudio(words[idx].en);
};
// 应用主题
try {
  const th = localStorage.getItem('xh_theme');
  if (th) document.documentElement.setAttribute('data-theme', th);
} catch {}
</script>
</body>
</html>
