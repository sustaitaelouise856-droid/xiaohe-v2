<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词学习 · 小禾英语</title>
<style>
  :root { --blue:#1a73e8; --muted:#5f6368; --line:#e1e5ea; --bg:#f0f4fa; --card:#fff; --ink:#202124;
    --green:#2e7d32; --green-bg:#e8f5e9; --red:#c5221f; --red-bg:#fce8e6;
    --orange:#e65100; --orange-bg:#fff3e0; --purple:#6a1b9a; --purple-bg:#f3e5f5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; margin:0; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  #topbar { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 8px rgba(60,64,67,.06); }
  #topbar b { font-size:19px; font-weight:800; }
  #topbar .back { border:0; background:#e8f0fe; font-size:15px; color:var(--blue); cursor:pointer; padding:8px 16px; border-radius:999px; font-weight:700; }
  #wrap { max-width:720px; margin:0 auto; padding:20px 16px 140px; /* 2026-10-16：底部留空防tabbar遮挡选项 */ }
  
  /* 单元看板 */
  .unit-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .unit-card { background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px 14px; cursor:pointer; transition:all .2s; position:relative; overflow:hidden; }
  .unit-card:active { transform:scale(.96); }
  .unit-card.sel { border-color:var(--blue); box-shadow:0 4px 16px rgba(26,115,232,.2); }
  .unit-card .un { font-size:15px; font-weight:800; color:var(--blue); }
  .unit-card .ut { font-size:13px; color:var(--ink); margin-top:4px; font-weight:600; }
  .unit-card .uc { font-size:12px; color:var(--muted); margin-top:4px; }
  .unit-card .pbar { height:8px; background:#f1f3f4; border-radius:999px; margin-top:12px; overflow:hidden; }
  .unit-card .pfill { height:100%; background:linear-gradient(90deg,#1a73e8,#64b5f6); border-radius:999px; transition:width .5s; }
  .unit-card .ptext { font-size:12px; color:var(--muted); margin-top:6px; }
  
  /* 模式选择 */
  .mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .mode-btn { padding:16px 12px; border:2px solid var(--line); background:var(--card); border-radius:14px; font-size:15px; font-weight:700; cursor:pointer; text-align:center; transition:all .2s; }
  .mode-btn:active { transform:scale(.96); }
  .mode-btn.sel { border-color:var(--blue); background:var(--blue); color:#fff; }
  .mode-btn .md { font-size:12px; font-weight:400; opacity:.8; margin-top:4px; display:block; }
  
  /* 单词卡片 */
  #wordCard { background:var(--card); border-radius:22px; padding:44px 24px; text-align:center; min-height:300px; display:flex; flex-direction:column; justify-content:center; box-shadow:0 6px 24px rgba(60,64,67,.1); margin-bottom:16px; position:relative; overflow:hidden; animation:cardIn .3s ease; }
  @keyframes cardIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  #wordCard .en { font-size:38px; font-weight:800; letter-spacing:.5px; }
  #wordCard .pos { font-size:14px; color:var(--muted); margin-top:10px; }
  #wordCard .cn { font-size:26px; font-weight:700; color:var(--blue); margin-top:18px; }
  #wordCard .mastery { position:absolute; top:14px; right:16px; font-size:12px; color:var(--muted); background:#f1f3f4; padding:4px 10px; border-radius:999px; }
  #wordCard .mastery.done { background:var(--green-bg); color:var(--green); }
  #wordCard .hint { font-size:13px; color:var(--muted); margin-top:22px; }
  #wordCard .stars { font-size:16px; margin-top:10px; letter-spacing:2px; }
  
  .btn-row { display:flex; gap:10px; }
  .btn-row button { flex:1; padding:16px; border:0; border-radius:14px; font-size:16px; font-weight:800; cursor:pointer; transition:transform .15s; }
  .btn-row button:active { transform:scale(.96); }
  #btnKnow { background:var(--green-bg); color:var(--green); }
  #btnUnknown { background:var(--red-bg); color:var(--red); }
  #btnShow { background:var(--blue); color:#fff; }
  
  /* 选择题选项 */
  .opt-list { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .opt { padding:16px; border:2px solid var(--line); background:var(--card); border-radius:14px; font-size:16px; cursor:pointer; text-align:left; transition:all .2s; }
  .opt:active { transform:scale(.98); }
  .opt.correct { border-color:var(--green); background:var(--green-bg); }
  .opt.wrong { border-color:var(--red); background:var(--red-bg); animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
  
  /* 拼写 */
  #spellInput { width:100%; padding:18px; font-size:22px; border:2px solid var(--line); border-radius:14px; text-align:center; margin-bottom:12px; }
  #spellInput:focus { outline:none; border-color:var(--blue); }
  #spellInput.ok { border-color:var(--green); background:var(--green-bg); }
  #spellInput.no { border-color:var(--red); background:var(--red-bg); animation:shake .4s; }
  
  .progress { text-align:center; color:var(--muted); font-size:14px; margin-bottom:12px; font-weight:600; }
  .audio-btn { padding:12px 28px; border:2px solid var(--line); background:#fff; border-radius:999px; font-size:16px; cursor:pointer; font-weight:700; }
  .audio-btn:active { transform:scale(.95); }
  
  /* 统计 */
  .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:20px; }
  .stat { background:var(--card); border-radius:14px; padding:14px 8px; text-align:center; }
  .stat .n { font-size:24px; font-weight:800; color:var(--blue); }
  .stat .l { font-size:12px; color:var(--muted); margin-top:4px; }
  
  .tabbar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; padding:8px 0; z-index:20; }
  .tabbar a { flex:1; text-align:center; text-decoration:none; color:var(--muted); font-size:11px; padding:6px 0; }
  .tabbar a .ticon { display:block; font-size:20px; margin-bottom:2px; }
</style>
</head>
<body>
<div id="topbar">
  <button class="back" onclick="location.href='/'">← 首页</button>
  <b>📚 单词学习</b>
</div>
<div id="wrap">
  <!-- 统计 -->
  <div class="stats" id="stats" style="display:none;">
    <div class="stat"><div class="n" id="stTotal">0</div><div class="l">总单词</div></div>
    <div class="stat"><div class="n" id="stMastered">0</div><div class="l">已掌握</div></div>
    <div class="stat"><div class="n" id="stToday">0</div><div class="l">今日学习</div></div>
  </div>
  
  <!-- 单元选择 -->
  <div class="unit-grid" id="unitGrid"></div>
  
  <!-- 模式选择 -->
  <div id="modeSection" style="display:none;">
    <div style="font-size:15px;font-weight:800;margin-bottom:10px;">选择学习模式</div>
    <div class="mode-grid" id="modeGrid">
      <button class="mode-btn sel" data-mode="card">📇 卡片记忆<span class="md">看英文想中文</span></button>
      <button class="mode-btn" data-mode="spell">✍️ 拼写练习<span class="md">听发音拼单词</span></button>
      <button class="mode-btn" data-mode="quiz">🎯 中英测试<span class="md">四选一挑战</span></button>
      <button class="mode-btn" data-mode="listen">🔊 听音辨义<span class="md">听发音选意思</span></button>
    </div>
  </div>
  
  <!-- 学习区 -->
  <div id="learnArea" style="display:none;">
    <div class="progress" id="progress"></div>
    <div id="wordCard">
      <div class="mastery" id="wMastery"></div>
      <div class="en" id="wEn"></div>
      <div class="pos" id="wPos"></div>
      <div class="cn" id="wCn" style="display:none;"></div>
      <div class="stars" id="wStars"></div>
      <div class="hint" id="wHint"></div>
    </div>
    <div class="opt-list" id="optList" style="display:none;"></div>
    <div id="cardBtns" class="btn-row">
      <button id="btnShow">显示中文</button>
    </div>
    <div id="knowBtns" class="btn-row" style="display:none;">
      <button id="btnUnknown">不认识</button>
      <button id="btnKnow">认识 ✓</button>
    </div>
    <div id="spellArea" style="display:none;">
      <input id="spellInput" placeholder="听发音，拼出单词" autocomplete="off" autocapitalize="off">
      <div class="btn-row" style="margin-bottom:12px;">
        <button id="btnSpellSub" style="background:var(--blue);color:#fff;">提交</button>
        <button id="btnSpellSkip" style="background:#f1f3f4;color:var(--muted);">跳过</button>
      </div>
      <div style="text-align:center;"><button class="audio-btn" id="btnPlayAudio">🔊 播放发音</button></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <a href="/"><span class="ticon">🏠</span>首页</a>
  <a href="/vocab.html"><span class="ticon">📖</span>生词本</a>
  <a href="/progress.html"><span class="ticon">📊</span>学习报告</a>
  <a href="/growth.html"><span class="ticon">🌱</span>成长</a>
  <a href="/settings.html"><span class="ticon">⚙️</span>设置</a>
</div>
<script>
// 单词学习 v2（2026-10-16）：4种模式 + 掌握度系统（3次答对才算掌握）
const UNITS = [
  { id: 'unit3', name: 'Unit 3', title: 'Computers', desc: '电脑 · 比较级最高级' },
  { id: 'unit4', name: 'Unit 4', title: 'Inventions', desc: '发明 · 被动语态' },
  { id: 'unit5', name: 'Unit 5', title: 'Educational exchanges', desc: '教育交流 · 现在完成时' },
  { id: 'unit6', name: 'Unit 6', title: 'Ancient stories', desc: '古代故事 · 现在完成时' },
];
let curUnit = null, words = [], queue = [], idx = 0, mode = 'card';
let mastery = JSON.parse(localStorage.getItem('xh_words_mastery') || '{}'); // key: unit:en -> {count:0-3}
let todayCount = parseInt(localStorage.getItem('xh_words_today_' + new Date().toDateString()) || '0');

function mkey(u, en) { return u + ':' + en; }
function getMastery(u, en) { return (mastery[mkey(u, en)] || {}).count || 0; }
function addMastery(u, en, ok) {
  const k = mkey(u, en);
  const m = mastery[k] || { count: 0 };
  if (ok) m.count = Math.min(3, m.count + 1);
  else m.count = Math.max(0, m.count - 1);
  mastery[k] = m;
  localStorage.setItem('xh_words_mastery', JSON.stringify(mastery));
  todayCount++;
  localStorage.setItem('xh_words_today_' + new Date().toDateString(), todayCount);
  updateStats();
}
function isMastered(u, en) { return getMastery(u, en) >= 3; }

function updateStats() {
  if (!curUnit || !words.length) return;
  const mastered = words.filter(w => isMastered(curUnit.id, w.en)).length;
  document.getElementById('stTotal').textContent = words.length;
  document.getElementById('stMastered').textContent = mastered;
  document.getElementById('stToday').textContent = todayCount;
  document.getElementById('stats').style.display = 'grid';
  // 更新单元卡片进度
  const pct = Math.round(mastered / words.length * 100);
  const card = document.querySelector(`[data-unit="${curUnit.id}"]`);
  if (card) {
    card.querySelector('.pfill').style.width = pct + '%';
    card.querySelector('.ptext').textContent = `已掌握 ${mastered}/${words.length}`;
  }
  // 2026-10-16：同步掌握总数到服务端（供单词成就用）
  try {
    let totalMastered = 0;
    for (const k in mastery) { if ((mastery[k] || {}).count >= 3) totalMastered++; }
    fetch('/api/word-sync', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ masteredCount: totalMastered }) }).catch(() => {});
  } catch {}
}

// 渲染单元
const grid = document.getElementById('unitGrid');
UNITS.forEach(u => {
  const d = document.createElement('div');
  d.className = 'unit-card'; d.dataset.unit = u.id;
  d.innerHTML = `<div class="un">${u.name}</div><div class="ut">${u.title}</div><div class="uc">${u.desc}</div>
    <div class="pbar"><div class="pfill" style="width:0%"></div></div><div class="ptext" id="pt-${u.id}">加载中…</div>`;
  d.onclick = () => selectUnit(u, d);
  grid.appendChild(d);
  fetch(`/words/${u.id}.json`).then(r => r.json()).then(j => {
    const m = j.words.filter(w => isMastered(u.id, w.en)).length;
    const pct = Math.round(m / j.words.length * 100);
    d.querySelector('.pfill').style.width = pct + '%';
    document.getElementById(`pt-${u.id}`).textContent = `已掌握 ${m}/${j.words.length}`;
  }).catch(() => { document.getElementById(`pt-${u.id}`).textContent = '暂无'; });
});

async function selectUnit(u, el) {
  document.querySelectorAll('.unit-card').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel');
  curUnit = u;
  try {
    const r = await fetch(`/words/${u.id}.json`);
    const j = await r.json();
    words = j.words;
    // 优先复习未掌握的词
    queue = [...words].sort((a, b) => getMastery(u.id, a.en) - getMastery(u.id, b.en));
    idx = 0;
    // 2026-10-16：进学习模式后隐藏单元看板，界面更干净
    document.getElementById('unitGrid').style.display = 'none';
    document.getElementById('modeSection').style.display = 'block';
    document.getElementById('learnArea').style.display = 'block';
    // 加一个"换单元"按钮
    if (!document.getElementById('btnChangeUnit')) {
      const btn = document.createElement('button');
      btn.id = 'btnChangeUnit';
      btn.textContent = '← 换单元';
      btn.style.cssText = 'margin-bottom:12px;padding:10px 20px;border:1px solid #dadce0;background:#fff;border-radius:999px;font-size:14px;cursor:pointer;';
      btn.onclick = () => {
        document.getElementById('unitGrid').style.display = 'grid';
        document.getElementById('modeSection').style.display = 'none';
        document.getElementById('learnArea').style.display = 'none';
        btn.remove();
      };
      document.getElementById('modeSection').prepend(btn);
    }
    updateStats();
    renderWord();
    document.getElementById('learnArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) { alert('单词表加载失败'); }
}

document.querySelectorAll('#modeGrid .mode-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#modeGrid .mode-btn').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    mode = b.dataset.mode;
    queue = [...words].sort((a, b) => getMastery(curUnit.id, a.en) - getMastery(curUnit.id, b.en));
    idx = 0;
    renderWord();
  };
});

function renderWord() {
  if (!queue.length) return;
  const w = queue[idx];
  const m = getMastery(curUnit.id, w.en);
  // 听音模式不暴露英文单词（标题只显示进度）
  const showEn = mode !== 'listen';
  document.getElementById('progress').textContent = showEn ? `${idx + 1} / ${queue.length} · ${w.en}` : `${idx + 1} / ${queue.length}`;
  document.getElementById('wEn').textContent = w.en;
  document.getElementById('wPos').textContent = w.pos || '';
  document.getElementById('wCn').textContent = w.cn;
  document.getElementById('wCn').style.display = 'none';
  // 掌握度星星
  document.getElementById('wStars').textContent = '★'.repeat(m) + '☆'.repeat(3 - m);
  const badge = document.getElementById('wMastery');
  badge.textContent = m >= 3 ? '已掌握' : `掌握度 ${m}/3`;
  badge.className = 'mastery' + (m >= 3 ? ' done' : '');
  // 短语标签（2026-10-16：课本短语单独标识）
  const posEl = document.getElementById('wPos');
  if (w.pos === 'phr.') {
    posEl.innerHTML = '<span style="background:#fff3e0;color:#e65100;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;">短语</span>';
  }
  
  // 重置各模式 UI
  document.getElementById('optList').style.display = 'none';
  document.getElementById('spellArea').style.display = 'none';
  document.getElementById('cardBtns').style.display = 'none';
  document.getElementById('knowBtns').style.display = 'none';
  
  if (mode === 'card') {
    document.getElementById('cardBtns').style.display = 'flex';
    document.getElementById('wHint').textContent = '点"显示中文"看意思';
    document.getElementById('wHint').style.display = 'block';
    document.getElementById('wEn').style.display = 'block';
  } else if (mode === 'spell') {
    document.getElementById('spellArea').style.display = 'block';
    document.getElementById('wEn').style.display = 'none'; // 拼写模式隐藏英文
    document.getElementById('wHint').textContent = w.cn;
    document.getElementById('wHint').style.display = 'block';
    const inp = document.getElementById('spellInput');
    inp.value = ''; inp.className = '';
    setTimeout(() => inp.focus(), 100);
    playAudio(w.en);
  } else if (mode === 'quiz' || mode === 'listen') {
    // 选择题模式
    document.getElementById('wHint').style.display = 'none';
    if (mode === 'listen') {
      document.getElementById('wEn').style.display = 'none';
      document.getElementById('wHint').textContent = '听发音，选正确的中文意思';
      document.getElementById('wHint').style.display = 'block';
      playAudio(w.en);
      // 2026-10-16加：听音模式重播按钮（没听清可重听）
      let replayBtn = document.getElementById('btnReplay');
      if (!replayBtn) {
        replayBtn = document.createElement('button');
        replayBtn.id = 'btnReplay';
        replayBtn.className = 'audio-btn';
        replayBtn.textContent = '🔊 重播发音';
        replayBtn.style.marginBottom = '12px';
        document.getElementById('optList').before(replayBtn);
      }
      replayBtn.style.display = 'inline-block';
      replayBtn.onclick = () => playAudio(w.en);
    } else {
      document.getElementById('wEn').style.display = 'block';
      const rb = document.getElementById('btnReplay');
      if (rb) rb.style.display = 'none';
    }
    buildOptions(w);
  }
  // 卡片动画
  const card = document.getElementById('wordCard');
  card.style.animation = 'none'; card.offsetHeight; card.style.animation = '';
}

function buildOptions(w) {
  const list = document.getElementById('optList');
  list.style.display = 'flex'; list.innerHTML = '';
  // 随机选3个干扰项
  const others = words.filter(x => x.en !== w.en);
  const distract = [];
  while (distract.length < 3 && others.length) {
    const i = Math.floor(Math.random() * others.length);
    distract.push(others.splice(i, 1)[0]);
  }
  const opts = [...distract.map(d => ({ cn: d.cn, ok: false })), { cn: w.cn, ok: true }]
    .sort(() => Math.random() - 0.5);
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = o.cn;
    b.onclick = () => {
      list.querySelectorAll('.opt').forEach(x => x.style.pointerEvents = 'none');
      if (o.ok) {
        b.classList.add('correct');
        addMastery(curUnit.id, w.en, true);
        setTimeout(nextWord, 800);
      } else {
        b.classList.add('wrong');
        addMastery(curUnit.id, w.en, false);
        // 标出正确项
        [...list.children].forEach(x => { if (x.textContent === w.cn) x.classList.add('correct'); });
        setTimeout(nextWord, 1500);
      }
    };
    list.appendChild(b);
  });
}

document.getElementById('btnShow').onclick = () => {
  document.getElementById('wCn').style.display = 'block';
  document.getElementById('wHint').style.display = 'none';
  document.getElementById('cardBtns').style.display = 'none';
  document.getElementById('knowBtns').style.display = 'flex';
};
function nextWord() {
  idx++;
  if (idx >= queue.length) {
    const m = words.filter(w => isMastered(curUnit.id, w.en)).length;
    // 卡片模式循环复习，其他模式显示完成页（2026-10-16：测试/拼写/听音做完要结束，不能无限循环）
    if (mode === 'card') {
      queue = [...words].sort((a, b) => getMastery(curUnit.id, a.en) - getMastery(curUnit.id, b.en));
      idx = 0;
      if (m === words.length) { showComplete(); return; }
    } else {
      showComplete();
      return;
    }
  }
  updateStats();
  renderWord();
}

function showComplete() {
  const m = words.filter(w => isMastered(curUnit.id, w.en)).length;
  document.getElementById('learnArea').innerHTML = `
    <div style="background:#fff;border-radius:22px;padding:48px 24px;text-align:center;box-shadow:0 6px 24px rgba(60,64,67,.1);">
      <div style="font-size:56px;">🎉</div>
      <h2 style="margin:16px 0 8px;">本轮完成！</h2>
      <p style="color:#5f6368;">${curUnit.name} 已掌握 ${m}/${words.length} 个词</p>
      <div class="btn-row" style="margin-top:24px;">
        <button onclick="location.reload()" style="background:#1a73e8;color:#fff;">再来一轮</button>
        <button onclick="document.getElementById('learnArea').style.display='none';document.getElementById('unitGrid').style.display='grid';" style="background:#f1f3f4;color:#5f6368;">换单元</button>
      </div>
    </div>`;
}
document.getElementById('btnKnow').onclick = () => { addMastery(curUnit.id, queue[idx].en, true); nextWord(); };
document.getElementById('btnUnknown').onclick = () => { addMastery(curUnit.id, queue[idx].en, false); nextWord(); };

document.getElementById('btnSpellSub').onclick = () => {
  const w = queue[idx];
  const inp = document.getElementById('spellInput');
  const val = inp.value.trim().toLowerCase();
  if (val === w.en.toLowerCase()) {
    inp.className = 'ok';
    addMastery(curUnit.id, w.en, true);
    spellWrong = 0;
    setTimeout(nextWord, 600);
  } else {
    spellWrong = (spellWrong || 0) + 1;
    inp.className = 'no';
    addMastery(curUnit.id, w.en, false);
    // 2026-10-16修：错3次显示正确答案，不让孩子无限重试
    if (spellWrong >= 3) {
      inp.value = w.en;
      inp.className = 'ok';
      document.getElementById('wHint').textContent = `答案：${w.en}（${w.cn}）`;
      setTimeout(() => { spellWrong = 0; nextWord(); }, 2000);
    } else {
      setTimeout(() => { inp.value = ''; inp.className = ''; inp.focus(); }, 800);
    }
  }
};
document.getElementById('btnSpellSkip').onclick = () => { addMastery(curUnit.id, queue[idx].en, false); nextWord(); };
document.getElementById('spellInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('btnSpellSub').click();
});

function playAudio(text) {
  // 2026-10-16改：优先播放预录制MP3（iOS上speechSynthesis无声），404再回退到TTS
  try {
    const unitDir = (typeof curUnit !== 'undefined' && curUnit && curUnit.id)
      ? curUnit.id.replace('unit', 'u') : 'u3';
    const fn = String(text).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') + '.mp3';
    const url = '/audio/words/' + unitDir + '/' + fn;
    const audio = new Audio(url);
    audio.oncanplaythrough = () => { try { audio.play(); } catch {} };
    audio.onerror = () => playAudioTTS(text); // MP3缺失/404 → 回退TTS
    // 超时兜底：2秒还没能播放就回退TTS
    const timer = setTimeout(() => { try { audio.pause(); } catch {} playAudioTTS(text); }, 2000);
    audio.onplay = () => clearTimeout(timer);
    audio.load();
  } catch { playAudioTTS(text); }
}
function playAudioTTS(text) {
  try {
    // 2026-10-16修：听音模式音频无声问题——确保 speechSynthesis 可用，加重试
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.8; u.volume = 1;
    // 有些浏览器需要先获取 voices
    const voices = speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith('en'));
    if (enVoice) u.voice = enVoice;
    speechSynthesis.speak(u);
  } catch {}
}
// 页面加载时预热 voices（解决首次播放无声）
try { if ('speechSynthesis' in window) speechSynthesis.getVoices(); } catch {}
document.getElementById('btnPlayAudio').onclick = () => { if (queue[idx]) playAudio(queue[idx].en); };
try { const th = localStorage.getItem('xh_theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch {}
</script>
