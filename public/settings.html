<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>设置 - 小禾英语</title>
<style>
  /* 小禾英语设置页（2026-10-12 美化版）：清新学园风，只改样式不改结构 */
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; background:var(--bg); color:var(--ink); padding-bottom:96px; -webkit-font-smoothing:antialiased; }

  /* 顶部栏：轻盈毛玻璃 */
  .top { position:sticky; top:0; background:rgba(255,255,255,.88); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); padding:14px 20px; display:flex; align-items:center; gap:12px; z-index:10; }
  .top button { background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 14px; font-size:15px; cursor:pointer; color:var(--ink); box-shadow:var(--shadow-sm); transition:transform .15s ease, background .2s ease; }
  .top button:active { transform:scale(.96); }
  .top h1 { font-size:19px; margin:0; font-weight:700; letter-spacing:.5px; }

  /* 设置项卡片：清晰分组层级 */
  .card { margin:20px 16px; background:var(--card); border-radius:var(--radius-lg); padding:24px 22px; border:1px solid rgba(225,229,235,.6); box-shadow:var(--shadow-sm); }
  .card h2 { font-size:17px; margin:0 0 10px; font-weight:700; letter-spacing:.3px; }
  .card p { font-size:14px; color:var(--muted); margin:0 0 20px; line-height:1.7; }

  /* 滑杆行 */
  .speed-row { display:flex; align-items:center; gap:12px; margin:16px 0; }
  .speed-val { font-size:22px; font-weight:800; color:var(--blue); min-width:70px; text-align:center; font-variant-numeric:tabular-nums; }

  /* 自定义滑杆：圆润轨道 + 立体滑块 */
  .speed-row input[type=range] {
    flex:1; -webkit-appearance:none; appearance:none; height:8px; border-radius:99px;
    background:#e3e8f0;
    outline:none; cursor:pointer; border:0;
  }
  .speed-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:26px; height:26px; border-radius:50%;
    background:#fff; border:3px solid var(--blue);
    box-shadow:0 2px 8px rgba(26,115,232,.35); cursor:pointer;
    transition:transform .15s ease;
  }
  .speed-row input[type=range]::-webkit-slider-thumb:active { transform:scale(1.15); }
  .speed-row input[type=range]::-moz-range-track { height:8px; border-radius:99px; background:#e3e8f0; }
  .speed-row input[type=range]::-moz-range-progress { height:8px; border-radius:99px; background:var(--blue); }
  .speed-row input[type=range]::-moz-range-thumb {
    width:20px; height:20px; border-radius:50%;
    background:#fff; border:3px solid var(--blue);
    box-shadow:0 2px 8px rgba(26,115,232,.35); cursor:pointer;
  }

  /* 预设/主题切换按钮：更精致的选中态 */
  .speed-btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .speed-btns button {
    flex:1; min-width:72px; padding:13px 6px;
    border:2px solid var(--line); border-radius:var(--radius-md);
    background:var(--card); font-size:15px; font-weight:500; color:var(--ink);
    cursor:pointer; transition:all .2s ease; box-shadow:var(--shadow-sm);
  }
  .speed-btns button:active { transform:scale(.96); }
  .speed-btns button.on {
    border-color:var(--blue); background:var(--blue-light); color:var(--blue);
    font-weight:700; box-shadow:0 2px 10px rgba(26,115,232,.25);
    transform:translateY(-1px);
  }

  /* 试听按钮：btn-primary 风格（统一主按钮语言） */
  .test-row { margin-top:20px; text-align:center; }
  .test-row button {
    padding:13px 40px; border:0; border-radius:var(--radius-md);
    background:linear-gradient(135deg, var(--blue) 0%, #4a8ef7 100%);
    color:#fff; font-size:16px; font-weight:700; cursor:pointer;
    box-shadow:0 4px 14px rgba(26,115,232,.35), inset 0 1px 0 rgba(255,255,255,.2);
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .test-row button:hover { box-shadow:0 6px 18px rgba(26,115,232,.45), inset 0 1px 0 rgba(255,255,255,.2); }
  .test-row button:active { transform:scale(.97); }

  /* 底部导航 */
  .bottomnav { position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid rgba(225,229,235,.8); display:flex; z-index:10; box-shadow:0 -2px 12px rgba(60,64,67,.06); }
  .bottomnav a { flex:1; text-align:center; padding:10px 0 14px; text-decoration:none; color:var(--muted); font-size:12px; }
  .bottomnav a.on { color:var(--blue); font-weight:700; }

  /* 主题（2026-10-11 加，保留并对齐变量） */
  html[data-theme="warm"] body { background:#fdf6e3; color:#5c4b37; }
  html[data-theme="warm"] .card, html[data-theme="warm"] .top, html[data-theme="warm"] .bottomnav { background:#fffdf5; border-color:#e8dcc0; }
  html[data-theme="warm"] .top h1, html[data-theme="warm"] .card h2 { color:#5c4b37; }
  html[data-theme="warm"] .speed-btns button.on { background:#fef6e3; border-color:#e8710a; color:#e8710a; }
  html[data-theme="dark"] body { background:#1a1a1a; color:#e0e0e0; }
  html[data-theme="dark"] .card, html[data-theme="dark"] .top, html[data-theme="dark"] .bottomnav { background:#2d2d2d; border-color:#444; }
  html[data-theme="dark"] .top { background:rgba(45,45,45,.88); }
  html[data-theme="dark"] .bottomnav { background:rgba(45,45,45,.92); }
  html[data-theme="dark"] .top h1, html[data-theme="dark"] .card h2 { color:#fff; }
  html[data-theme="dark"] .card p { color:#aaa; }
  html[data-theme="dark"] .speed-btns button { background:#3d3d3d; border-color:#555; color:#e0e0e0; }
  html[data-theme="dark"] .speed-btns button.on { background:#1a3a5c; border-color:#7ab8ff; color:#7ab8ff; }
  html[data-theme="dark"] .top button { border-color:#555; color:#e0e0e0; background:#3d3d3d; }
  html[data-theme="dark"] .bottomnav a { color:#999; }
  html[data-theme="dark"] .bottomnav a.on { color:#7ab8ff; }
  html[data-theme="dark"] .speed-row input[type=range] { background:#444; }
  html[data-theme="dark"] .speed-row input[type=range]::-webkit-slider-thumb { border-color:#7ab8ff; box-shadow:0 2px 8px rgba(122,184,255,.35); }
  html[data-theme="dark"] .speed-row input[type=range]::-moz-range-track { background:#444; }
  html[data-theme="dark"] .speed-row input[type=range]::-moz-range-progress { background:#7ab8ff; }
  html[data-theme="dark"] .speed-row input[type=range]::-moz-range-thumb { border-color:#7ab8ff; }
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="top">
  <button onclick="location.href='/'">← 首页</button>
  <h1>⚙️ 设置</h1>
</div>

<div class="card">
  <h2>🔊 阅读材料播放速度</h2>
  <p>控制课程里阅读材料、句子点读、音标例词的播放速度。调慢一点听得更清楚，调快一点节省时间。</p>
  <div class="speed-row">
    <span style="font-size:14px;color:#888;">慢</span>
    <input type="range" id="speedRange" min="0.5" max="2.0" step="0.1" value="1.0">
    <span style="font-size:14px;color:#888;">快</span>
    <div class="speed-val" id="speedVal">1.0x</div>
  </div>
  <div class="speed-btns">
    <button data-v="0.6">0.6x 很慢</button>
    <button data-v="0.8">0.8x 慢</button>
    <button data-v="1.0">1.0x 正常</button>
    <button data-v="1.2">1.2x 快</button>
  </div>
  <div class="test-row">
    <button id="btnTest">🔊 试听一下</button>
  </div>
</div>

<div class="card">
  <h2>🔠 字体大小</h2>
  <p>调大调小课程里的字。眼睛累了就调大一点。</p>
  <div class="speed-row">
    <span style="font-size:14px;color:#888;">小</span>
    <input type="range" id="fontRange" min="0.8" max="1.5" step="0.1" value="1.0">
    <span style="font-size:14px;color:#888;">大</span>
    <div class="speed-val" id="fontVal">1.0x</div>
  </div>
  <div class="speed-btns">
    <button data-fv="0.8">0.8x 小</button>
    <button data-fv="1.0">1.0x 正常</button>
    <button data-fv="1.2">1.2x 大</button>
  </div>
</div>

<div class="card">
  <h2>🎨 外观主题</h2>
  <p>换个背景颜色，晚上学不刺眼。</p>
  <div class="speed-btns" id="themeBtns">
    <button data-tv="light">☀️ 日间</button>
    <button data-tv="warm">📖 护眼</button>
    <button data-tv="dark">🌙 夜间</button>
  </div>
</div>

<div class="card">
  <h2>📝 反馈问题</h2>
  <p>遇到问题、看不懂、想提建议，在这里告诉老师，老师会尽快回复。</p>
  <textarea id="fbText" placeholder="比如：第8题点提交没反应…" style="width:100%;min-height:80px;border:1px solid #dadce0;border-radius:10px;padding:10px;font-size:15px;box-sizing:border-box;"></textarea>
  <div style="margin-top:10px;">
    <label for="fbImg" style="display:inline-block;padding:9px 16px;border:1px dashed #1a73e8;border-radius:10px;color:#1a73e8;font-size:14px;font-weight:700;cursor:pointer;">📷 加截图</label>
    <input type="file" id="fbImg" accept="image/*" style="display:none;">
    <span id="fbImgName" style="font-size:13px;color:#5f6368;margin-left:8px;"></span>
  </div>
  <img id="fbPreview" style="max-width:100%;max-height:140px;border-radius:8px;margin-top:8px;display:none;">
  <div id="fbHint" style="font-size:13px;color:#5f6368;margin-top:8px;"></div>
  <button id="fbSubmit" style="margin-top:10px;width:100%;padding:12px;border:0;border-radius:10px;background:#1a73e8;color:#fff;font-size:15px;font-weight:700;cursor:pointer;">发送给老师</button>
  <div style="margin-top:14px;border-top:1px solid #eee;padding-top:10px;">
    <div style="font-size:14px;font-weight:700;margin-bottom:8px;">📋 我的反馈</div>
    <div id="fbList" style="font-size:13px;"></div>
  </div>
</div>

<div class="bottomnav">
  <a href="/">🏠<br>首页</a>
  <a href="/vocab.html">📖<br>生词本</a>
  <a href="/progress.html">📊<br>学习报告</a>
  <a href="/growth.html">🌱<br>成长</a>
  <a href="/settings.html" class="on">⚙️<br>设置</a>
</div>

<script>
function getSpeed() {
  try {
    const v = parseFloat(localStorage.getItem('xh_play_speed'));
    return (v >= 0.5 && v <= 2.0) ? v : 1.0;
  } catch { return 1.0; }
}
function setSpeed(v) {
  v = Math.round(v * 10) / 10;
  try { localStorage.setItem('xh_play_speed', String(v)); } catch {}
  document.getElementById('speedRange').value = v;
  document.getElementById('speedVal').textContent = v.toFixed(1) + 'x';
  document.querySelectorAll('.speed-btns button').forEach(b => {
    b.classList.toggle('on', Math.abs(parseFloat(b.dataset.v) - v) < 0.05);
  });
}
document.getElementById('speedRange').addEventListener('input', e => {
  setSpeed(parseFloat(e.target.value));
});
document.querySelectorAll('.speed-btns button').forEach(b => {
  b.onclick = () => setSpeed(parseFloat(b.dataset.v));
});
document.getElementById('btnTest').onclick = () => {
  const a = new Audio('/audio/phonics/cat.mp3');
  try { a.playbackRate = getSpeed(); } catch {}
  a.play().catch(() => {});
};
setSpeed(getSpeed());

// ---- 字体大小（2026-10-11 加） ----
function getFontSize() {
  try {
    const v = parseFloat(localStorage.getItem('xh_font_size'));
    return (v >= 0.8 && v <= 1.5) ? v : 1.0;
  } catch { return 1.0; }
}
function setFontSize(v) {
  v = Math.round(v * 10) / 10;
  try { localStorage.setItem('xh_font_size', String(v)); } catch {}
  document.getElementById('fontRange').value = v;
  document.getElementById('fontVal').textContent = v.toFixed(1) + 'x';
  document.querySelectorAll('[data-fv]').forEach(b => {
    b.classList.toggle('on', Math.abs(parseFloat(b.dataset.fv) - v) < 0.05);
  });
  applyFontSize();
}
function applyFontSize() {
  // 由 theme.js 统一用 zoom 处理，这里只更新显示
}
document.getElementById('fontRange').addEventListener('input', e => {
  setFontSize(parseFloat(e.target.value));
});
document.querySelectorAll('[data-fv]').forEach(b => {
  b.onclick = () => setFontSize(parseFloat(b.dataset.fv));
});

// ---- 外观主题（2026-10-11 加） ----
function getTheme() {
  try { return localStorage.getItem('xh_theme') || 'light'; } catch { return 'light'; }
}
function setTheme(t) {
  try { localStorage.setItem('xh_theme', t); } catch {}
  document.querySelectorAll('[data-tv]').forEach(b => {
    b.classList.toggle('on', b.dataset.tv === t);
  });
  applyTheme();
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', getTheme());
}
document.querySelectorAll('[data-tv]').forEach(b => {
  b.onclick = () => setTheme(b.dataset.tv);
});

// 初始化
setFontSize(getFontSize());
setTheme(getTheme());

// ---------- 反馈问题（2026-10-19：从浮动按钮移到设置页） ----------
let _fbImgB64 = '';
document.getElementById('fbImg').addEventListener('change', function() {
  const f = this.files && this.files[0]; if (!f) return;
  document.getElementById('fbImgName').textContent = '压缩中…';
  const img = new Image();
  img.onload = () => {
    try {
      const s = Math.min(1, 1000 / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      _fbImgB64 = c.toDataURL('image/jpeg', 0.7);
      const pv = document.getElementById('fbPreview'); pv.src = _fbImgB64; pv.style.display = 'block';
      document.getElementById('fbImgName').textContent = '已添加 ✓';
    } catch { document.getElementById('fbImgName').textContent = '图片处理失败'; }
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
});
document.getElementById('fbSubmit').addEventListener('click', async () => {
  const hint = document.getElementById('fbHint');
  const text = document.getElementById('fbText').value.trim();
  if (!text && !_fbImgB64) { hint.textContent = '写点文字或加张截图吧。'; return; }
  hint.textContent = '发送中…';
  try {
    const r = await fetch('/api/feedback', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, image_b64: _fbImgB64, url: location.href }) });
    const d = await r.json().catch(() => ({}));
    if (d && d.ok) {
      hint.textContent = '已收到！老师会尽快回复，在下方"我的反馈"里查看。';
      document.getElementById('fbText').value = ''; _fbImgB64 = '';
      document.getElementById('fbPreview').style.display = 'none';
      document.getElementById('fbImgName').textContent = '';
      loadFbList();
    } else hint.textContent = '发送失败，再点一次试试。';
  } catch { hint.textContent = '网络不好，稍后再试。'; }
});
async function loadFbList() {
  const box = document.getElementById('fbList');
  try {
    const r = await fetch('/api/feedback/mine', { cache: 'no-store' });
    const d = await r.json().catch(() => ({}));
    const list = (d && d.list) || [];
    if (!list.length) { box.innerHTML = '<div style="color:#999;">还没有反馈记录。</div>'; return; }
    const safe = s => String(s || '').replace(/</g, '&lt;');
    box.innerHTML = list.map(f => {
      const st = f.status === 'replied' ? '✅ 老师已回复' : '⏳ 老师处理中';
      return '<div style="border:1px solid #eee;border-radius:8px;padding:8px;margin-bottom:6px;">'
        + '<div style="color:#999;font-size:12px;">' + safe(f.t) + ' · ' + st + '</div>'
        + '<div style="margin-top:4px;">' + safe(f.text) + '</div>'
        + (f.reply ? '<div style="margin-top:6px;background:#f0f7ff;border-radius:6px;padding:8px;">👩‍🏫 老师回复：' + safe(f.reply) + '</div>' : '')
        + '</div>';
    }).join('');
  } catch { box.innerHTML = '<div style="color:#999;">加载失败。</div>'; }
}
loadFbList();
// 每2分钟刷新一次，有新回复自动显示
setInterval(loadFbList, 120000);
</script>
</body>
</html>
