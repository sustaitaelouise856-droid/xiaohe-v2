<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小禾英语 · 验证</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; font-size: 18px; }
  input, button { font-size: 18px; padding: 10px; width: 100%; box-sizing: border-box; margin-top: 12px; }
  button { background: #1a73e8; color: #fff; border: 0; border-radius: 8px; }
  #msg { color: #c00; min-height: 1.5em; }
</style>
</head>
<body>
<h2>请输入访问码</h2>
<p id="msg"></p>
<input id="code" type="password" placeholder="访问码" autocomplete="off">
<button id="go">进入</button>
<script>
document.getElementById('go').onclick = async () => {
  const code = document.getElementById('code').value;
  const r = await fetch('/api/verify', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ access_code: code })
  });
  const b = await r.json();
  if (b.ok) location.href = '/';
  else document.getElementById('msg').textContent =
    r.status === 429 ? '试得太多了，请过 10 分钟再试。' : '访问码不对，请再试一次。';
};
</script>
</body>
</html>
