<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小禾英语 · 学习地图</title>
<style>
  :root {
    --blue: #1a73e8;
    --blue-dark: #1558b0;
    --green: #34a853;
    --gray: #dadce0;
    --ink: #202124;
    --muted: #5f6368;
    --bg: #f0f4fa;
    --card: #ffffff;
    --shadow-sm: 0 1px 3px rgba(60,64,67,.08), 0 1px 2px rgba(60,64,67,.06);
    --shadow-md: 0 4px 12px rgba(60,64,67,.10), 0 2px 6px rgba(60,64,67,.08);
    --shadow-blue: 0 8px 20px rgba(26,115,232,.35);
    --radius-lg: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh;
  }
  /* 顶部：三层渐变 + 圆点纹理 + 柔光装饰 */
  .hero {
    position: relative; overflow: hidden;
    background: linear-gradient(150deg, #1a73e8 0%, #3f6fe0 45%, #7b4fd6 100%);
    color: #fff; padding: 34px 22px 30px;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 8px 24px rgba(26,115,232,.28);
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,.13) 1.5px, transparent 1.7px);
    background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(180deg, #000 50%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 50%, transparent 100%);
  }
  .hero::after {
    content: ""; position: absolute; width: 230px; height: 230px;
    right: -75px; top: -75px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.20) 0%, transparent 65%);
    pointer-events: none;
  }
  .hero > * { position: relative; z-index: 1; }
  .hero h1 { margin: 0; font-size: 27px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 2px 10px rgba(0,0,0,.20); }
  .hero .sub { margin: 10px 0 0; font-size: 13.5px; opacity: .92; letter-spacing: 1px; }
  .hero .stats { display: flex; gap: 12px; margin-top: 18px; }
  .stat {
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 16px; padding: 10px 16px;
    font-size: 12.5px; letter-spacing: .5px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.15);
  }
  .stat b { font-size: 20px; font-weight: 800; display: block; letter-spacing: .5px; }
  .progress-bar {
    height: 8px; background: rgba(255,255,255,.28);
    border-radius: 99px; margin-top: 16px; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffffff, #d6e7ff);
    border-radius: 99px;
    box-shadow: 0 0 10px rgba(255,255,255,.75);
    transition: width .6s cubic-bezier(.4,0,.2,1);
  }
  /* 继续学习按钮：蓝紫渐变 + 立体阴影 */
  .continue-wrap { padding: 20px 20px 0; }
  .btn-continue {
    display: block; width: 100%;
    background: linear-gradient(135deg, #1a73e8 0%, #4a8ef7 55%, #7b5ff0 130%);
    color: #fff;
    border: 0; border-radius: var(--radius-lg);
    padding: 18px; font-size: 18.5px; font-weight: 800; letter-spacing: 1.5px;
    cursor: pointer;
    box-shadow: var(--shadow-blue), inset 0 1px 0 rgba(255,255,255,.28);
    transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
  }
  .btn-continue:hover { filter: brightness(1.07); box-shadow: 0 10px 26px rgba(26,115,232,.45), inset 0 1px 0 rgba(255,255,255,.28); }
  .btn-continue:active { transform: scale(.97); box-shadow: 0 4px 12px rgba(26,115,232,.30); }
  .btn-continue small { display: block; font-size: 13px; font-weight: 400; opacity: .93; margin-top: 6px; letter-spacing: 1px; }
  /* 称号系统（2026-10-12 Elouise：mastery-based，不是打卡） */
  .titles-card {
    margin: 12px 20px 0; background: #fff; border-radius: 16px;
    padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .titles-head { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .titles-grid { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .title-badge {
    flex: 0 0 auto; width: 104px; text-align: center;
    border-radius: 12px; padding: 10px 6px; font-size: 12px;
  }
  .title-badge.earned {
    background: linear-gradient(180deg, #fff8e6, #ffedb8);
    border: 2px solid #f2c14e; box-shadow: 0 2px 8px rgba(242,193,78,.35);
  }
  .title-badge.locked-t {
    background: #f4f6f9; border: 2px dashed #d0d5dd; color: #98a2b3;
  }
  .title-badge .ticon2 { font-size: 30px; display: block; margin-bottom: 4px; }
  .title-badge.locked-t .ticon2 { filter: grayscale(1); opacity: .5; }
  .title-badge .tname { font-weight: 700; font-size: 12px; display: block; }
  .title-badge.earned .tname { color: #b54708; }
  .title-badge .tdesc { font-size: 10px; line-height: 1.4; display: block; margin-top: 4px; }
  /* 每日签到（2026-10-11） */
  .checkin-card {
    margin: 16px 20px 0; background: #fff; border-radius: 16px;
    padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .checkin-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .checkin-title { font-size: 16px; font-weight: 700; }
  .checkin-streak { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .checkin-streak b { color: #e8710a; font-size: 20px; }
  .btn-checkin {
    background: linear-gradient(180deg, #ff9f2e, #e8710a); color: #fff;
    border: 0; border-radius: 12px; padding: 12px 26px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 12px rgba(232,113,10,.32); white-space: nowrap;
  }
  .btn-checkin:active { transform: scale(.97); }
  .btn-checkin.done { background: #e8eaed; color: var(--muted); box-shadow: none; }
  .btn-checkin:disabled { cursor: default; }
  .checkin-week { display: flex; gap: 6px; margin-top: 12px; }
  /* 日历模式（2026-10-12） */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
  .cal-head { text-align: center; font-size: 12px; color: var(--muted); padding: 4px; }
  .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 8px; background: #f5f5f5; }
  .cal-day.checked { background: #e6f4ea; color: #137333; font-weight: 700; }
  .cal-day.today { border: 2px solid var(--blue); font-weight: 700; }
  .cal-day.future { opacity: 0.3; }
  .cal-day.empty { background: transparent; }
  .cday {
    flex: 1; text-align: center; background: #f4f6f9; border-radius: 10px;
    padding: 8px 0 6px; font-size: 12px; color: var(--muted);
  }
  .cday span { display: block; margin-bottom: 2px; }
  .cday b { font-size: 16px; font-weight: 400; }
  .cday.on { background: #fef3e2; }
  .cday.on b { color: #e8710a; }
  .cday.today { outline: 2px solid var(--blue); outline-offset: -2px; }
  /* 单元：更大的呼吸感 */
  .units { padding: 12px 16px 112px; max-width: 720px; margin: 0 auto; }
  .unit { margin-top: 28px; }
  .unit-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px; padding: 0 6px;
  }
  .unit-head h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: .5px; }
  .unit-head .count {
    font-size: 12px; font-weight: 700; color: var(--muted);
    background: rgba(26,115,232,.08);
    padding: 4px 13px; border-radius: 99px;
  }
  .nodes {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .node {
    background: var(--card); border-radius: var(--radius-lg);
    padding: 15px 6px; text-align: center;
    cursor: pointer; border: 2px solid transparent;
    box-shadow: var(--shadow-sm);
    transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, border-color .2s ease, background .25s ease, opacity .25s ease;
    min-height: 94px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .node:active { transform: scale(.93); }
  .node .icon { font-size: 26px; margin-bottom: 6px; transition: transform .22s ease; }
  .node .name { font-size: 12.5px; font-weight: 700; line-height: 1.35; }
  .node .label { font-size: 10.5px; color: var(--muted); margin-top: 3px; letter-spacing: .5px; }
  /* 状态：视觉区分更清晰 */
  .node.done {
    border-color: #b7e0c3;
    background: linear-gradient(180deg, #f5fbf6 0%, #e9f7ed 100%);
  }
  .node.done .icon { color: var(--green); filter: drop-shadow(0 2px 4px rgba(52,168,83,.30)); }
  .node.done .name { color: #1e7e34; }
  .node.current {
    border-color: var(--blue);
    background: linear-gradient(180deg, #f2f7ff 0%, #e6effe 100%);
    box-shadow: 0 0 0 4px rgba(26,115,232,.16), 0 6px 16px rgba(26,115,232,.22);
    animation: nodePulse 2.4s ease-in-out infinite;
  }
  @keyframes nodePulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(26,115,232,.16), 0 6px 16px rgba(26,115,232,.22); }
    50% { box-shadow: 0 0 0 8px rgba(26,115,232,.09), 0 6px 16px rgba(26,115,232,.26); }
  }
  .node.current .icon { color: var(--blue); transform: scale(1.1); }
  .node.current .name { color: var(--blue-dark); }
  .node.available { background: var(--card); border: 2px solid #e4e8f0; }
  .node.available:hover { border-color: #9ec1fa; transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .node.locked { opacity: .5; cursor: not-allowed; background: #f6f7f9; border: 2px dashed #cfd4dc; }
  .node.locked .icon { filter: grayscale(1); opacity: .7; }
  .node.locked .name, .node.locked .label { color: #98a2b3; }
  /* 2026-10-13：锁定弹窗深色模式（走查发现白字白底看不见） */
  html[data-theme="dark"] #lockedBox { background:#2d2d2d !important; }
  html[data-theme="dark"] #lockedBox .locked-title { color:#f0f0f0 !important; }
  html[data-theme="dark"] #lockedClose { background:#3a3a3a !important; color:#f0f0f0 !important; }
  html[data-theme="dark"] #lockedList > div { color:#aaa !important; }
  html[data-theme="dark"] #lockedList > div > div { background:#3a3a3a !important; }
  html[data-theme="dark"] #lockedList > div > div > div:first-child { color:#f0f0f0 !important; }
  /* 2026-10-16：今日学习计划+单词进度深色适配（走查发现白底浅字看不见） */
  html[data-theme="dark"] #dailyPlan { background:#2d2d2d !important; border-color:#444 !important; }
  html[data-theme="dark"] #dailyPlan > div:first-child { color:#f0f0f0 !important; }
  html[data-theme="dark"] #dailyPlanList > div { background:#3a3a3a !important; border-color:#555 !important; }
  html[data-theme="dark"] #dailyPlanList span { color:#f0f0f0 !important; }
  html[data-theme="dark"] #wordsProgress > div { background:#3a3a3a !important; }
  html[data-theme="dark"] #wordsProgress div { color:#f0f0f0 !important; }
  .node.available .icon { color: #9aa0a6; }
  /* 底部导航：毛玻璃 + 轻盈阴影 */
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid rgba(225,229,235,.8);
    box-shadow: 0 -4px 16px rgba(60,64,67,.08);
    display: flex; padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .tabbar a {
    flex: 1; text-align: center; text-decoration: none;
    color: var(--muted); font-size: 11px; font-weight: 500;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: color .2s ease;
  }
  .tabbar a .ticon { font-size: 23px; }
  .tabbar a.active { color: var(--blue); font-weight: 800; }
  /* 平板 */
  @media (min-width: 600px) {
    .units { max-width: 860px; }
    .nodes { gap: 16px; }
    .node { min-height: 108px; padding: 18px 8px; }
    .node .icon { font-size: 32px; }
    .node .name { font-size: 14.5px; }
    .hero h1 { font-size: 33px; }
    .hero { padding: 40px 30px 34px; }
  }
  /* 深色模式补充（theme.css 已覆盖基础，此处补新样式的深色适配） */
  html[data-theme="dark"] .hero { box-shadow: 0 8px 26px rgba(0,0,0,.45) !important; }
  html[data-theme="dark"] .btn-continue {
    background: linear-gradient(135deg, #4a8ef7 0%, #6c8ff5 55%, #8b5cf6 130%) !important;
    color: #fff !important; border: 0 !important;
    box-shadow: 0 8px 20px rgba(74,142,247,.30), inset 0 1px 0 rgba(255,255,255,.20) !important;
  }
  html[data-theme="dark"] .node.done {
    background: linear-gradient(180deg, #1e3a26 0%, #172e1e 100%) !important;
    border-color: #3d7a4e !important;
  }
  html[data-theme="dark"] .node.done .name { color: #7ddba0 !important; }
  html[data-theme="dark"] .node.current {
    background: linear-gradient(180deg, #1a2c4a 0%, #152441 100%) !important;
    border-color: #5b9df5 !important;
  }
  html[data-theme="dark"] .node.current .name { color: #a9c9fb !important; }
  html[data-theme="dark"] .node.available { background: #2d2d2d !important; border-color: #454545 !important; }
  html[data-theme="dark"] .node.locked { background: #222 !important; border-color: #5a5a5a !important; }
  html[data-theme="dark"] .unit-head .count { background: rgba(122,184,255,.12) !important; color: #a0a0a0 !important; }
</style>

<script src="/theme.js"></script>

<style>

#titleModalWall.tier-platinum .tier-badge { background:linear-gradient(135deg,#006064 0%,#4dd0e1 25%,#80deea 50%,#4dd0e1 75%,#006064 100%); color:#fff; box-shadow:0 6px 24px rgba(0,172,193,.7), 0 2px 6px rgba(0,0,0,.2); }
#titleModalWall.tier-diamond .tier-badge { background:linear-gradient(135deg,#01579b 0%,#4fc3f7 25%,#81d4fa 50%,#4fc3f7 75%,#01579b 100%); color:#fff; box-shadow:0 6px 24px rgba(2,136,209,.7), 0 2px 6px rgba(0,0,0,.2); }
#titleModalWall.tier-master .tier-badge { background:linear-gradient(135deg,#4a148c 0%,#ab47bc 25%,#ce93d8 50%,#ab47bc 75%,#4a148c 100%); color:#fff; box-shadow:0 6px 24px rgba(123,31,162,.7), 0 2px 6px rgba(0,0,0,.2); }
#titleModalWall.tier-grandmaster .tier-badge { background:linear-gradient(135deg,#880e4f 0%,#ec407a 25%,#f48fb1 50%,#ec407a 75%,#880e4f 100%); color:#fff; box-shadow:0 6px 24px rgba(216,27,96,.7), 0 2px 6px rgba(0,0,0,.2); }
#titleModalWall.tier-king .tier-badge { background:linear-gradient(135deg,#bf360c 0%,#ffa726 25%,#ffcc80 50%,#ffa726 75%,#bf360c 100%); color:#fff; box-shadow:0 8px 28px rgba(255,111,0,.8), 0 2px 8px rgba(0,0,0,.25); }
#titleModalWall .title-wall { display:flex; flex-wrap:wrap; gap:10px; border-radius:20px; padding:16px; }
/* 2026-10-18：八段位超级质感升级——多层奢华金属/宝石纹理 */
#titleModalWall.tier-bronze .title-wall { background:#a1887f; border:3px solid rgba(0,0,0,.15); }
#titleModalWall.tier-silver .title-wall { background:#b0bec5; border:3px solid rgba(0,0,0,.15); }
#titleModalWall.tier-gold .title-wall { background:#ffd54f; border:3px solid rgba(0,0,0,.15); }
#titleModalWall.tier-platinum .title-wall { background:#80deea; border:3px solid rgba(0,0,0,.15); }
#titleModalWall.tier-diamond .title-wall { background:#81d4fa; border:3px solid rgba(0,0,0,.15); }
#titleModalWall.tier-master .title-wall { background:#ce93d8; border:3px solid rgba(0,0,0,.15); }
#titleModalWall.tier-grandmaster .title-wall { background:#f48fb1; border:3px solid rgba(0,0,0,.15); }
#titleModalWall.tier-king .title-wall { background:#ffcc80; border:3px solid rgba(0,0,0,.15); }
  linear-gradient(115deg, rgba(255,255,255,.9) 0%, transparent 18%, rgba(255,255,255,.4) 38%, transparent 55%, rgba(255,255,255,.7) 78%, transparent 100%),
  radial-gradient(ellipse at 25% 20%, rgba(255,255,255,.8) 0%, transparent 35%),

#titleModalWall.tier-king .title-wall { background:#ffcc80; border:3px solid rgba(0,0,0,.15); }
#titleModalWall .title-item { width:30%; min-width:90px; text-align:center; padding:16px 8px; border-radius:16px; border:2px solid #e1e5eb; background:#fff; position:relative; overflow:hidden; transition:transform .25s cubic-bezier(.34,1.56,.64,1); box-shadow:0 2px 6px rgba(0,0,0,.05); content-visibility:auto; contain-intrinsic-size:120px 140px; }
/* 2026-10-18性能优化：去掉每张卡的::before高光层（80个额外图层是卡顿主因），用更轻的渐变代替 */
#titleModalWall .title-item:hover { transform:translateY(-3px); }
#titleModalWall .title-item:active { transform:translateY(-1px); }
#titleModalWall .title-item .ic { font-size:38px; position:relative; z-index:1; }

<script>
// 首页称号墙弹窗（2026-10-16）
document.getElementById('btnTitles').onclick = async () => {
  const modal = document.getElementById('titleModal');
  const wall = document.getElementById('titleModalWall');
  modal.style.display = 'block';
  wall.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">加载中…</div>';
  try {

    const list = (t.titles || []);
    const earned = list.filter(x => x.earned).length;
    const total = list.length || 1;
    const ratio = earned / total;
    // 百分比（2026-10-16：Elouise要求显示百分数）
    const pctStr = (ratio * 100).toFixed(1).replace(/\.0$/, '') + '%';
    let tier = 'bronze', tierName = '青铜', nextTip = '', msg = '';
    // 2026-10-18 Elouise：段位改八等分，每段12.5%
    const tierInfo = getTierByRatio(ratio, total, earned);
    tier = tierInfo.tier; tierName = tierInfo.name; nextTip = tierInfo.nextTip; msg = tierInfo.msg;
    wall.className = 'tier-' + tier;
    document.getElementById('titleTierMini').textContent = '· ' + tierName;
    wall.innerHTML = `<div style="text-align:center;width:100%;margin-bottom:8px;"><span class="tier-badge" onclick="showTierPreview()" style="cursor:pointer;" title="点击查看段位说明">${tierName}</span>`
      + `<div style="font-size:16px;font-weight:700;margin-top:8px;">已集齐 ${earned}/${total}（${pctStr}）</div>`
      + `<div style="font-size:14px;color:#5f6368;margin-top:4px;">${nextTip}</div></div>`
      + `<div style="text-align:center;margin-bottom:12px;display:flex;justify-content:center;align-items:center;gap:12px;">`
      + `<button onclick="rarityPageTurn(-1)" style="padding:8px 20px;border-radius:20px;border:2px solid #90caf9;background:#e3f2fd;font-size:16px;cursor:pointer;">◀ 上一页</button>`
      + `<span id="rarityPageInfo" style="font-size:14px;color:#666;font-weight:700;"></span>`
      + `<button onclick="rarityPageTurn(1)" style="padding:8px 20px;border-radius:20px;border:2px solid #90caf9;background:#e3f2fd;font-size:16px;cursor:pointer;">下一页 ▶</button>`
      + `</div>`
      + `<div id="titleWallGrouped">` + renderTitlesGrouped(list, 0) + `</div>`
      + `<div class="tier-msg">${msg}</div>`;
    // 存下来供详情弹窗和翻页用
    window._modalTitles = list;
    window._rarityPage = 0;
  } catch (e) { wall.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">加载失败</div>'; }
};
// 2026-10-18 史诗级：按稀有度分组渲染（带翻页，一页一个稀有度）
// 2026-10-18 Elouise：顺序倒转，普通在前、传说在后
function renderTitlesGrouped(list, page) {
  const order = ['普通', '稀有', '史诗', '传说'];
  const colors = { '传说': '#e65100', '史诗': '#bf360c', '稀有': '#4a148c', '普通': '#0d47a1' };
  // 2026-10-18性能优化：每页12个，一页刚好显示完，不滚动
  const PER_PAGE = 12;
  const rarity = order[Math.floor(page / 10)] || order[0];
  const subPage = page % 10;
  const allItems = list.filter(x => (x.rarity || '普通') === rarity);
  const totalPages = Math.ceil(allItems.length / PER_PAGE);
  const items = allItems.slice(subPage * PER_PAGE, (subPage + 1) * PER_PAGE);
  const earned = allItems.filter(x => x.earned).length;
  const infoEl = document.getElementById('rarityPageInfo');
  if (infoEl) {
    const rarityIdx = order.indexOf(rarity) + 1;
    if (totalPages > 1) {
      infoEl.textContent = `${rarity}（${earned}/${allItems.length}）· ${rarityIdx}/4 · 第${subPage+1}/${totalPages}页`;
    } else {
      infoEl.textContent = `${rarity}（${earned}/${allItems.length}）· ${rarityIdx}/4`;
    }
  }
  // 存总页数供翻页用
  window._rarityTotalPages = totalPages;
  window._rarityCurrent = rarity;
  let html = `<div class="title-wall" style="margin-bottom:8px;display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;">`;
    html += items.map(x => {
      const i = list.indexOf(x);
      const rc = colors[rarity];
      let progressHtml = '';
      if (!x.earned && x.progress) {
        const pct = Math.min(100, Math.round(100 * x.progress.current / x.progress.target));
        progressHtml = `<div style="margin-top:6px;background:#e0e0e0;border-radius:999px;height:6px;overflow:hidden;">`
          + `<div style="width:${pct}%;height:100%;background:${rc};border-radius:999px;"></div></div>`
          + `<div style="font-size:11px;color:#666;margin-top:2px;">${x.progress.current}/${x.progress.target}</div>`;
      }
      return `<div class="title-item rar-${rarity} ${x.earned ? 'earned' : 'locked'}" onclick="showTitleModalDetail(${i})" style="cursor:pointer;">`
      + `<div class="ic">${x.earned ? x.icon : '🔒'}</div>`
      + `<div class="nm">${x.earned ? x.name : '???'}</div>`
      + `<div style="font-size:11px;color:${rc};font-weight:700;">${rarity}</div>`
      + progressHtml
      + `<div class="cond">${x.earned ? '已获得' : '点击查看如何获得'}</div></div>`;
    }).join('');
    html += `</div>`;
  return html;
}
function rarityPageTurn(d) {
  const list = window._modalTitles || [];
  let p = (window._rarityPage || 0) + d;
  // 新分页：每稀有度10个槽位，实际用到的按该稀有度总页数
  const order = ['普通', '稀有', '史诗', '传说'];
  const PER_PAGE = 12;
  // 计算总页数
  let totalSlots = 0;
  const rarityPages = order.map(r => {
    const n = list.filter(x => (x.rarity || '普通') === r).length;
    return Math.ceil(n / PER_PAGE);
  });
  totalSlots = rarityPages.reduce((a, b) => a + b, 0);
  if (p < 0) p = 0;
  if (p >= totalSlots) p = totalSlots - 1;
  window._rarityPage = p;
  // 找到对应的rarity和subPage
  let acc = 0, rarityIdx = 0, subPage = 0;
  for (let i = 0; i < 4; i++) {
    if (p < acc + rarityPages[i]) {
      rarityIdx = i;
      subPage = p - acc;
      break;
    }
    acc += rarityPages[i];
  }
  const renderPage = rarityIdx * 10 + subPage;
  document.getElementById('titleWallGrouped').innerHTML = renderTitlesGrouped(list, renderPage);
}
// 旧翻页函数保留（暂不用）
function renderTitlePage(list, page) {
  const per = 12;
  const start = page * per;
  const items = list.slice(start, start + per);
  return items.map((x, j) => {
    const i = start + j;
    const rarity = x.rarity || '普通';
    const rc = { '普通': '#0d47a1', '稀有': '#4a148c', '史诗': '#bf360c', '传说': '#e65100' }[rarity] || '#0d47a1';
    return `<div class="title-item rar-${rarity} ${x.earned ? 'earned' : 'locked'}" onclick="showTitleModalDetail(${i})" style="cursor:pointer;">`
    + `<div class="ic">${x.earned ? x.icon : '🔒'}</div>`
    + `<div class="nm">${x.earned ? x.name : '???'}</div>`
    + `<div style="font-size:11px;color:${rc};font-weight:700;">${rarity}</div>`
    + `<div class="cond">${x.earned ? '已获得' : '点击查看'}</div></div>`;
  }).join('');
}
function titlePageTurn(d) {
  const list = window._modalTitles || [];
  const total = Math.ceil(list.length / 12);
  let p = (window._titlePage || 0) + d;
  if (p < 0) p = 0;
  if (p >= total) p = total - 1;
  window._titlePage = p;
  document.getElementById('titleWallPage').innerHTML = renderTitlePage(list, p);
  document.getElementById('titlePageInfo').textContent = `${p+1} / ${total}`;
}
// 称号详情弹窗（首页 modal 用）
// 2026-10-18 Elouise：八段位，按百分比
function getTierByRatio(ratio, total, earned) {
  const tiers = [
    { min: 0.875, tier: 'king', name: '王者', msg: '“会当凌绝顶，一览众山小。”你是传奇！' },
    { min: 0.75, tier: 'grandmaster', name: '宗师', msg: '“宗师风范，睥睨群雄。”离王者一步之遥！' },
    { min: 0.625, tier: 'master', name: '大师', msg: '“大师出手，不同凡响。”继续冲！' },
    { min: 0.5, tier: 'diamond', name: '钻石', msg: '“钻石恒久远，一颗永流传。”继续闪耀吧！' },
    { min: 0.375, tier: 'platinum', name: '铂金', msg: '“铂金璀璨，光芒初现。”钻石在招手！' },
    { min: 0.25, tier: 'gold', name: '黄金', msg: '“金子总会发光。”铂金段位在向你招手！' },
    { min: 0.125, tier: 'silver', name: '白银', msg: '“银鞍照白马，飒沓如流星。”继续努力！' },
    { min: 0, tier: 'bronze', name: '青铜', msg: '“千里之行，始于足下。”加油！' },
  ];
  for (let i = 0; i < tiers.length; i++) {
    if (ratio >= tiers[i].min) {
      const t = tiers[i];
      let nextTip = '';
      if (i > 0) {
        const nextMin = tiers[i-1].min;
        const need = Math.max(1, Math.ceil(total * nextMin) - earned);
        nextTip = `距离${tiers[i-1].name}还差 ${need} 个称号`;
      } else {
        nextTip = '已达最高段位！';
      }
      return { tier: t.tier, name: t.name, nextTip, msg: t.msg };
    }
  }
  return { tier: 'bronze', name: '青铜', nextTip: '', msg: '' };
}
// 2026-10-18 Elouise：点击段位徽章预览八个段位

function showTitleModalDetail(i) {
  const x = (window._modalTitles || [])[i];

    + (x.progress && !x.earned ? '<div style="margin:12px 0;"><div style="background:#e0e0e0;border-radius:999px;height:10px;overflow:hidden;"><div style="width:' + Math.min(100, Math.round(100*x.progress.current/x.progress.target)) + '%;height:100%;background:#1a73e8;"></div></div><div style="font-size:13px;color:#666;margin-top:4px;">进度：' + x.progress.current + '/' + x.progress.target + '</div></div>' : '')
    + '<div style="margin:12px 0;padding:10px;background:' + (x.earned ? '#e6f4ea' : '#fef7e0') + ';border-radius:10px;font-size:14px;color:' + (x.earned ? '#137333' : '#b06000') + ';">'

// 首页加载时显示当前段位 + 下一称号提示（2026-10-18 史诗级）
fetch('/api/titles').then(r => r.json()).then(t => {
  const list = t.titles || [];
  const earned = list.filter(x => x.earned).length;
  const ratio = earned / (list.length || 1);
  const name = getTierByRatio(ratio, list.length || 80, earned).name;
  document.getElementById('titleTierMini').textContent = '· ' + name;
  // 找下一个最接近的称号（有progress的优先，只看未获得且进度未达标的）
  const unobtained = list.filter(x => !x.earned && x.progress && x.progress.current < x.progress.target);
  if (unobtained.length) {
    unobtained.sort((a, b) => {
      const pa = a.progress.current / a.progress.target;
      const pb = b.progress.current / b.progress.target;
      return pb - pa;
    });
    const next = unobtained[0];
    const hint = document.getElementById('nextTitleHint');
    if (hint) {
      const remain = Math.max(0, next.progress.target - next.progress.current);
      hint.textContent = `🎯 距「${next.name}」还差 ${remain} 步`;
    }
  }
  // 2026-10-18性能优化：预加载已回滚（预渲染导致空白bug，改用CSS简化+content-visibility优化）
}).catch(() => {});

  ]},
];

// 扁平化课程顺序
const ORDER = [];
UNITS.forEach(u => u.lessons.forEach(l => ORDER.push(l)));

// 读完成状态：优先用服务器真实进度（lesson_state表），本地做兜底
let serverDone = new Set();
let serverCurrent = null;   // 服务器判定的"当前在学"课程 id
let serverStarted = [];     // [{id, updated_at}] 学过但没学完
let lockedSet = new Set();  // 服务端判定的未解锁课程（2026-10-12：Unit 4锁死）
let pendingReviewIds = []; // 待办的复习课id（2026-10-13：无正课可上时继续按钮指向这里）
async function loadServerProgress() {
  try {
    const r = await fetch('/api/done-lessons');
    const d = await r.json();
    if (d.ok) {
      const doneList = d.completed || d.lessons || [];
      serverDone = new Set(doneList);
      serverCurrent = d.current || null;
      serverStarted = Array.isArray(d.started) ? d.started : [];
    }
  } catch {}
  // 拉取每门课的解锁状态
  try {
    const r2 = await fetch('/api/lessons');
    const d2 = await r2.json();
    if (d2.lessons) {
      for (const l of d2.lessons) {
        if (l.open === false) lockedSet.add(l.lesson_id);
      }
    }
  } catch {}
  // 拉取待办复习（2026-10-13：继续按钮兜底用）
  try {
    const r3 = await fetch('/api/daily-reviews');
    const d3 = await r3.json();
    if (d3.ok && Array.isArray(d3.pending)) {
      pendingReviewIds = d3.pending.filter(p => p.lesson_id).map(p => p.lesson_id);
    }
  } catch {}
}
function isDone(id) {
  if (serverDone.has(id)) return true;
  return localStorage.getItem("xh_done_" + id) === "1";
}
function isLocked(id) { return lockedSet.has(id); }

// 算当前课：必须等服务器进度回来之后再算（2026-10-11 修复：以前在服务器数据回来前
// 就算好了，导致当前课标记永远按本地空数据走）
let currentIdx = 0;
function isReviewId(id) { return /^review\d+$/.test(id); }
function computeCurrent() {
  // 0) 用户长按手动设置的当前课（优先级最高；锁定的课不能设）
  try {
    const manual = localStorage.getItem('manual_current');
    if (manual && ORDER.some(l => l.id === manual) && !isDone(manual) && !isLocked(manual)) {
      return ORDER.findIndex(l => l.id === manual);
    }
    if (manual && (isDone(manual) || isLocked(manual))) localStorage.removeItem('manual_current');
  } catch {}
  // 1) 服务器直接给的当前课（且在地图里；复习课不劫持主线；锁定的跳过）
  if (serverCurrent && ORDER.some(l => l.id === serverCurrent) && !isReviewId(serverCurrent) && !isLocked(serverCurrent)) {
    return ORDER.findIndex(l => l.id === serverCurrent);
  }
  // 2) 服务器 started 里最近学过、还没完成的那门（只看地图里的课；复习课不劫持主线；锁定的跳过）
  const smap = new Map();
  for (const s of serverStarted) {
    const id = typeof s === 'string' ? s : s.id;
    const t = typeof s === 'string' ? '' : (s.updated_at || '');
    if (id && ORDER.some(l => l.id === id) && !isDone(id) && !isReviewId(id) && !isLocked(id)) smap.set(id, t);
  }
  let best = -1, bestT = '';
  ORDER.forEach((l, i) => {
    if (smap.has(l.id) && (smap.get(l.id) || '') >= bestT) { bestT = smap.get(l.id) || ''; best = i; }
  });
  if (best !== -1) return best;
  // 3) 第一门没完成且未锁定的
  const idx = ORDER.findIndex(l => !isDone(l.id) && !isLocked(l.id));
  if (idx !== -1) return idx;
  // 2026-10-13修：正课全做完或全锁定时，不再兜底到最后一个（可能是锁定的），
  // 返回-1，由调用方指向待办复习
  return -1;
}

// 先加载服务器进度，算好当前课再渲染
loadServerProgress().then(() => {
// 没有任何服务器/本地记录时，默认定到 u2r5（2026-10-11 用户确认上次学到第5课）
const hasAny = ORDER.some(l => isDone(l.id)) || serverStarted.length > 0 || !!serverCurrent;
if (!hasAny) {
  const u2r5Idx = ORDER.findIndex(l => l.id === "u2r5");
  currentIdx = u2r5Idx !== -1 ? u2r5Idx : computeCurrent();
} else {
  currentIdx = computeCurrent();
}
renderMap();
});
function renderMap() {
// 渲染
const unitsEl = document.getElementById("units");
let doneN = 0;

UNITS.forEach(unit => {
  const div = document.createElement("div");
  div.className = "unit";
  const doneInUnit = unit.lessons.filter(l => isDone(l.id)).length;
  div.innerHTML = `<div class="unit-head"><h2>${unit.name}</h2><span class="count">${doneInUnit}/${unit.lessons.length}</span></div>`;
  const nodes = document.createElement("div");
  nodes.className = "nodes";
  unit.lessons.forEach(l => {
    const idx = ORDER.findIndex(o => o.id === l.id);
    const done = isDone(l.id);
    const locked = isLocked(l.id);
    if (done) doneN++;
    let cls = "available", icon = "📖";
    if (done) { cls = "done"; icon = "✅"; }
    else if (locked) { cls = "locked"; icon = "🔒"; }
    else if (idx === currentIdx) { cls = "current"; icon = "📍"; }
    // 前面的课没标记完成也不画✅，只显示📖可回看（2026-10-11：✅必须只给真正完成的，
    // 否则跟顶部"已完成"数字对不上）

    const n = document.createElement("div");
    n.className = "node " + cls;
    n.innerHTML = `<div class="icon">${icon}</div><div class="name">${l.name}</div><div class="label">${l.label}</div>`;
    // 所有课程都可点击进入（2026-10-11：本地解锁状态与服务器进度对不上，取消锁定）
    // 长按设为当前学习课程（2026-10-11 加，14:55 修：长按后不重建DOM，避免误触进入）
    let pressTimer = null;
    n.addEventListener('pointerdown', () => {
      pressTimer = setTimeout(() => {
        pressTimer = 'fired';
        n.style.transform = 'scale(.96)';
        n.style.boxShadow = '0 0 0 3px #1a73e8';
      }, 600);
    });
    const cancelPress = () => {
      if (pressTimer === 'fired') {
        // 长按生效：设为当前，不进入课程
        try { localStorage.setItem('manual_current', l.id); } catch {}
        currentIdx = ORDER.findIndex(o => o.id === l.id);
        // 最小化更新UI：移动📍标记，更新继续按钮（不重建DOM）
        document.querySelectorAll('.node.current').forEach(x => {
          x.classList.remove('current'); x.classList.add('available');
          const ic = x.querySelector('.icon'); if (ic) ic.textContent = '📖';
        });
        n.classList.remove('available'); n.classList.add('current');
        const nic = n.querySelector('.icon'); if (nic) nic.textContent = '📍';
        const sub = document.getElementById('continueSub');
        if (sub) sub.textContent = '下一课：' + l.name + '（' + l.label + '）';
        const bc = document.getElementById('btnContinue');
        if (bc) bc.onclick = () => { location.href = '/lesson?lesson=' + l.id; };
        window._suppressClickUntil = Date.now() + 1200;
      }
      if (pressTimer && pressTimer !== 'fired') clearTimeout(pressTimer);
      pressTimer = null;
      n.style.transform = ''; n.style.boxShadow = '';
    };
    n.addEventListener('pointerup', cancelPress);
    n.addEventListener('pointerleave', () => { if (pressTimer && pressTimer !== 'fired') clearTimeout(pressTimer); pressTimer = null; n.style.transform = ''; n.style.boxShadow = ''; });
    n.addEventListener('pointercancel', cancelPress);
    n.onclick = () => {
      if (Date.now() < (window._suppressClickUntil || 0)) return; // 长按后的点击不进入
      if (isLocked(l.id)) {
        showLockedDialog(l.id); // 2026-10-13：显示具体哪个复习没做完，带跳转按钮
        return;
      }
      location.href = "/lesson?lesson=" + l.id;
    };
    nodes.appendChild(n);
  });
  div.appendChild(nodes);
  unitsEl.appendChild(div);
});

document.getElementById("totalCount").textContent = ORDER.length; // 2026-10-13修：之前写死27，实际25个，对不上

  let dailyMistakes = null;
  try {
    const r = await fetch('/api/daily-reviews', { credentials: 'same-origin' });
    const d = await r.json();
    if (d && d.ok && Array.isArray(d.pending)) pending = d.pending;

  } catch {}
  // 建弹窗（单例）

  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'lockedOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;';

    document.body.appendChild(ov);
    ov.addEventListener('click', e => { if (e.target === ov) ov.style.display = 'none'; });
    document.getElementById('lockedClose').onclick = () => { ov.style.display = 'none'; };
  }

  if (!pending.length) {
    list.innerHTML = '<div style="color:#5f6368;font-size:14px;">先完成前面的课程就能解锁。</div>';

    const streakTxt = d.streak > 0 ? ` · 🔥连闯${d.streak}天` : '';
    if (!d.has_questions) {
      // 无待复测：今日无短板
      title.textContent = '🎉 今日状态极佳';
      desc.textContent = '没有待补的短板，继续保持！' + streakTxt;
      btn.style.display = 'none';
    } else if (d.checked_in) {
      // 已通关
      title.textContent = '✅ 今日已通关';
      desc.textContent = `短板补完了，明天继续！` + streakTxt;
      btn.style.display = 'none';
      card.style.background = 'linear-gradient(135deg,#e8f5e9,#c8e6c9)';
      card.style.borderColor = '#4caf50';
      title.style.color = '#2e7d32';
    } else {
      // 待闯关
      title.textContent = '🔥 今日闯关';
      desc.textContent = `${d.question_count}道错题等你补 · 先闯关再上新课` + streakTxt;
      btn.style.display = 'inline-block';
      btn.onclick = () => { location.href = '/lesson?lesson=daily-retest'; };
    }
    // 2026-10-15：渲染今日学习计划（三步走）
    renderDailyPlan(d);
  } catch (e) { /* 静默失败，不挡首页 */ }
})();

// 今日学习计划（2026-10-15 Elouise：孩子一打开就知道先做什么）
async function renderDailyPlan(dailyStatus) {
  const planEl = document.getElementById('dailyPlan');
  const listEl = document.getElementById('planList');
  if (!planEl || !listEl) return;
  try {
    // 拉取今日错题进度
    let dm = null;
    try {
      const r = await fetch('/api/daily-reviews', { credentials: 'same-origin' });
      const d = await r.json();
      if (d && d.ok && d.dailyMistakes) dm = d.dailyMistakes;
    } catch {}
    const steps = [];
    // 第1步：今日闯关
    const dailyDone = dailyStatus && (dailyStatus.checked_in || !dailyStatus.has_questions);
    steps.push({
      done: dailyDone,
      text: dailyDone ? '今日闯关：已完成 ✅' : `今日闯关：${dailyStatus ? dailyStatus.question_count : 8}道题`,
      link: dailyDone ? null : '/lesson?lesson=daily-retest',
      btn: dailyDone ? null : '去闯关 →'
    });
    // 第2步：今日错题
    const mDone = dm ? dm.done : 0, mTarget = dm ? dm.target : 10;
    const mOk = mTarget > 0 ? (mDone >= mTarget) : true;
    steps.push({
      done: mOk,
      text: mOk ? `今日错题：已完成 ✅` : `今日错题：${mDone}/${mTarget}道`,
      link: mOk ? null : '/progress.html',
      btn: mOk ? null : '去做错题 →'
    });
    // 第3步：新课学习（2026-10-16修：动态取当前可上课程，不再硬编码u4r1）
    const curLesson = (typeof currentIdx !== 'undefined' && currentIdx !== -1 && ORDER[currentIdx]) ? ORDER[currentIdx] : null;
    if (curLesson) {
      steps.push({
        done: false,
        text: `新课学习：${curLesson.name}`,
        link: `/lesson?lesson=${curLesson.id}`,
        btn: '开始上课 →'
      });
    } else {
      steps.push({
        done: true,
        text: '新课学习：本单元已学完 🎉',
        link: null,
        btn: null
      });
    }
    listEl.innerHTML = steps.map((s, i) =>
      `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:${s.done ? '#f1f8e9' : '#fff8e1'};border:1px solid ${s.done ? '#c8e6c9' : '#ffe0b2'};">`
      + `<span style="font-size:14px;font-weight:600;">${i + 1}. ${s.text}</span>`
      + (s.link ? `<button onclick="location.href='${s.link}'" style="padding:8px 16px;border:0;border-radius:8px;background:#1a73e8;color:#fff;font-size:13px;font-weight:700;cursor:pointer;">${s.btn}</button>` : '<span style="color:#4caf50;font-size:20px;">✓</span>')
      + `</div>`
    ).join('');
    planEl.style.display = 'block';
  } catch (e) { /* 静默失败 */ }
}

// 继续学习按钮
// 2026-10-13修：无正课可上时（currentIdx=-1），指向待办复习，不再跳锁定课
// 2026-10-14改（Elouise）：有复习待办或错题时按钮变"📝 继续复习"，点进去先做待办、再做错题；做完变回"📍 继续学习"
(async function() {
  const sub = document.getElementById("continueSub");
  const btn = document.getElementById("btnContinue");
  // 拉取待复测错题数
  let mistakeCount = 0;
  try {
    const r = await fetch('/api/retest/pending');
    const d = await r.json();
    if (d.ok && Array.isArray(d.pending)) mistakeCount = d.pending.length;
  } catch {}
  // 2026-10-15 Elouise：拉取今日错题进度（解锁新课要求是每天10道，不是清完所有）
  let dailyMistakes = null;
  try {
    const r2 = await fetch('/api/daily-reviews', { credentials: 'same-origin' });
    const d2 = await r2.json();
    if (d2 && d2.ok && d2.dailyMistakes) dailyMistakes = d2.dailyMistakes;
  } catch {}
  const hasReview = pendingReviewIds.length > 0;
  // 2026-10-15修：hasMistake 只看今日10道是否做完，不看历史总数（41道不清完也显示继续学习）
  const hasMistake = dailyMistakes ? (dailyMistakes.done < dailyMistakes.target && dailyMistakes.target > 0) : (mistakeCount > 0);
  // 更新按钮主文本（2026-10-14：健壮写法，找文本节点）
  function setBtnText(t) {
    for (const n of btn.childNodes) {
      if (n.nodeType === 3 && n.textContent.trim()) { n.textContent = t; break; }
    }
  }
  if (hasReview || hasMistake) {
    // 有复习任务 → 显示"继续复习"
    setBtnText('📝 继续复习 ');
    if (hasReview) {
      const rid = pendingReviewIds[0];
      const rname = rid === 'u3-consolidate' ? 'Unit 3 专项巩固' : rid;
      // 2026-10-15：错题提示改成今日进度，不说"另有53道"
      const mistakeTxt = (hasMistake && dailyMistakes && dailyMistakes.target > 0)
        ? `（今日错题 ${dailyMistakes.done}/${dailyMistakes.target}）`
        : (hasMistake ? `（另有${mistakeCount}道错题）` : '');
      sub.textContent = "去做复习：" + rname + mistakeTxt;
      btn.onclick = () => { location.href = "/lesson?lesson=" + rid; };
    } else {
      // 无待办复习但有错题 → 显示今日错题进度（2026-10-15 Elouise：解锁要求是每天10道，不是清完53道）
      if (dailyMistakes && dailyMistakes.target > 0) {
        sub.textContent = `今日错题：已做 ${dailyMistakes.done}/${dailyMistakes.target} 道`;
      } else {
        sub.textContent = `去消错题：还有${mistakeCount}道`;
      }
      btn.onclick = () => { location.href = "/progress.html"; };
    }
  } else if (currentIdx !== -1 && ORDER[currentIdx]) {
    setBtnText('📍 继续学习 ');
    const cur = ORDER[currentIdx];
    sub.textContent = "下一课：" + cur.name + "（" + cur.label + "）";
    btn.onclick = () => { location.href = "/lesson?lesson=" + cur.id; };
  } else {
    setBtnText('📍 继续学习 ');
    sub.textContent = "都学完了，太棒了！";
    btn.onclick = () => { location.href = "/growth.html"; };
  }
})();
}

</script>
<script src="/modal.js"></script>
