<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小禾英语 · 学习地图</title>
<style>
  :root {
    --blue: #1a73e8;
    --blue-dark: #1558b0;
    --green: #34a853;
    --gray: #dadce0;
    --ink: #202124;
    --muted: #5f6368;
    --bg: #f0f4fa;
    --card: #ffffff;
    --shadow-sm: 0 1px 3px rgba(60,64,67,.08), 0 1px 2px rgba(60,64,67,.06);
    --shadow-md: 0 4px 12px rgba(60,64,67,.10), 0 2px 6px rgba(60,64,67,.08);
    --shadow-blue: 0 8px 20px rgba(26,115,232,.35);
    --radius-lg: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh;
  }
  /* 顶部：三层渐变 + 圆点纹理 + 柔光装饰 */
  .hero {
    position: relative; overflow: hidden;
    background: linear-gradient(150deg, #1a73e8 0%, #3f6fe0 45%, #7b4fd6 100%);
    color: #fff; padding: 34px 22px 30px;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 8px 24px rgba(26,115,232,.28);
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,.13) 1.5px, transparent 1.7px);
    background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(180deg, #000 50%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 50%, transparent 100%);
  }
  .hero::after {
    content: ""; position: absolute; width: 230px; height: 230px;
    right: -75px; top: -75px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.20) 0%, transparent 65%);
    pointer-events: none;
  }
  .hero > * { position: relative; z-index: 1; }
  .hero h1 { margin: 0; font-size: 27px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 2px 10px rgba(0,0,0,.20); }
  .hero .sub { margin: 10px 0 0; font-size: 13.5px; opacity: .92; letter-spacing: 1px; }
  .hero .stats { display: flex; gap: 12px; margin-top: 18px; }
  .stat {
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 16px; padding: 10px 16px;
    font-size: 12.5px; letter-spacing: .5px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.15);
  }
  .stat b { font-size: 20px; font-weight: 800; display: block; letter-spacing: .5px; }
  .progress-bar {
    height: 8px; background: rgba(255,255,255,.28);
    border-radius: 99px; margin-top: 16px; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffffff, #d6e7ff);
    border-radius: 99px;
    box-shadow: 0 0 10px rgba(255,255,255,.75);
    transition: width .6s cubic-bezier(.4,0,.2,1);
  }
  /* 继续学习按钮：蓝紫渐变 + 立体阴影 */
  .continue-wrap { padding: 20px 20px 0; }
  .btn-continue {
    display: block; width: 100%;
    background: linear-gradient(135deg, #1a73e8 0%, #4a8ef7 55%, #7b5ff0 130%);
    color: #fff;
    border: 0; border-radius: var(--radius-lg);
    padding: 18px; font-size: 18.5px; font-weight: 800; letter-spacing: 1.5px;
    cursor: pointer;
    box-shadow: var(--shadow-blue), inset 0 1px 0 rgba(255,255,255,.28);
    transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
  }
  .btn-continue:hover { filter: brightness(1.07); box-shadow: 0 10px 26px rgba(26,115,232,.45), inset 0 1px 0 rgba(255,255,255,.28); }
  .btn-continue:active { transform: scale(.97); box-shadow: 0 4px 12px rgba(26,115,232,.30); }
  .btn-continue small { display: block; font-size: 13px; font-weight: 400; opacity: .93; margin-top: 6px; letter-spacing: 1px; }
  /* 称号系统（2026-10-12 Elouise：mastery-based，不是打卡） */
  .titles-card {
    margin: 12px 20px 0; background: #fff; border-radius: 16px;
    padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .titles-head { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .titles-grid { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .title-badge {
    flex: 0 0 auto; width: 104px; text-align: center;
    border-radius: 12px; padding: 10px 6px; font-size: 12px;
  }
  .title-badge.earned {
    background: linear-gradient(180deg, #fff8e6, #ffedb8);
    border: 2px solid #f2c14e; box-shadow: 0 2px 8px rgba(242,193,78,.35);
  }
  .title-badge.locked-t {
    background: #f4f6f9; border: 2px dashed #d0d5dd; color: #98a2b3;
  }
  .title-badge .ticon2 { font-size: 30px; display: block; margin-bottom: 4px; }
  .title-badge.locked-t .ticon2 { filter: grayscale(1); opacity: .5; }
  .title-badge .tname { font-weight: 700; font-size: 12px; display: block; }
  .title-badge.earned .tname { color: #b54708; }
  .title-badge .tdesc { font-size: 10px; line-height: 1.4; display: block; margin-top: 4px; }
  /* 每日签到（2026-10-11） */
  .checkin-card {
    margin: 16px 20px 0; background: #fff; border-radius: 16px;
    padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .checkin-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .checkin-title { font-size: 16px; font-weight: 700; }
  .checkin-streak { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .checkin-streak b { color: #e8710a; font-size: 20px; }
  .btn-checkin {
    background: linear-gradient(180deg, #ff9f2e, #e8710a); color: #fff;
    border: 0; border-radius: 12px; padding: 12px 26px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 12px rgba(232,113,10,.32); white-space: nowrap;
  }
  .btn-checkin:active { transform: scale(.97); }
  .btn-checkin.done { background: #e8eaed; color: var(--muted); box-shadow: none; }
  .btn-checkin:disabled { cursor: default; }
  .checkin-week { display: flex; gap: 6px; margin-top: 12px; }
  /* 日历模式（2026-10-12） */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
  .cal-head { text-align: center; font-size: 12px; color: var(--muted); padding: 4px; }
  .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 8px; background: #f5f5f5; }
  .cal-day.checked { background: #e6f4ea; color: #137333; font-weight: 700; }
  .cal-day.today { border: 2px solid var(--blue); font-weight: 700; }
  .cal-day.future { opacity: 0.3; }
  .cal-day.empty { background: transparent; }
  .cday {
    flex: 1; text-align: center; background: #f4f6f9; border-radius: 10px;
    padding: 8px 0 6px; font-size: 12px; color: var(--muted);
  }
  .cday span { display: block; margin-bottom: 2px; }
  .cday b { font-size: 16px; font-weight: 400; }
  .cday.on { background: #fef3e2; }
  .cday.on b { color: #e8710a; }
  .cday.today { outline: 2px solid var(--blue); outline-offset: -2px; }
  /* 单元：更大的呼吸感 */
  .units { padding: 12px 16px 112px; max-width: 720px; margin: 0 auto; }
  .unit { margin-top: 28px; }
  .unit-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px; padding: 0 6px;
  }
  .unit-head h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: .5px; }
  .unit-head .count {
    font-size: 12px; font-weight: 700; color: var(--muted);
    background: rgba(26,115,232,.08);
    padding: 4px 13px; border-radius: 99px;
  }
  .nodes {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .node {
    background: var(--card); border-radius: var(--radius-lg);
    padding: 15px 6px; text-align: center;
    cursor: pointer; border: 2px solid transparent;
    box-shadow: var(--shadow-sm);
    transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, border-color .2s ease, background .25s ease, opacity .25s ease;
    min-height: 94px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .node:active { transform: scale(.93); }
  .node .icon { font-size: 26px; margin-bottom: 6px; transition: transform .22s ease; }
  .node .name { font-size: 12.5px; font-weight: 700; line-height: 1.35; }
  .node .label { font-size: 10.5px; color: var(--muted); margin-top: 3px; letter-spacing: .5px; }
  /* 状态：视觉区分更清晰 */
  .node.done {
    border-color: #b7e0c3;
    background: linear-gradient(180deg, #f5fbf6 0%, #e9f7ed 100%);
  }
  .node.done .icon { color: var(--green); filter: drop-shadow(0 2px 4px rgba(52,168,83,.30)); }
  .node.done .name { color: #1e7e34; }
  .node.current {
    border-color: var(--blue);
    background: linear-gradient(180deg, #f2f7ff 0%, #e6effe 100%);
    box-shadow: 0 0 0 4px rgba(26,115,232,.16), 0 6px 16px rgba(26,115,232,.22);
    animation: nodePulse 2.4s ease-in-out infinite;
  }
  @keyframes nodePulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(26,115,232,.16), 0 6px 16px rgba(26,115,232,.22); }
    50% { box-shadow: 0 0 0 8px rgba(26,115,232,.09), 0 6px 16px rgba(26,115,232,.26); }
  }
  .node.current .icon { color: var(--blue); transform: scale(1.1); }
  .node.current .name { color: var(--blue-dark); }
  .node.available { background: var(--card); border: 2px solid #e4e8f0; }
  .node.available:hover { border-color: #9ec1fa; transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .node.locked { opacity: .5; cursor: not-allowed; background: #f6f7f9; border: 2px dashed #cfd4dc; }
  .node.locked .icon { filter: grayscale(1); opacity: .7; }
  .node.locked .name, .node.locked .label { color: #98a2b3; }
  /* 2026-10-13：锁定弹窗深色模式（走查发现白字白底看不见） */
  html[data-theme="dark"] #lockedBox { background:#2d2d2d !important; }
  html[data-theme="dark"] #lockedBox .locked-title { color:#f0f0f0 !important; }
  html[data-theme="dark"] #lockedClose { background:#3a3a3a !important; color:#f0f0f0 !important; }
  html[data-theme="dark"] #lockedList > div { color:#aaa !important; }
  html[data-theme="dark"] #lockedList > div > div { background:#3a3a3a !important; }
  html[data-theme="dark"] #lockedList > div > div > div:first-child { color:#f0f0f0 !important; }
  .node.available .icon { color: #9aa0a6; }
  /* 底部导航：毛玻璃 + 轻盈阴影 */
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid rgba(225,229,235,.8);
    box-shadow: 0 -4px 16px rgba(60,64,67,.08);
    display: flex; padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .tabbar a {
    flex: 1; text-align: center; text-decoration: none;
    color: var(--muted); font-size: 11px; font-weight: 500;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: color .2s ease;
  }
  .tabbar a .ticon { font-size: 23px; }
  .tabbar a.active { color: var(--blue); font-weight: 800; }
  /* 平板 */
  @media (min-width: 600px) {
    .units { max-width: 860px; }
    .nodes { gap: 16px; }
    .node { min-height: 108px; padding: 18px 8px; }
    .node .icon { font-size: 32px; }
    .node .name { font-size: 14.5px; }
    .hero h1 { font-size: 33px; }
    .hero { padding: 40px 30px 34px; }
  }
  /* 深色模式补充（theme.css 已覆盖基础，此处补新样式的深色适配） */
  html[data-theme="dark"] .hero { box-shadow: 0 8px 26px rgba(0,0,0,.45) !important; }
  html[data-theme="dark"] .btn-continue {
    background: linear-gradient(135deg, #4a8ef7 0%, #6c8ff5 55%, #8b5cf6 130%) !important;
    color: #fff !important; border: 0 !important;
    box-shadow: 0 8px 20px rgba(74,142,247,.30), inset 0 1px 0 rgba(255,255,255,.20) !important;
  }
  html[data-theme="dark"] .node.done {
    background: linear-gradient(180deg, #1e3a26 0%, #172e1e 100%) !important;
    border-color: #3d7a4e !important;
  }
  html[data-theme="dark"] .node.done .name { color: #7ddba0 !important; }
  html[data-theme="dark"] .node.current {
    background: linear-gradient(180deg, #1a2c4a 0%, #152441 100%) !important;
    border-color: #5b9df5 !important;
  }
  html[data-theme="dark"] .node.current .name { color: #a9c9fb !important; }
  html[data-theme="dark"] .node.available { background: #2d2d2d !important; border-color: #454545 !important; }
  html[data-theme="dark"] .node.locked { background: #222 !important; border-color: #5a5a5a !important; }
  html[data-theme="dark"] .unit-head .count { background: rgba(122,184,255,.12) !important; color: #a0a0a0 !important; }
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
</head>
<body>

<div class="hero">
  <h1>🌱 小禾英语</h1>
  <p class="sub" id="updateInfo">共 27 课 · 已更新到 Unit 6</p>
  <div class="stats">
    <div class="stat"><b id="doneCount">0</b>已完成</div>
    <div class="stat"><b id="totalCount">27</b>总课程</div>
    <div class="stat"><b id="pct">0%</b>进度</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
</div>

<div class="continue-wrap">
  <!-- 每日闯关（2026-10-14）：每天开始前先复测，画像驱动补短板 -->
  <div id="dailyCard" style="display:none;background:linear-gradient(135deg,#fff8e1,#ffecb3);border:2px solid #ffb300;border-radius:16px;padding:16px;margin-bottom:12px;text-align:center;">
    <div style="font-size:17px;font-weight:800;color:#e65100;" id="dailyTitle">🔥 今日闯关</div>
    <div style="font-size:13px;color:#795548;margin:6px 0;" id="dailyDesc">加载中…</div>
    <button id="btnDaily" style="display:none;margin-top:8px;padding:12px 32px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff8f00,#ffb300);color:#fff;font-size:16px;font-weight:800;cursor:pointer;">开始闯关 →</button>
  </div>
  <button class="btn-continue" id="btnContinue">
    📍 继续学习
    <small id="continueSub">点我进入下一课</small>
  </button>
</div>

<div style="text-align:center;margin:6px 0 2px;">
  <a href="/phonics.html" style="display:inline-block;background:#fff;border:1px solid #dfe3ec;border-radius:12px;padding:10px 22px;font-size:15px;color:#1a73e8;text-decoration:none;">🔤 音标表：点一下就读发音</a>
</div>

<div class="units" id="units"></div>

<!-- 单元测验卷（2026-10-12）：广州新中考140分制，完成单元解锁 -->
<div class="units" style="margin-top:8px;">
  <div class="unit-head"><h2>📝 单元测验卷</h2><span class="count" id="examCount"></span></div>
  <div class="sub" style="color:var(--muted);font-size:13px;margin:0 0 12px;">广州新中考标准 · 满分140分（听说30+笔试110）· 完成一个单元解锁对应测验卷</div>
  <div id="examList" style="display:grid;gap:12px;"><div style="color:#999;font-size:14px;">加载中…</div></div>
</div>

<div class="tabbar">
  <a href="/" class="active"><span class="ticon">🏠</span>首页</a>
  <a href="/vocab.html"><span class="ticon">📖</span>生词本</a>
  <a href="/progress.html"><span class="ticon">📊</span>学习报告</a>
  <a href="/growth.html"><span class="ticon">🌱</span>成长</a>
  <a href="/settings.html"><span class="ticon">⚙️</span>设置</a>
</div>

<script>
// 应用设置页的主题（2026-10-11 加）
try {
  const th = localStorage.getItem('xh_theme');
  if (th) document.documentElement.setAttribute('data-theme', th);
} catch {}
// 课程结构
const UNITS = [
  { name: "Unit 2 · 广播站", lessons: [
    { id: "u2r1", name: "读懂通知", label: "第1课" },
    { id: "u2r2", name: "广播复盘", label: "第2课" },
    { id: "u2r3", name: "数据播报", label: "第3课" },
    { id: "u2r4", name: "来信点播", label: "第4课" },
    { id: "u2r5", name: "期末大直播", label: "第5课" },
  ]},
  { name: "Unit 3 · Computers", lessons: [
    { id: "u3r1", name: "比较级入门", label: "第1课" },
    { id: "u3r2", name: "选购指南", label: "第2课" },
    { id: "u3r3", name: "电话订购", label: "第3课" },
    { id: "u3r4", name: "写邮件", label: "第4课" },
    { id: "u3r5", name: "科技大直播", label: "第5课" },
  ]},
  { name: "Unit 4 · Inventions", lessons: [
    { id: "u4r1", name: "被动语态入门", label: "第1课" },
    { id: "u4r2", name: "真假发明", label: "第2课" },
    { id: "u4r3", name: "现代发明", label: "第3课" },
    { id: "u4r4", name: "我的发明", label: "第4课" },
    { id: "u4r5", name: "发明大直播", label: "第5课" },
  ]},
  { name: "Unit 5 · 交流", lessons: [
    { id: "u5r1", name: "现在完成时入门", label: "第1课" },
    { id: "u5r2", name: "你去过吗", label: "第2课" },
    { id: "u5r3", name: "just/already/yet", label: "第3课" },
    { id: "u5r4", name: "交流日记", label: "第4课" },
    { id: "u5r5", name: "交流大直播", label: "第5课" },
  ]},
  { name: "Unit 6 · 古代故事", lessons: [
    { id: "u6r1", name: "since和for", label: "第1课" },
    { id: "u6r2", name: "How long提问", label: "第2课" },
    { id: "u6r3", name: "古今对比", label: "第3课" },
    { id: "u6r4", name: "家乡故事", label: "第4课" },
    { id: "u6r5", name: "故事大直播", label: "第5课" },
  ]},
];

// 扁平化课程顺序
const ORDER = [];
UNITS.forEach(u => u.lessons.forEach(l => ORDER.push(l)));

// 读完成状态：优先用服务器真实进度（lesson_state表），本地做兜底
let serverDone = new Set();
let serverCurrent = null;   // 服务器判定的"当前在学"课程 id
let serverStarted = [];     // [{id, updated_at}] 学过但没学完
let lockedSet = new Set();  // 服务端判定的未解锁课程（2026-10-12：Unit 4锁死）
let pendingReviewIds = []; // 待办的复习课id（2026-10-13：无正课可上时继续按钮指向这里）
async function loadServerProgress() {
  try {
    const r = await fetch('/api/done-lessons');
    const d = await r.json();
    if (d.ok) {
      const doneList = d.completed || d.lessons || [];
      serverDone = new Set(doneList);
      serverCurrent = d.current || null;
      serverStarted = Array.isArray(d.started) ? d.started : [];
    }
  } catch {}
  // 拉取每门课的解锁状态
  try {
    const r2 = await fetch('/api/lessons');
    const d2 = await r2.json();
    if (d2.lessons) {
      for (const l of d2.lessons) {
        if (l.open === false) lockedSet.add(l.lesson_id);
      }
    }
  } catch {}
  // 拉取待办复习（2026-10-13：继续按钮兜底用）
  try {
    const r3 = await fetch('/api/daily-reviews');
    const d3 = await r3.json();
    if (d3.ok && Array.isArray(d3.pending)) {
      pendingReviewIds = d3.pending.filter(p => p.lesson_id).map(p => p.lesson_id);
    }
  } catch {}
}
function isDone(id) {
  if (serverDone.has(id)) return true;
  return localStorage.getItem("xh_done_" + id) === "1";
}
function isLocked(id) { return lockedSet.has(id); }

// 算当前课：必须等服务器进度回来之后再算（2026-10-11 修复：以前在服务器数据回来前
// 就算好了，导致当前课标记永远按本地空数据走）
let currentIdx = 0;
function isReviewId(id) { return /^review\d+$/.test(id); }
function computeCurrent() {
  // 0) 用户长按手动设置的当前课（优先级最高；锁定的课不能设）
  try {
    const manual = localStorage.getItem('manual_current');
    if (manual && ORDER.some(l => l.id === manual) && !isDone(manual) && !isLocked(manual)) {
      return ORDER.findIndex(l => l.id === manual);
    }
    if (manual && (isDone(manual) || isLocked(manual))) localStorage.removeItem('manual_current');
  } catch {}
  // 1) 服务器直接给的当前课（且在地图里；复习课不劫持主线；锁定的跳过）
  if (serverCurrent && ORDER.some(l => l.id === serverCurrent) && !isReviewId(serverCurrent) && !isLocked(serverCurrent)) {
    return ORDER.findIndex(l => l.id === serverCurrent);
  }
  // 2) 服务器 started 里最近学过、还没完成的那门（只看地图里的课；复习课不劫持主线；锁定的跳过）
  const smap = new Map();
  for (const s of serverStarted) {
    const id = typeof s === 'string' ? s : s.id;
    const t = typeof s === 'string' ? '' : (s.updated_at || '');
    if (id && ORDER.some(l => l.id === id) && !isDone(id) && !isReviewId(id) && !isLocked(id)) smap.set(id, t);
  }
  let best = -1, bestT = '';
  ORDER.forEach((l, i) => {
    if (smap.has(l.id) && (smap.get(l.id) || '') >= bestT) { bestT = smap.get(l.id) || ''; best = i; }
  });
  if (best !== -1) return best;
  // 3) 第一门没完成且未锁定的
  const idx = ORDER.findIndex(l => !isDone(l.id) && !isLocked(l.id));
  if (idx !== -1) return idx;
  // 2026-10-13修：正课全做完或全锁定时，不再兜底到最后一个（可能是锁定的），
  // 返回-1，由调用方指向待办复习
  return -1;
}

// 先加载服务器进度，算好当前课再渲染
loadServerProgress().then(() => {
// 没有任何服务器/本地记录时，默认定到 u2r5（2026-10-11 用户确认上次学到第5课）
const hasAny = ORDER.some(l => isDone(l.id)) || serverStarted.length > 0 || !!serverCurrent;
if (!hasAny) {
  const u2r5Idx = ORDER.findIndex(l => l.id === "u2r5");
  currentIdx = u2r5Idx !== -1 ? u2r5Idx : computeCurrent();
} else {
  currentIdx = computeCurrent();
}
renderMap();
});
function renderMap() {
// 渲染
const unitsEl = document.getElementById("units");
let doneN = 0;

UNITS.forEach(unit => {
  const div = document.createElement("div");
  div.className = "unit";
  const doneInUnit = unit.lessons.filter(l => isDone(l.id)).length;
  div.innerHTML = `<div class="unit-head"><h2>${unit.name}</h2><span class="count">${doneInUnit}/${unit.lessons.length}</span></div>`;
  const nodes = document.createElement("div");
  nodes.className = "nodes";
  unit.lessons.forEach(l => {
    const idx = ORDER.findIndex(o => o.id === l.id);
    const done = isDone(l.id);
    const locked = isLocked(l.id);
    if (done) doneN++;
    let cls = "available", icon = "📖";
    if (done) { cls = "done"; icon = "✅"; }
    else if (locked) { cls = "locked"; icon = "🔒"; }
    else if (idx === currentIdx) { cls = "current"; icon = "📍"; }
    // 前面的课没标记完成也不画✅，只显示📖可回看（2026-10-11：✅必须只给真正完成的，
    // 否则跟顶部"已完成"数字对不上）

    const n = document.createElement("div");
    n.className = "node " + cls;
    n.innerHTML = `<div class="icon">${icon}</div><div class="name">${l.name}</div><div class="label">${l.label}</div>`;
    // 所有课程都可点击进入（2026-10-11：本地解锁状态与服务器进度对不上，取消锁定）
    // 长按设为当前学习课程（2026-10-11 加，14:55 修：长按后不重建DOM，避免误触进入）
    let pressTimer = null;
    n.addEventListener('pointerdown', () => {
      pressTimer = setTimeout(() => {
        pressTimer = 'fired';
        n.style.transform = 'scale(.96)';
        n.style.boxShadow = '0 0 0 3px #1a73e8';
      }, 600);
    });
    const cancelPress = () => {
      if (pressTimer === 'fired') {
        // 长按生效：设为当前，不进入课程
        try { localStorage.setItem('manual_current', l.id); } catch {}
        currentIdx = ORDER.findIndex(o => o.id === l.id);
        // 最小化更新UI：移动📍标记，更新继续按钮（不重建DOM）
        document.querySelectorAll('.node.current').forEach(x => {
          x.classList.remove('current'); x.classList.add('available');
          const ic = x.querySelector('.icon'); if (ic) ic.textContent = '📖';
        });
        n.classList.remove('available'); n.classList.add('current');
        const nic = n.querySelector('.icon'); if (nic) nic.textContent = '📍';
        const sub = document.getElementById('continueSub');
        if (sub) sub.textContent = '下一课：' + l.name + '（' + l.label + '）';
        const bc = document.getElementById('btnContinue');
        if (bc) bc.onclick = () => { location.href = '/lesson?lesson=' + l.id; };
        window._suppressClickUntil = Date.now() + 1200;
      }
      if (pressTimer && pressTimer !== 'fired') clearTimeout(pressTimer);
      pressTimer = null;
      n.style.transform = ''; n.style.boxShadow = '';
    };
    n.addEventListener('pointerup', cancelPress);
    n.addEventListener('pointerleave', () => { if (pressTimer && pressTimer !== 'fired') clearTimeout(pressTimer); pressTimer = null; n.style.transform = ''; n.style.boxShadow = ''; });
    n.addEventListener('pointercancel', cancelPress);
    n.onclick = () => {
      if (Date.now() < (window._suppressClickUntil || 0)) return; // 长按后的点击不进入
      if (isLocked(l.id)) {
        showLockedDialog(l.id); // 2026-10-13：显示具体哪个复习没做完，带跳转按钮
        return;
      }
      location.href = "/lesson?lesson=" + l.id;
    };
    nodes.appendChild(n);
  });
  div.appendChild(nodes);
  unitsEl.appendChild(div);
});

// 顶部统计
document.getElementById("doneCount").textContent = doneN;
document.getElementById("totalCount").textContent = ORDER.length; // 2026-10-13修：之前写死27，实际25个，对不上
document.getElementById("pct").textContent = Math.round(doneN / ORDER.length * 100) + "%";
document.getElementById("pfill").style.width = (doneN / ORDER.length * 100) + "%";

// 单元测验卷列表（2026-10-12）
async function loadExams() {
  try {
    const d = await (await fetch('/api/exams')).json();
    if (!d.ok) return;
    const el = document.getElementById('examList');
    const unlocked = d.exams.filter(e => e.unlocked).length;
    document.getElementById('examCount').textContent = unlocked + '/' + d.exams.length + '已解锁';
    el.innerHTML = d.exams.map(e => {
      const lockIcon = e.unlocked ? '📝' : '🔒';
      const btnText = e.unlocked ? '开始测验' : '完成Unit ' + e.unit + '全部课程后解锁';
      const score = e.best_score != null ? `<span style="color:var(--green);font-weight:700;">最高 ${e.best_score}分</span>` : '';
      return `<div class="node" style="display:flex;align-items:center;gap:12px;padding:16px;${e.unlocked ? '' : 'opacity:.6;'}">
        <div style="font-size:32px;">${lockIcon}</div>
        <div style="flex:1;"><div style="font-weight:700;font-size:16px;">Unit ${e.unit} 测验卷</div>
        <div style="font-size:12px;color:var(--muted);">${e.name} · 140分制 ${score}</div></div>
        <button onclick="${e.unlocked ? `location.href='/exam.html?exam=${e.id}'` : `alert('🔒 先完成 Unit ${e.unit} 的全部5节课')`}"
          style="padding:10px 18px;border-radius:12px;border:0;font-size:14px;font-weight:700;cursor:pointer;
          ${e.unlocked ? 'background:linear-gradient(135deg,#1a73e8,#4a8ef7);color:#fff;' : 'background:#f0f0f0;color:#999;'}">${e.unlocked ? '开始' : '未解锁'}</button>
      </div>`;
    }).join('');
  } catch {}
}
loadExams();

// 2026-10-13 Elouise要求：点锁定的新课，显示具体哪个复习没做完，带跳转按钮
// 不再用写死的alert，而是拉取真实的待办列表
async function showLockedDialog(lessonId) {
  let pending = [];
  try {
    const r = await fetch('/api/daily-reviews', { credentials: 'same-origin' });
    const d = await r.json();
    if (d && d.ok && Array.isArray(d.pending)) pending = d.pending;
  } catch {}
  // 建弹窗（单例）
  let ov = document.getElementById('lockedOverlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'lockedOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;';
    ov.innerHTML = '<div id="lockedBox" style="background:#fff;border-radius:16px;max-width:420px;width:100%;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.2);">'
      + '<div style="font-size:18px;font-weight:800;margin-bottom:8px;color:#202124;" class="locked-title">🔒 这门课还没解锁</div>'
      + '<div id="lockedList" style="margin:12px 0;"></div>'
      + '<button id="lockedClose" style="width:100%;padding:12px;border:0;border-radius:12px;background:#f0f0f0;font-size:15px;font-weight:700;cursor:pointer;color:#202124;">知道了</button></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', e => { if (e.target === ov) ov.style.display = 'none'; });
    document.getElementById('lockedClose').onclick = () => { ov.style.display = 'none'; };
  }
  const list = document.getElementById('lockedList');
  if (!pending.length) {
    list.innerHTML = '<div style="color:#5f6368;font-size:14px;">先完成前面的课程就能解锁。</div>';
  } else {
    list.innerHTML = '<div style="color:#5f6368;font-size:14px;margin-bottom:10px;">先完成下面这些，就能解锁：</div>' + pending.map(p => {
      const label = (p.label || p.type || '').replace(/</g, '&lt;');
      let btn = '';
      if (p.lesson_id) {
        const lid = String(p.lesson_id).replace(/"/g, '&quot;');
        const name = lid === 'u3-consolidate' ? '去做专项巩固' : '去做复习';
        btn = `<button onclick="location.href='/lesson?lesson=${lid}'" style="margin-top:8px;padding:10px 20px;border:0;border-radius:10px;background:linear-gradient(135deg,#1a73e8,#4a8ef7);color:#fff;font-size:14px;font-weight:700;cursor:pointer;">${name} →</button>`;
      } else if (p.type === 'retest') {
        btn = '<div style="margin-top:8px;font-size:13px;color:#5f6368;">错题会在上课时自动出现，跟着做完就行。</div>';
      }
      return `<div style="background:#f8f9fa;border-radius:12px;padding:14px;margin-bottom:10px;"><div style="font-weight:700;font-size:15px;">📝 ${label}</div>${btn}</div>`;
    }).join('');
  }
  ov.style.display = 'flex';
}

// 每日闯关卡（2026-10-14）：每天开始前先复测，仪式感拉满
(async function initDailyCard() {
  const card = document.getElementById('dailyCard');
  const title = document.getElementById('dailyTitle');
  const desc = document.getElementById('dailyDesc');
  const btn = document.getElementById('btnDaily');
  if (!card) return;
  try {
    const r = await fetch('/api/daily-retest/status');
    const d = await r.json();
    if (!d.ok) return;
    card.style.display = 'block';
    const streakTxt = d.streak > 0 ? ` · 🔥连闯${d.streak}天` : '';
    if (!d.has_questions) {
      // 无待复测：今日无短板
      title.textContent = '🎉 今日状态极佳';
      desc.textContent = '没有待补的短板，继续保持！' + streakTxt;
      btn.style.display = 'none';
    } else if (d.checked_in) {
      // 已通关
      title.textContent = '✅ 今日已通关';
      desc.textContent = `短板补完了，明天继续！` + streakTxt;
      btn.style.display = 'none';
      card.style.background = 'linear-gradient(135deg,#e8f5e9,#c8e6c9)';
      card.style.borderColor = '#4caf50';
      title.style.color = '#2e7d32';
    } else {
      // 待闯关
      title.textContent = '🔥 今日闯关';
      desc.textContent = `${d.question_count}道错题等你补 · 先闯关再上新课` + streakTxt;
      btn.style.display = 'inline-block';
      btn.onclick = () => { location.href = '/lesson?lesson=daily-retest'; };
    }
  } catch (e) { /* 静默失败，不挡首页 */ }
})();

// 继续学习按钮
// 2026-10-13修：无正课可上时（currentIdx=-1），指向待办复习，不再跳锁定课
(function() {
  const sub = document.getElementById("continueSub");
  const btn = document.getElementById("btnContinue");
  if (currentIdx !== -1 && ORDER[currentIdx]) {
    const cur = ORDER[currentIdx];
    sub.textContent = "下一课：" + cur.name + "（" + cur.label + "）";
    btn.onclick = () => { location.href = "/lesson?lesson=" + cur.id; };
  } else if (pendingReviewIds.length > 0) {
    const rid = pendingReviewIds[0];
    const rname = rid === 'u3-consolidate' ? 'Unit 3 专项巩固' : rid;
    sub.textContent = "去做复习：" + rname;
    btn.onclick = () => { location.href = "/lesson?lesson=" + rid; };
  } else {
    sub.textContent = "都学完了，太棒了！";
    btn.onclick = () => { location.href = "/growth.html"; };
  }
})();
}
