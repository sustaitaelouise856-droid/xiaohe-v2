<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小禾英语 · 首次设置</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; font-size: 18px; }
  input, button { font-size: 18px; padding: 10px; width: 100%; box-sizing: border-box; margin-top: 12px; }
  button { background: #1a73e8; color: #fff; border: 0; border-radius: 8px; }
  button:disabled { background: #999; }
  #msg { min-height: 1.5em; }
  #msg.err { color: #c00; }
  #msg.ok { color: #0a0; }
  .hint { color: #555; font-size: 15px; }
</style>
</head>
<body>
<h2>首次设置访问码</h2>
<p class="hint">一次性设置口令请找安装人员索取（只用一次，用完作废）。访问码由你自己定，至少 6 位，设好后请牢记。</p>
<p id="msg"></p>
<input id="token" type="password" placeholder="一次性设置口令" autocomplete="off">
<input id="code" type="password" placeholder="自定访问码（至少 6 位）" autocomplete="off">
<input id="code2" type="password" placeholder="再输一次访问码" autocomplete="off">
<button id="go">设置访问码</button>
<script>
const msg = document.getElementById('msg');
const go = document.getElementById('go');
go.onclick = async () => {
  const token = document.getElementById('token').value.trim();
  const code = document.getElementById('code').value;
  const code2 = document.getElementById('code2').value;
  msg.className = ''; msg.textContent = '';
  if (!token) { msg.className = 'err'; msg.textContent = '请填写一次性设置口令。'; return; }
  if (code.length < 6) { msg.className = 'err'; msg.textContent = '访问码至少 6 位。'; return; }
  if (code !== code2) { msg.className = 'err'; msg.textContent = '两次输入的访问码不一致。'; return; }
  go.disabled = true;
  try {
    const r = await fetch('/api/setup', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ setup_token: token, access_code: code })
    });
    const b = await r.json();
    if (b.ok) {
      msg.className = 'ok';
      msg.textContent = '设置成功！现在可以用访问码进入课程了。';
      setTimeout(() => location.href = '/verify.html', 1500);
    } else {
      msg.className = 'err';
      msg.textContent = b.reason === 'bad_token' ? '一次性口令不对或已用过，请找安装人员确认。'
        : b.reason === 'already_setup' ? '已经设置过了，直接去登录页。'
        : '设置失败，请重试。';
      if (b.reason === 'already_setup') setTimeout(() => location.href = '/verify.html', 1500);
      go.disabled = false;
    }
  } catch (e) {
    msg.className = 'err'; msg.textContent = '连不上服务，请确认服务已启动。';
    go.disabled = false;
  }
};
</script>
</body>
</html>
