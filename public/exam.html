<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单元测验卷</title>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<script src="/client-error.js"></script>
<style>
  :root { --blue:#1a73e8; --green:#1e8e3e; --orange:#e8710a; --red:#d93025; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f0f4fa; margin:0; padding:0; }
  #topbar { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); border-bottom:1px solid #e1e5eb; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  #topbar .back { font-size:20px; text-decoration:none; color:var(--blue); }
  #topbar .title { flex:1; font-weight:700; font-size:18px; }
  #timer { font-weight:700; color:var(--red); font-size:16px; }
  #wrap { max-width:800px; margin:0 auto; padding:20px 16px 120px; }
  .section { background:#fff; border-radius:20px; padding:24px; margin-bottom:20px; box-shadow:0 1px 3px rgba(60,64,67,.08); }
  .section h2 { margin:0 0 6px; font-size:22px; color:var(--blue); }
  .section .sub { color:#5f6368; font-size:14px; margin-bottom:16px; }
  .q { border-top:1px solid #f0f0f0; padding:18px 0; }
  .q:first-of-type { border-top:0; }
  .q-num { font-weight:700; color:var(--blue); margin-bottom:8px; }
  .q-stem { font-size:17px; line-height:1.7; margin-bottom:12px; }
  .opt { display:block; width:100%; text-align:left; background:#f8f9fa; border:2px solid #e1e5eb; border-radius:12px; padding:12px 16px; margin:8px 0; font-size:16px; cursor:pointer; transition:all .15s; }
  .opt.sel { background:#e8f0fe; border-color:var(--blue); }
  .opt .k { display:inline-block; width:28px; height:28px; line-height:28px; text-align:center; background:#fff; border-radius:50%; margin-right:10px; font-weight:700; }
  .opt.sel .k { background:var(--blue); color:#fff; }
  input[type=text], textarea { width:100%; border:2px solid #e1e5eb; border-radius:12px; padding:12px; font-size:16px; font-family:inherit; }
  input[type=text]:focus, textarea:focus { outline:none; border-color:var(--blue); }
  textarea { min-height:120px; resize:vertical; line-height:1.7; }
  .audio-btn { background:var(--blue); color:#fff; border:0; border-radius:12px; padding:10px 20px; font-size:16px; cursor:pointer; margin:8px 0; }
  .rec-btn { background:var(--red); color:#fff; border:0; border-radius:12px; padding:10px 20px; font-size:16px; cursor:pointer; margin:8px 4px 8px 0; }
  .rec-btn.stop { background:#5f6368; }
  .rec-status { color:var(--red); font-size:14px; margin:8px 0; }
  #submitBar { position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.95); backdrop-filter:blur(12px); border-top:1px solid #e1e5eb; padding:12px 16px; display:flex; gap:12px; z-index:30; }
  #submitBar button { flex:1; padding:14px; border-radius:14px; font-size:17px; font-weight:700; border:0; cursor:pointer; }
  #btnSubmit { background:linear-gradient(135deg,#1a73e8,#4a8ef7); color:#fff; box-shadow:0 4px 14px rgba(26,115,232,.35); }
  #result { display:none; }
  #result.show { display:block; }
  .score-big { text-align:center; padding:30px 0; }
  .score-big .num { font-size:64px; font-weight:800; color:var(--blue); }
  .score-big .total { font-size:20px; color:#5f6368; }
  .score-bar { height:12px; background:#f0f0f0; border-radius:6px; overflow:hidden; margin:16px 0; }
  .score-fill { height:100%; background:linear-gradient(90deg,#1a73e8,#6c3fd4); border-radius:6px; transition:width 1s ease; }
  /* 2026-10-13：夜间模式适配（走查发现白色字在白色卡上看不见） */
  html[data-theme="dark"] .section { background:#2d2d2d !important; border-color:#555 !important; }
  html[data-theme="dark"] .section h2, html[data-theme="dark"] .section h3 { color:#f0f0f0 !important; }
  html[data-theme="dark"] .section .sub { color:#aaa !important; }
  html[data-theme="dark"] .q { background:#333 !important; border-color:#555 !important; }
  html[data-theme="dark"] .q-num { color:#7ab8ff !important; }
  html[data-theme="dark"] .q-stem { color:#f0f0f0 !important; }
  html[data-theme="dark"] .opt { background:#3a3a3a !important; border-color:#555 !important; color:#f0f0f0 !important; }
  html[data-theme="dark"] input[type=text], html[data-theme="dark"] textarea { background:#3a3a3a !important; border-color:#555 !important; color:#f0f0f0 !important; }
  /* ===== 课程式播放器（2026-10-22，仅 exam-u2） ===== */
  .cs-top { display:flex; justify-content:space-between; gap:10px; font-weight:700; font-size:15px; color:#3c4043; margin-bottom:8px; flex-wrap:wrap; }
  .cs-track { height:10px; background:#e1e5eb; border-radius:5px; overflow:hidden; margin-bottom:10px; }
  .cs-fillbar { height:100%; background:linear-gradient(90deg,#1a73e8,#6c3fd4); width:0; transition:width .3s ease; }
  .cs-hint { font-size:13px; color:#80868b; margin-bottom:14px; }
  .cs-crumb { font-size:14px; color:var(--blue); font-weight:700; margin-bottom:6px; }
  .cs-passage, .cs-material { background:#f8f9fa; border-radius:12px; padding:16px; margin:12px 0; line-height:1.9; font-size:16px; white-space:pre-wrap; }
  .cs-material { background:#f0f7ff; }
  .cs-req { color:#5f6368; font-size:14px; margin:8px 0; line-height:1.7; }
  .cs-req ul { margin:4px 0 4px 18px; padding:0; }
  .cs-confirm { display:block; width:100%; margin-top:14px; background:linear-gradient(135deg,#1a73e8,#4a8ef7); color:#fff; border:0; border-radius:12px; padding:13px; font-size:16px; font-weight:700; cursor:pointer; }
  .cs-confirm:disabled { background:#c6d4ea; cursor:not-allowed; }
  .cs-nav { display:flex; gap:12px; margin:6px 0 10px; }
  .cs-nav button { flex:1; padding:13px; border-radius:12px; font-size:16px; font-weight:700; border:2px solid #e1e5eb; background:#fff; cursor:pointer; }
  .cs-nav button:disabled { opacity:.45; cursor:not-allowed; }
  .cs-nav #csNext { background:linear-gradient(135deg,#1a73e8,#4a8ef7); color:#fff; border:0; }
  .cs-nav #csNext:disabled { background:#c6d4ea; }
  .cs-fb { border-radius:12px; padding:14px 16px; margin-top:16px; font-size:15px; line-height:1.8; }
  .cs-fb.ok { background:#e6f4ea; color:#14532d; }
  .cs-fb.ng { background:#fce8e6; color:#7a1f1a; }
  .cs-fb.pend { background:#fff8e1; color:#7a5b12; }
  .cs-mat { background:#f0f7ff; border-radius:12px; padding:12px 16px; margin-top:10px; font-size:14px; line-height:1.8; color:#3c4043; white-space:pre-wrap; }
  .opt.cs-right { border-color:var(--green); background:#e6f4ea; }
  .opt.cs-wrongpick { border-color:var(--red); background:#fce8e6; }
  .opt:disabled { cursor:default; opacity:1; }
  .cs-wc { font-size:13px; color:#999; margin-top:6px; }
  .cs-skip { margin-top:10px; font-size:13px; }
  .cs-skip a { color:#80868b; }
  .cs-done-note { font-size:14px; color:#1e8e3e; margin:8px 0; }
  .cs-review-row { border-top:1px solid #f0f0f0; padding:10px 0; font-size:14px; line-height:1.7; }
  .cs-review-row:first-of-type { border-top:0; }
  html[data-theme="dark"] .cs-top { color:#e8eaed !important; }
  html[data-theme="dark"] .cs-passage, html[data-theme="dark"] .cs-material, html[data-theme="dark"] .cs-mat { background:#3a3a3a !important; color:#f0f0f0 !important; }
  html[data-theme="dark"] .cs-nav button { background:#333 !important; color:#f0f0f0 !important; border-color:#555 !important; }
  html[data-theme="dark"] .cs-nav #csNext { background:linear-gradient(135deg,#1a73e8,#4a8ef7) !important; color:#fff !important; }
</style>
</head>
<body>
<div id="topbar">
  <a class="back" href="/">←</a>
  <div class="title" id="examTitle">单元测验卷</div>
  <div id="timer">100:00</div>
</div>
<div id="wrap">
  <div id="examBody"><div style="text-align:center;padding:60px;color:#999;">加载中…</div></div>
  <div id="result"></div>
</div>
<div id="submitBar" style="display:none">
  <button id="btnSubmit" onclick="submitExam()">交卷</button>
</div>
<script>
let EXAM = null;
let ANSWERS = {};
let TIME_LEFT = 6000; // 100分钟
let timerInt = null;

async function load() {
  const id = new URLSearchParams(location.search).get('exam');
  if (!id) { document.getElementById('examBody').innerHTML = '缺少试卷ID'; return; }
  const r = await fetch('/api/exam/' + id);
  const d = await r.json();
  if (!d.ok) {
    // 2026-10-13修：把"为什么打不开"说清楚，不再统一显示"试卷加载失败"让学生猜
    const box = document.getElementById('examBody');
    const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    if (d.error === 'review_pending') {
      const items = (d.pending || []).map(p => `<li>${esc(p.label)}</li>`).join('');
      box.innerHTML = `<div style="text-align:center;padding:40px 20px;">
        <div style="font-size:18px;font-weight:700;margin-bottom:12px;">先完成复习，再来挑战测验卷 📝</div>
        <div style="color:#666;margin-bottom:16px;">还有以下复习没完成，完成后这张卷子会自动解锁：</div>
        <ul style="text-align:left;display:inline-block;color:#333;line-height:2;">${items}</ul>
        <div style="margin-top:16px;"><a href="/" style="color:#1a73e8;">← 回首页做复习</a></div></div>`;
    } else if (d.error === 'locked') {
      box.innerHTML = '<div style="text-align:center;padding:60px;color:#666;">学完本单元全部 5 节课后解锁这张测验卷</div>';
    } else {
      box.innerHTML = '试卷加载失败，请稍后再试';
    }
    return;
  }
  EXAM = d.exam;
  document.getElementById('examTitle').textContent = EXAM.title;
  // 2026-10-22：exam-u2 试点课程式（一题一屏+立即反馈），其他卷保持一页式
  if (id === 'exam-u2') { initCoursePlayer(); return; }
  render();
  document.getElementById('submitBar').style.display = 'flex';
  startTimer();
}

function render() {
  let html = '';
  EXAM.sections.forEach(sec => {
    html += `<div class="section"><h2>${sec.title}</h2><div class="sub">满分 ${sec.score != null ? sec.score : sec.total} 分</div>`;
    sec.parts.forEach(part => {
      if (part.title) html += `<h3 style="margin:16px 0 8px;font-size:18px;">${part.title}</h3>`;
      if (part.passage) html += `<div style="background:#f8f9fa;border-radius:12px;padding:16px;margin:12px 0;line-height:1.8;">${part.passage}</div>`;
      // 2026-10-22修：u3/u4/u5 的阅读/完形/语法填空材料存在每道题的 passage 字段里（同 part 内多题共用一段），
      // 旧版只渲染 part.passage，导致这些卷的材料根本不显示（学生反馈"测验卷没有题目"的主因之一）。
      // 同一段材料只在它第一次出现的那道题上方显示一次，后面题目不重复。
      let lastPass = '';
      part.questions.forEach((q, qi) => {
        const qid = sec.id + '-' + part.id + '-' + qi;
        html += `<div class="q"><div class="q-num">${q.num || (qi+1)}. (${q.score}分)</div>`;
        if (q.audio) html += `<button class="audio-btn" onclick="playAudio('${q.audio}')">🔊 播放</button>`;
        if (q.type !== 'speak' && q.passage && q.passage !== lastPass) {
          lastPass = q.passage;
          html += `<div style="background:#f8f9fa;border-radius:12px;padding:16px;margin:12px 0;line-height:1.8;white-space:pre-wrap;">${q.passage}</div>`;
        }
        if (q.stem) html += `<div class="q-stem">${q.stem}</div>`;
        // 2026-10-13修：u2卷用prompt字段，前端之前只认stem，导致题目不显示
        if (q.prompt) html += `<div class="q-stem">${q.prompt}</div>`;
        if (q.requirements) html += `<div style="color:#5f6368;font-size:14px;margin:8px 0;line-height:1.7;">${q.requirements}</div>`;
        // 2026-10-22修：hint 字段旧版只用作写作框占位符，选择/填空题的 hint 从不显示；
        // 其中 u5 完形整篇短文就藏在第一题的 hint 里，不显示等于没题干。长 hint 按材料块显示，短 hint 显示为提示行。
        if (q.hint && q.type !== 'writing') {
          if (q.hint.length > 120) html += `<div style="background:#f8f9fa;border-radius:12px;padding:16px;margin:12px 0;line-height:1.8;white-space:pre-wrap;">${q.hint}</div>`;
          else html += `<div style="font-size:13px;color:#999;margin:6px 0;">💡 ${q.hint}</div>`;
        }
        if (q.type === 'choice') {
          q.options.forEach((op, oi) => {
            html += `<button class="opt" data-qid="${qid}" data-oi="${oi}" onclick="selectOpt('${qid}',${oi})"><span class="k">${'ABCD'[oi]}</span>${op}</button>`;
          });
        } else if (q.type === 'fill') {
          html += `<input type="text" data-qid="${qid}" placeholder="请输入答案" oninput="ANSWERS['${qid}']=this.value">`;
        } else if (q.type === 'writing') {
          html += `<textarea data-qid="${qid}" placeholder="${q.hint || '请作答'}" oninput="ANSWERS['${qid}']=this.value"></textarea>`;
          if (q.min_words) html += `<div style="font-size:13px;color:#999;margin-top:6px;">不少于 ${q.min_words} 词</div>`;
        } else if (q.type === 'speak') {
          // 2026-10-13修：显示朗读材料（之前只显示录音按钮，材料看不见）
          const material = q.text || q.passage;
          if (material) html += `<div style="background:#f0f7ff;border-radius:12px;padding:16px;margin:12px 0;line-height:1.9;font-size:16px;">${material}</div>`;
          html += `<div style="margin:8px 0;"><button class="rec-btn" onclick="toggleRec('${qid}',this)">🎤 开始录音</button><span class="rec-status" id="st-${qid}"></span></div>`;
          html += `<div style="font-size:13px;color:#999;">${q.speak_hint || '录音完成后由老师批改计分'}</div>`;
        }
        html += `</div>`;
      });
    });
    html += `</div>`;
  });
  document.getElementById('examBody').innerHTML = html;
}

function selectOpt(qid, oi) {
  ANSWERS[qid] = oi;
  document.querySelectorAll(`[data-qid="${qid}"]`).forEach(b => b.classList.remove('sel'));
  document.querySelector(`[data-qid="${qid}"][data-oi="${oi}"]`).classList.add('sel');
}

function playAudio(url) {
  const a = new Audio(url);
  a.play().catch(e => prettyAlert('音频播放失败', '🔇'));
}

// 口语录音留存（2026-10-23）：旧版录完只在页面上标"已录音"，录音本体直接丢弃，
// 老师事后无从批改。现在录完立刻上传存到服务器（BLOB 进库、随备份链走），
// 服务器确认存好才标"已录音"；没存上会明确提示重录，绝不假装存了。
const SPEECH_OK = {}; // qid -> true：该题已有一段录音在服务器存好
async function uploadSpeechAudio(qid, blob, durationSec) {
  const examId = new URLSearchParams(location.search).get('exam');
  const b64 = await new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => { const t = String(fr.result || ''); const i = t.indexOf('base64,'); resolve(i >= 0 ? t.slice(i + 7) : t); };
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
  const resp = await fetch('/api/exam/speech', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ exam_id: examId, qid, audio_b64: b64, mime: blob.type || '', duration_sec: durationSec || null })
  });
  const d = await resp.json().catch(() => null);
  if (!resp.ok || !d || !d.ok) throw new Error('speech upload failed');
  SPEECH_OK[qid] = true;
  return d;
}

let mediaRec = null, recChunks = [], recStartTs = 0;
async function toggleRec(qid, btn) {
  const st = document.getElementById('st-' + qid);
  if (mediaRec && mediaRec.state === 'recording') {
    mediaRec.stop();
    btn.textContent = '🎤 开始录音';
    btn.classList.remove('stop');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRec = new MediaRecorder(stream);
    const recMime = mediaRec.mimeType || 'audio/webm';
    recChunks = [];
    recStartTs = Date.now();
    mediaRec.ondataavailable = e => recChunks.push(e.data);
    mediaRec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const dur = Math.max(1, Math.round((Date.now() - recStartTs) / 1000));
      const blob = new Blob(recChunks, { type: recMime });
      st.textContent = '⏳ 录音保存中…';
      btn.disabled = true;
      try {
        await uploadSpeechAudio(qid, blob, dur);
        st.textContent = '✅ 已录音';
        ANSWERS[qid] = 'recorded'; // 参与分
      } catch (e) {
        st.textContent = SPEECH_OK[qid]
          ? '⚠️ 这次没存上，还是上一段录音。可以再录一次'
          : '⚠️ 录音没存上，再录一次';
      }
      btn.disabled = false;
    };
    mediaRec.start();
    btn.textContent = '⏹ 停止';
    btn.classList.add('stop');
    st.textContent = '🔴 录音中…';
  } catch (e) {
    prettyAlert('无法访问麦克风', '🎤');
  }
}

function startTimer() {
  timerInt = setInterval(() => {
    TIME_LEFT--;
    const m = Math.floor(TIME_LEFT / 60), s = TIME_LEFT % 60;
    document.getElementById('timer').textContent = `${m}:${String(s).padStart(2,'0')}`;
    if (TIME_LEFT <= 0) { clearInterval(timerInt); submitExam(); }
  }, 1000);
}

async function submitExam() {
  if (!await prettyConfirm('确定交卷吗？', {icon:'📝'})) return;
  clearInterval(timerInt);
  document.getElementById('submitBar').style.display = 'none';
  document.getElementById('examBody').innerHTML = '<div class="section" style="text-align:center;padding:40px;">判分中…</div>';
  // 只传原始答案，分数由服务端判
  const examId = new URLSearchParams(location.search).get('exam');
  const resp = await fetch('/api/exam/submit', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ exam_id: examId, answers: ANSWERS })
  });
  const data = await resp.json();
  if (!data.ok) {
    document.getElementById('examBody').innerHTML = '<div class="section" style="text-align:center;padding:40px;">提交失败，请重试</div>';
    return;
  }
  showResult(data);
}

function showResult(data) {
  const score = data.score, totalObj = data.total_objective, pending = data.pending || [];
  const total = EXAM.total_score;
  const pendingScore = pending.reduce((s, p) => s + p.max, 0);
  const pct = totalObj > 0 ? Math.round(score / totalObj * 100) : 0;
  document.getElementById('examBody').style.display = 'none';
  const r = document.getElementById('result');
  r.className = 'show';
  let pendingHtml = '';
  if (pending.length > 0) {
    const names = pending.map(p => (p.type === 'speak' ? '口语' : '写作') + p.num + '题(' + p.max + '分)').join('、');
    pendingHtml = `<div style="font-size:14px;color:#b7791f;margin-top:12px;background:#fff8e1;border-radius:8px;padding:10px;">⏳ ${names}待评分（共${pendingScore}分），请妈妈批改后计入总分</div>`;
  }
  // 2026-10-23：逐题回顾（交卷后即时展示，用交卷响应的 detail + 页面内试卷数据渲染，不新增接口）
  const escHtml = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const flatQ = {};
  EXAM.sections.forEach(sec => sec.parts.forEach(part => {
    part.questions.forEach((q, qi) => { flatQ[sec.id + '-' + part.id + '-' + qi] = q; });
  }));
  const TYPE_NAME = { choice: '选择题', fill: '填空题', speak: '口语题', writing: '写作题' };
  let reviewHtml = '';
  const details = data.detail || [];
  if (details.length) {
    let rows = '';
    details.forEach((d, i) => {
      const q = flatQ[d.qid] || {};
      const stemRaw = String(q.stem || q.prompt || '');
      const stem = stemRaw.length > 60 ? stemRaw.slice(0, 60) + '…' : stemRaw;
      let head = `<b>第 ${i + 1} 题</b>（${TYPE_NAME[d.type] || ''} ${d.max} 分）`;
      let body = '';
      if (d.status === 'pending') {
        head += ' ⏳ 待批改';
        if (d.type === 'writing') {
          body = String(d.given || '').trim()
            ? '你写的内容：<br><span style="white-space:pre-wrap;">' + escHtml(d.given) + '</span>'
            : '未作答';
        } else {
          body = d.given === 'recorded' ? '已录音，待老师批改' : '未录音，待老师批改';
        }
      } else if (d.status === 'graded') {
        head += ' ✅ 已批改（' + d.got + ' 分）';
        if (d.type === 'writing') {
          body = String(d.given || '').trim()
            ? '你写的内容：<br><span style="white-space:pre-wrap;">' + escHtml(d.given) + '</span>'
            : '未作答';
        } else {
          body = d.given === 'recorded' ? '已录音，已批改' : '未录音，已批改';
        }
        if (d.note) body += '<br>老师评语：' + escHtml(d.note);
      } else {
        head += d.got === d.max ? ' ✅ 答对' : ' ❌ 答错';
        if (d.type === 'choice') {
          const opts = q.options || [];
          let gi = Number(d.given);
          if ((d.given === null || isNaN(gi)) && typeof d.given === 'string') gi = opts.indexOf(d.given);
          const mine = (d.given === null || d.given === '' || isNaN(gi) || gi < 0 || gi >= opts.length)
            ? '未答' : 'ABCD'[gi] + '「' + escHtml(opts[gi]) + '」';
          body = '你的答案：' + mine;
          if (d.answer) body += '<br>正确答案：' + (d.answer.letter || '') + '「' + escHtml(d.answer.text || '') + '」';
        } else {
          body = '你的答案：「' + escHtml(d.given == null ? '' : d.given) + '」';
          if (d.answer) body += '<br>正确答案：「' + escHtml(d.answer.text || '') + '」';
        }
      }
      rows += `<div class="cs-review-row">${head}${stem ? '<br><span style="color:#5f6368;">' + escHtml(stem) + '</span>' : ''}<br>${body}</div>`;
    });
    reviewHtml = `<div class="section"><h2 style="font-size:19px;margin:0 0 8px;">逐题回顾</h2>${rows}</div>`;
  }
  r.innerHTML = `<div class="section"><div class="score-big">
    <div class="num">${score}</div><div class="total">/ ${totalObj} 分（客观题）</div>
    <div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div>
    <div style="font-size:16px;color:#5f6368;">${pct >= 90 ? '🎉 太棒了！' : pct >= 60 ? '💪 继续加油！' : '📚 还需要努力哦'}</div>
    ${pendingHtml}
    <div style="font-size:13px;color:#999;margin-top:8px;">全卷满分 ${total} 分</div>
  </div></div>
  ${reviewHtml}
  <div class="section" style="text-align:center;"><a href="/" style="color:var(--blue);text-decoration:none;font-size:17px;">← 返回首页</a></div>`;
  window.scrollTo(0, 0);
}

load();
</script>
<script src="/modal.js"></script>
<script>
// ================= 课程式播放器（2026-10-22，仅 exam-u2） =================
// 一题一屏、答完立即判分（服务端 /api/exam/answer，与整卷判分共用同一判分逻辑）、
// 进度存服务端：中途退出再打开自动续答。其他测验卷仍走上方一页式，互不影响。
const CS = {
  flat: [], idx: 0, state: {}, sel: null,
  elapsedBase: 0, sessionStart: Date.now(), timerInt: null,
  rec: null, chunks: [], recorded: false
};
const CS_TYPE_NAME = { choice: '选择题', fill: '填空题', speak: '口语题', writing: '写作题' };
function csEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function csElapsed() { return CS.elapsedBase + Math.floor((Date.now() - CS.sessionStart) / 1000); }
function csFmtTime(sec) { return Math.floor(sec / 60) + '分' + String(sec % 60).padStart(2, '0') + '秒'; }
function csTick() {
  const el = document.getElementById('timer');
  if (el) { const s = csElapsed(); el.textContent = '已用时 ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
}
function csFlatten() {
  const out = [];
  EXAM.sections.forEach(sec => sec.parts.forEach(part => {
    part.questions.forEach((q, qi) => {
      out.push({ qid: sec.id + '-' + part.id + '-' + qi, secTitle: sec.title, partTitle: part.title || '', passage: part.passage || '', q });
    });
  }));
  return out;
}

async function initCoursePlayer() {
  CS.flat = csFlatten();
  try {
    const r = await fetch('/api/exam/progress/' + EXAM.id);
    const d = await r.json();
    if (d.ok && d.progress) {
      CS.elapsedBase = d.progress.elapsed_sec || 0;
      Object.keys(d.progress.answers || {}).forEach(qid => { CS.state[qid] = d.progress.answers[qid]; });
    }
  } catch (e) { /* 拿不到进度就从头开始，不挡住考试 */ }
  CS.sessionStart = Date.now();
  const first = CS.flat.findIndex(e => !CS.state[e.qid]);
  CS.idx = first === -1 ? CS.flat.length - 1 : first;
  document.getElementById('examBody').innerHTML =
    '<div class="cs-top"><span id="csProg"></span><span id="csScore"></span></div>' +
    '<div class="cs-track"><div class="cs-fillbar" id="csBar"></div></div>' +
    '<div class="cs-hint">进度会自动保存，中途退出也没关系，下次打开接着做。建议 100 分钟内做完。</div>' +
    '<div id="csCard"></div>' +
    '<div class="cs-nav"><button id="csPrev" onclick="csGo(-1)">← 上一题</button><button id="csNext" onclick="csNext()"></button></div>';
  csTick();
  CS.timerInt = setInterval(csTick, 1000);
  csShow(CS.idx);
}

function csShow(i) {
  CS.idx = i; CS.sel = null; CS.recorded = false;
  const e = CS.flat[i], q = e.q, st = CS.state[e.qid];
  const answered = !!st;
  let h = '<div class="section">';
  h += `<div class="cs-crumb">${csEsc(e.secTitle)}${e.partTitle ? ' · ' + csEsc(e.partTitle) : ''}</div>`;
  h += `<div class="q-num">第 ${i + 1} 题（${q.score} 分）· ${CS_TYPE_NAME[q.type] || ''}</div>`;
  if (e.passage) h += `<div class="cs-passage">${csEsc(e.passage)}</div>`;
  if (q.audio) h += `<button class="audio-btn" onclick="playAudio('${q.audio}')">🔊 播放</button>`;
  if (q.stem) h += `<div class="q-stem">${csEsc(q.stem)}</div>`;
  if (q.prompt) h += `<div class="q-stem">${csEsc(q.prompt)}</div>`;
  if (q.requirements) {
    const reqs = Array.isArray(q.requirements) ? q.requirements : [q.requirements];
    h += '<div class="cs-req">内容要点：<ul>' + reqs.map(r => `<li>${csEsc(r)}</li>`).join('') + '</ul></div>';
  }
  if (q.type === 'choice') {
    const ci = answered && st.answer_display ? 'ABCD'.indexOf(st.answer_display.letter) : -1;
    q.options.forEach((op, oi) => {
      let cls = 'opt';
      if (answered) {
        if (oi === ci) cls += ' cs-right';
        else if (Number(st.given) === oi) cls += ' cs-wrongpick';
        if (Number(st.given) === oi) cls += ' sel';
      }
      h += `<button class="${cls}" id="csopt-${oi}" ${answered ? 'disabled' : ''} onclick="csPick(${oi})"><span class="k">${'ABCD'[oi]}</span>${csEsc(op)}</button>`;
    });
    if (!answered) h += '<button class="cs-confirm" id="csConfirm" disabled onclick="csConfirmChoice()">确认这道题</button>';
  } else if (q.type === 'fill') {
    h += `<input type="text" id="csFill" placeholder="请输入答案" value="${answered ? csEsc(st.given) : ''}" ${answered ? 'disabled' : ''}>`;
    if (!answered) h += '<button class="cs-confirm" id="csConfirm" onclick="csConfirmFill()">确认这道题</button>';
  } else if (q.type === 'speak') {
    const material = q.text || q.passage;
    if (material) h += `<div class="cs-material">${csEsc(material)}</div>`;
    if (answered) h += `<div class="cs-done-note">${st.given === 'recorded' ? '✅ 这道题已录音保存。想重录可以再录一次，会自动更新。' : '这道题已跳过录音。有麦克风时可以再录一次，会自动更新。'}</div>`;
    h += '<div style="margin:8px 0;"><button class="rec-btn" id="csRecBtn" onclick="csToggleRec()">🎤 开始录音</button><span class="rec-status" id="csRecSt"></span></div>';
    if (!answered) {
      h += '<button class="cs-confirm" id="csSpeakDone" disabled onclick="csConfirmSpeak()">这道题做完了</button>';
      h += '<div class="cs-skip"><a href="javascript:void(0)" onclick="csSkipSpeak()">没有麦克风？跳过录音，直接完成这道题</a></div>';
    }
    h += '<div style="font-size:13px;color:#999;">朗读录音会留给老师批改</div>';
  } else if (q.type === 'writing') {
    if (q.tips) h += `<div class="cs-req">提示：${csEsc(q.tips)}</div>`;
    h += `<textarea id="csWrite" placeholder="请在这里作答" oninput="csWordCount()">${answered ? csEsc(st.given) : ''}</textarea>`;
    h += `<div class="cs-wc"><span id="csWc"></span>${q.min_words ? ' · 不少于 ' + q.min_words + ' 词' : ''}</div>`;
    h += `<button class="cs-confirm" id="csConfirm" onclick="csConfirmWriting()">${answered ? '重新保存' : '保存这道题'}</button>`;
  }
  if (answered) h += csFeedbackHtml(e, st);
  h += '</div>';
  document.getElementById('csCard').innerHTML = h;
  if (q.type === 'writing') csWordCount();
  csUpdateChrome();
}

function csFeedbackHtml(e, st) {
  const q = e.q;
  if (st.result === 'pending') {
    return `<div class="cs-fb pend">${q.type === 'speak' ? '🎤' : '✍️'} 已保存。这道题 ${st.max} 分由老师批改，先不计入现在的得分。</div>`;
  }
  if (st.result === 'correct') {
    let s = `✅ 答对了，这道题 ${st.max} 分。`;
    if (q.type === 'fill' && st.answer_display) s += `标准答案：「${csEsc(st.answer_display.text)}」`;
    return `<div class="cs-fb ok">${s}</div>`;
  }
  let s = '❌ 这道题没答对。';
  if (q.type === 'choice' && st.answer_display) {
    const gi = Number(st.given);
    s += `你选的是 ${'ABCD'[gi] || ''}「${csEsc(q.options[gi] || '')}」，正确答案是 ${st.answer_display.letter}「${csEsc(st.answer_display.text)}」。`;
  } else if (q.type === 'fill' && st.answer_display) {
    s += `你写的是「${csEsc(st.given)}」，正确答案是「${csEsc(st.answer_display.text)}」。`;
  }
  let h = `<div class="cs-fb ng">${s}</div>`;
  if (st.material) h += `<div class="cs-mat">听力原文：${csEsc(st.material)}</div>`;
  return h;
}

function csUpdateChrome() {
  const total = CS.flat.length, done = Object.keys(CS.state).length;
  let got = 0, mx = 0;
  CS.flat.forEach(e => { const st = CS.state[e.qid]; if (st && st.result !== 'pending') { got += st.got; mx += st.max; } });
  document.getElementById('csProg').textContent = `第 ${CS.idx + 1} / ${total} 题 · 已答 ${done} 题`;
  document.getElementById('csScore').textContent = mx > 0 ? `客观题已得 ${got} / ${mx} 分` : '';
  document.getElementById('csBar').style.width = (done / total * 100) + '%';
  document.getElementById('csPrev').disabled = CS.idx === 0;
  const next = document.getElementById('csNext');
  if (CS.idx === total - 1) {
    next.textContent = done === total ? '交卷看结果 📝' : '这是最后一题';
    next.disabled = done !== total;
  } else {
    next.textContent = '下一题 →';
    next.disabled = !CS.state[CS.flat[CS.idx].qid];
  }
}

function csGo(d) {
  const n = CS.idx + d;
  if (n < 0 || n >= CS.flat.length) return;
  csShow(n);
  window.scrollTo(0, 0);
}
async function csNext() {
  if (CS.idx === CS.flat.length - 1) {
    if (Object.keys(CS.state).length === CS.flat.length) csFinish();
    return;
  }
  csGo(1);
}

function csPick(oi) {
  CS.sel = oi;
  document.querySelectorAll('[id^="csopt-"]').forEach(b => b.classList.remove('sel'));
  const b = document.getElementById('csopt-' + oi);
  if (b) b.classList.add('sel');
  const c = document.getElementById('csConfirm');
  if (c) c.disabled = false;
}
function csConfirmChoice() { if (CS.sel !== null) csSave(CS.sel); }
function csConfirmFill() {
  const v = document.getElementById('csFill').value;
  if (!v.trim()) { prettyAlert('先写上你的答案，再确认这道题', '✏️'); return; }
  csSave(v);
}
function csConfirmSpeak() { if (CS.recorded) csSave('recorded'); }
async function csSkipSpeak() {
  if (!await prettyConfirm('没有麦克风就先跳过录音，这道题照样由老师批改。可以吗？', { icon: '🎤' })) return;
  csSave('skipped_no_mic');
}
function csWordCount() {
  const t = document.getElementById('csWrite'), w = document.getElementById('csWc');
  if (!t || !w) return;
  w.textContent = '已写 ' + (t.value.trim() ? t.value.trim().split(/\s+/).length : 0) + ' 词';
}
function csConfirmWriting() {
  const v = document.getElementById('csWrite').value;
  if (!v.trim()) { prettyAlert('先写一点内容，再保存这道题', '✏️'); return; }
  csSave(v);
}

async function csSave(given) {
  const e = CS.flat[CS.idx];
  const btn = document.getElementById('csConfirm') || document.getElementById('csSpeakDone');
  if (btn) btn.disabled = true;
  try {
    const r = await fetch('/api/exam/answer', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ exam_id: EXAM.id, qid: e.qid, given, elapsed: csElapsed() })
    });
    const d = await r.json();
    if (!d.ok) { prettyAlert('保存失败，请再试一次', '⚠️'); if (btn) btn.disabled = false; return; }
    CS.state[e.qid] = { given, got: d.got, max: d.max, result: d.result, answer_display: d.answer_display, material: d.material };
    csShow(CS.idx);
  } catch (err) {
    prettyAlert('网络不太好，保存失败，请再试一次', '⚠️');
    if (btn) btn.disabled = false;
  }
}

async function csToggleRec() {
  const btn = document.getElementById('csRecBtn'), stEl = document.getElementById('csRecSt');
  if (CS.rec && CS.rec.state === 'recording') {
    CS.rec.stop();
    btn.textContent = '🎤 开始录音';
    btn.classList.remove('stop');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    CS.rec = new MediaRecorder(stream);
    CS.chunks = [];
    CS.rec.ondataavailable = ev => CS.chunks.push(ev.data);
    CS.rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      stEl.textContent = '✅ 已录音';
      CS.recorded = true;
      const e = CS.flat[CS.idx];
      if (CS.state[e.qid]) csSave('recorded');
      else { const b = document.getElementById('csSpeakDone'); if (b) b.disabled = false; }
    };
    CS.rec.start();
    btn.textContent = '⏹ 停止';
    btn.classList.add('stop');
    stEl.textContent = '🔴 录音中…';
  } catch (err) {
    prettyAlert('无法访问麦克风，可以用下面的"跳过录音"先完成这道题', '🎤');
  }
}

async function csFinish() {
  if (!await prettyConfirm('都答完了吗？交卷后就能看到成绩。', { icon: '📝' })) return;
  clearInterval(CS.timerInt);
  const answers = {};
  CS.flat.forEach(e => { const st = CS.state[e.qid]; if (st) answers[e.qid] = st.given; });
  document.getElementById('examBody').innerHTML = '<div class="section" style="text-align:center;padding:40px;">判分中…</div>';
  try {
    const resp = await fetch('/api/exam/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ exam_id: EXAM.id, answers })
    });
    const data = await resp.json();
    if (!data.ok) throw new Error('submit failed');
    csShowResult(data);
  } catch (e) {
    document.getElementById('examBody').innerHTML = '<div class="section" style="text-align:center;padding:40px;">提交失败，请刷新页面重试。你的答案都已保存，不会丢。</div>';
  }
}

function csShowResult(data) {
  const detailMap = {};
  (data.detail || []).forEach(d => { detailMap[d.qid] = d; });
  let right = 0, wrong = 0;
  (data.detail || []).forEach(d => { if (d.status === 'auto') { if (d.got === d.max) right++; else wrong++; } });
  const pending = data.pending || [];
  const pendingScore = pending.reduce((s, p) => s + p.max, 0);
  const pct = data.total_objective > 0 ? Math.round(data.score / data.total_objective * 100) : 0;
  document.getElementById('examBody').style.display = 'none';
  const r = document.getElementById('result');
  r.className = 'show';
  let h = `<div class="section"><div class="score-big">
    <div class="num">${data.score}</div><div class="total">/ ${data.total_objective} 分（客观题）</div>
    <div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div>
    <div style="font-size:16px;color:#5f6368;">客观题答对 ${right} 道、答错 ${wrong} 道 · 用时 ${csFmtTime(csElapsed())}</div>`;
  if (pending.length) h += `<div style="font-size:14px;color:#b7791f;margin-top:12px;background:#fff8e1;border-radius:8px;padding:10px;">⏳ 口语和写作共 ${pending.length} 道（${pendingScore} 分）待老师批改，批改后计入总分</div>`;
  h += `<div style="font-size:13px;color:#999;margin-top:8px;">全卷满分 ${EXAM.total_score} 分</div></div></div>`;
  h += '<div class="section"><h2 style="font-size:19px;margin:0 0 8px;">逐题回顾</h2>';
  CS.flat.forEach((e, i) => {
    const d = detailMap[e.qid], st = CS.state[e.qid];
    if (!d) return;
    let icon = '⏳ 待批改';
    if (d.status === 'auto') icon = d.got === d.max ? '✅ 答对' : '❌ 答错';
    else if (d.status === 'graded') icon = '✅ 已批改（' + d.got + ' 分）';
    let mine = '', correct = '';
    if (e.q.type === 'choice') {
      const gi = Number(d.given);
      mine = '你的答案：' + (isNaN(gi) || d.given === null ? '未答' : 'ABCD'[gi] + '「' + csEsc(e.q.options[gi] || '') + '」');
      if (st && st.answer_display) correct = '正确答案：' + st.answer_display.letter + '「' + csEsc(st.answer_display.text) + '」';
    } else if (e.q.type === 'fill') {
      mine = '你的答案：「' + csEsc(String(d.given == null ? '' : d.given).slice(0, 60)) + '」';
      if (st && st.answer_display) correct = '正确答案：「' + csEsc(st.answer_display.text) + '」';
    } else if (e.q.type === 'speak') {
      mine = d.status === 'graded'
        ? (d.given === 'recorded' ? '已录音，已批改' : '跳过录音，已批改') + (d.note ? '（评语：' + csEsc(d.note) + '）' : '')
        : (d.given === 'recorded' ? '已录音，待老师批改' : '跳过录音，待老师批改');
    } else if (e.q.type === 'writing') {
      mine = '作文开头：「' + csEsc(String(d.given == null ? '' : d.given).slice(0, 50)) + '…」'
        + (d.status === 'graded' ? '已批改' + (d.note ? '（评语：' + csEsc(d.note) + '）' : '') : '待老师批改');
    }
    h += `<div class="cs-review-row"><b>第 ${i + 1} 题</b>（${CS_TYPE_NAME[e.q.type] || ''} ${d.max} 分）${icon}<br>${mine}${correct ? '<br>' + correct : ''}</div>`;
  });
  h += '</div>';
  h += '<div class="section" style="text-align:center;"><a href="/" style="color:var(--blue);text-decoration:none;font-size:17px;">← 返回首页</a></div>';
  r.innerHTML = h;
  window.scrollTo(0, 0);
}

</script>
</body>
</html>
