<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="/client-error.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的生词本 · 小禾英语</title>
<style>
  :root { --blue:#1a73e8; --muted:#5f6368; --line:#dadce0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif; margin:0; background:var(--bg,#f0f4fa); color:var(--ink,#202124); -webkit-font-smoothing:antialiased; }
  #topbar { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 12px rgba(60,64,67,.06); }
  #topbar b { font-size:19px; font-weight:800; letter-spacing:.5px; }
  #topbar .back { border:0; background:var(--blue-light,#e8f0fe); font-size:16px; font-weight:600; color:var(--blue); cursor:pointer; padding:8px 16px; border-radius:999px; transition:transform .15s ease; }
  #topbar .back:active { transform:scale(.95); }
  #topbar .count { margin-left:auto; color:var(--muted); font-size:13px; font-weight:600; background:rgba(26,115,232,.08); border-radius:999px; padding:5px 13px; }
  #wrap { max-width:720px; margin:0 auto; padding:20px 16px 120px; }
  .card { background:var(--card,#fff); border:1px solid rgba(225,229,235,.7); border-radius:var(--radius-lg,20px); padding:16px 18px; margin-bottom:14px; box-shadow:var(--shadow-sm); transition:box-shadow .25s ease, transform .25s ease; }
  #list .card:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); }
  .wrow { display:flex; align-items:center; gap:12px; }
  .wrow > div:first-child { min-width:0; flex:1; }
  .wrow .ww { font-size:22px; font-weight:800; letter-spacing:.3px; color:var(--ink,#202124); line-height:1.35; }
  .wrow .wp { color:var(--muted); font-size:13px; margin-top:4px; letter-spacing:.6px; }
  .wrow .wz { font-size:16px; font-weight:500; color:var(--ink,#202124); margin-top:6px; line-height:1.55; }
  .wrow .wsen { font-size:13px; color:var(--muted); margin-top:9px; line-height:1.7; border-left:3px solid var(--blue); background:var(--blue-light,#e8f0fe); border-radius:0 10px 10px 0; padding:8px 12px; } /* 生词原句 */
  .wrow .ops { margin-left:auto; display:flex; gap:8px; flex-shrink:0; align-items:center; }
  .wrow .ops button { border:1px solid var(--line); background:var(--card,#fff); border-radius:12px; padding:9px 13px; font-size:14px; cursor:pointer; box-shadow:var(--shadow-sm); transition:transform .15s ease, box-shadow .2s ease; color:var(--muted); }
  .wrow .ops button:active { transform:scale(.92); box-shadow:none; }
  .wrow .ops button:first-child { width:46px; height:46px; border-radius:50%; padding:0; font-size:19px; background:var(--blue-light,#e8f0fe); border-color:transparent; color:var(--blue); display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(26,115,232,.22); }
  .empty { text-align:center; color:var(--muted); padding:60px 28px 64px; font-size:16px; line-height:2.1; background:var(--card,#fff); border:2px dashed var(--line); border-radius:var(--radius-xl,24px); box-shadow:var(--shadow-sm); }
  .empty::before { content:"📚"; display:block; font-size:56px; margin-bottom:14px; filter:drop-shadow(0 4px 8px rgba(60,64,67,.15)); }
  .empty b { color:var(--blue); }
  #reviewBar { position:fixed; bottom:64px; left:0; right:0; background:rgba(255,255,255,.94); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; z-index:20; box-shadow:0 -4px 16px rgba(60,64,67,.08); }
  #reviewBar button { flex:1; padding:15px 8px; font-size:16px; font-weight:700; border-radius:var(--radius-md,16px); border:0; cursor:pointer; color:#fff; box-shadow:0 4px 12px rgba(60,64,67,.18), inset 0 1px 0 rgba(255,255,255,.25); transition:transform .15s ease, box-shadow .2s ease, filter .2s ease; }
  #reviewBar button:active { transform:scale(.95); box-shadow:0 2px 6px rgba(60,64,67,.15); filter:brightness(.94); }
  #btnReview { background:linear-gradient(135deg,#1a73e8 0%,#4a8ef7 100%); }
  #btnSpell { background:linear-gradient(135deg,#e37400 0%,#f59842 100%); } /* 拼写模式：橙色 */
  #btnMatch { background:linear-gradient(135deg,#7b1fa2 0%,#9d4edd 100%) !important; } /* 消消乐：紫色（覆盖内联样式） */
  html[data-theme="dark"] #reviewBar { background:rgba(45,45,45,.94); }
  /* 消消乐卡片 */
  .match-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin:18px 0; }
  .match-card { background:var(--card,#fff); border:2px solid var(--line); border-radius:var(--radius-md,16px); padding:18px 8px; text-align:center; font-size:17px; font-weight:700; cursor:pointer; min-height:78px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); transition:transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, background .25s ease, border-color .25s ease, opacity .3s ease; will-change:transform; word-break:break-word; overflow-wrap:break-word; }
  /* 中文释义卡片：字小一点，行高松一点，长释义不挤 (2026-10-19 Elouise：消单词排版问题) */
  .match-card.zh { font-size:13px; font-weight:500; line-height:1.5; padding:12px 8px; min-height:88px; }
  .match-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
  .match-card.selected { border-color:var(--blue); background:linear-gradient(135deg,var(--blue-light,#e8f0fe) 0%,rgba(232,240,254,.55) 100%); transform:scale(1.07) translateY(-2px); box-shadow:0 8px 20px rgba(26,115,232,.38), inset 0 1px 0 rgba(255,255,255,.4); }
  .match-card.matched { opacity:0; pointer-events:none; transform:scale(.7) rotate(6deg); }
  .match-card.wrong { border-color:var(--red,#c5221f); background:var(--red-light,#fce8e6); animation:shake .4s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
  /* 复习卡片 */
  #revOverlay { display:none; position:fixed; inset:0; background:linear-gradient(160deg,rgba(26,115,232,.12),rgba(240,244,250,.97)); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); z-index:50; align-items:center; justify-content:center; padding:20px; }
  #revCard { position:relative; background:var(--card,#fff); border-radius:var(--radius-xl,24px); padding:42px 28px 32px; max-width:430px; width:100%; text-align:center; box-shadow:var(--shadow-lg); overflow:hidden; animation:cardIn .38s cubic-bezier(.34,1.35,.64,1); }
  #revCard::before { content:""; position:absolute; top:0; left:0; right:0; height:6px; background:linear-gradient(90deg,#1a73e8,#7ab8ff,#9d4edd); }
  @keyframes cardIn { from { opacity:0; transform:translateY(26px) scale(.95); } to { opacity:1; transform:none; } }
  #revCard .rw { font-size:42px; font-weight:800; letter-spacing:.5px; margin:4px 0 8px; color:var(--ink,#202124); line-height:1.25; text-shadow:0 2px 14px rgba(26,115,232,.14); }
  #revCard .rp { color:var(--muted); font-size:16px; margin-bottom:14px; letter-spacing:1px; }
  #revCard .rz { font-size:20px; font-weight:600; min-height:64px; color:var(--ink,#202124); display:flex; align-items:center; justify-content:center; line-height:1.6; }
  #revCard .rz.hidden { color:#c3c9d1; font-weight:400; }
  #revCard .rsen { font-size:14px; color:var(--muted); margin:12px 0 6px; line-height:1.8; background:var(--bg,#f0f4fa); border-radius:12px; padding:10px 14px; } /* 复习卡片里的原句 */
  #revCard .rrow { display:flex; gap:12px; margin-top:22px; }
  #revCard .rrow button { flex:1; padding:15px; font-size:16px; font-weight:700; border-radius:var(--radius-md,16px); border:0; cursor:pointer; box-shadow:var(--shadow-sm); transition:transform .15s ease, box-shadow .2s ease; }
  #revCard .rrow button:active { transform:scale(.95); box-shadow:none; }
  #revFlip { background:linear-gradient(135deg,#1a73e8 0%,#4a8ef7 100%); color:#fff; width:100%; margin-top:10px; padding:15px; font-size:16px; font-weight:700; border-radius:var(--radius-md,16px); border:0; cursor:pointer; box-shadow:0 4px 14px rgba(26,115,232,.35), inset 0 1px 0 rgba(255,255,255,.25); transition:transform .15s ease; }
  #revFlip:active { transform:scale(.97); }
  #revNo { background:var(--red-light,#fce8e6); color:var(--red,#c5221f); }
  #revYes { background:var(--green-light,#e6f4ea); color:var(--green,#137333); }
  #revProg { display:inline-block; color:var(--muted); font-size:13px; font-weight:600; letter-spacing:.5px; margin-bottom:14px; background:var(--bg,#f0f4fa); border-radius:999px; padding:6px 16px; }
  #revProg:empty { display:none; }
  #revDone { display:none; }
  /* 拼写输入框/提交按钮（JS 动态创建，只加装饰性样式，不碰 JS 改动的属性） */
  #spellInput { border-radius:var(--radius-md,16px) !important; box-shadow:var(--shadow-sm); }
  #spellInput:focus { box-shadow:0 0 0 3px rgba(26,115,232,.15); }
  #spellCheckBtn { border-radius:var(--radius-md,16px) !important; box-shadow:0 4px 14px rgba(227,116,0,.35), inset 0 1px 0 rgba(255,255,255,.25); }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-top: 1px solid #e8eaed;
    display: flex; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .tabbar a {
    flex: 1; text-align: center; text-decoration: none;
    color: #5f6368; font-size: 11px; font-weight:500;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 4px 0;
  }
  .tabbar a .ticon { font-size: 22px; }
  .tabbar a.active { color: #1a73e8; font-weight: 700; }
  body { padding-bottom: 150px; }
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
</head>
<body>
<div id="topbar">
  <button class="back" onclick="location.href='/'">← 课程</button>
  <b>我的生词本</b>
  <span class="count" id="count"></span>
</div>
<div id="wrap"><div id="list"></div></div>
<div id="reviewBar"><button id="btnReview">📖 开始复习</button><button id="btnSpell">✏️ 拼写模式</button><button id="btnMatch" style="background:#7b1fa2;color:#fff;">🎮 消消乐</button></div>

<div id="revOverlay">
  <div id="revCard">
    <div id="revProg"></div>
    <div class="rw" id="revWord"></div>
    <div class="rp" id="revPh"></div>
    <div class="rsen" id="revSen" style="display:none"></div>
    <div class="rz hidden" id="revZh">点"看意思"显示</div>
    <button id="revFlip">看意思</button>
    <div class="rrow" id="revBtns" style="display:none">
      <button id="revNo">还不认识</button>
      <button id="revYes">认识了</button>
    </div>
    <div id="revDone">
      <div style="font-size:20px;margin:10px 0">复习完啦</div>
      <button id="revClose" style="padding:12px 32px;font-size:16px;border-radius:12px;border:0;background:var(--blue);color:#fff;cursor:pointer">回去</button>
    </div>
  </div>
</div>

<script>
function getVocab() {
  try { return JSON.parse(localStorage.getItem('xh_vocab_v1') || '{}'); } catch (e) { return {}; }
}
function saveVocab(v) {
  try { localStorage.setItem('xh_vocab_v1', JSON.stringify(v)); } catch (e) {}
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function speak(w) {
  try {
    const u = new SpeechSynthesisUtterance(w);
    u.lang = 'en-US'; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
// 轻提示（2026-10-12）：按钮点了要有反馈，不能静默无反应
let _toastTimer = null;
function toast(msg) {
  let t = document.getElementById('xhToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'xhToast';
    t.style.cssText = 'position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;z-index:99;max-width:86%;text-align:center;';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2200);
}
function render() {
  const v = getVocab();
  const words = Object.keys(v).sort((a,b) => v[b].added - v[a].added);
  document.getElementById('count').textContent = words.length ? `共 ${words.length} 个` : '';
  const list = document.getElementById('list');
  if (!words.length) {
    list.innerHTML = `<div class="empty">生词本还是空的<br>在课程的阅读材料里<b>点一下</b>不认识的单词<br>就能查意思、听发音、加进来</div>`;
    return;
  }
  list.innerHTML = words.map(w => {
    const e = v[w];
    return `<div class="card"><div class="wrow">
      <div><div class="ww">${esc(w)}</div>
      ${e.ph ? `<div class="wp">/${esc(e.ph)}/</div>` : ''}
      <div class="wz">${esc(e.zh || '')}</div>
      ${e.sent ? `<div class="wsen">原句：${esc(e.sent)}</div>` : ''}</div>
      <div class="ops">
        <button onclick="speak('${esc(w)}')">🔊</button>
        <button onclick="delWord('${esc(w)}')">删除</button>
      </div>
    </div></div>`;
  }).join('');
}
function delWord(w) {
  const v = getVocab(); delete v[w]; saveVocab(v); render();
  try { fetch('/api/vocab/del', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({word:w}) }).catch(()=>{}); } catch(e) {}
}
// ---- 简单复习：不认识的优先 ----
let queue = [], qi = 0;
document.getElementById('btnReview').onclick = () => {
  const v = getVocab();
  const words = Object.keys(v);
  if (!words.length) { toast('生词本还是空的，先去课程里点单词加进来吧'); return; }
  // ok<2 的优先，不认识的多出现
  queue = words.sort((a,b) => (v[a].ok||0) - (v[b].ok||0));
  qi = 0;
  document.getElementById('revOverlay').style.display = 'flex';
  showRev();
};
function showRev() {
  const v = getVocab();
  if (qi >= queue.length) {
    document.getElementById('revProg').textContent = '';
    document.getElementById('revWord').textContent = '';
    document.getElementById('revPh').textContent = '';
    document.getElementById('revSen').style.display = 'none';
    document.getElementById('revZh').style.display = 'none';
    document.getElementById('revFlip').style.display = 'none';
    document.getElementById('revBtns').style.display = 'none';
    document.getElementById('revDone').style.display = 'block';
    return;
  }
  const w = queue[qi], e = v[w] || {};
  document.getElementById('revDone').style.display = 'none';
  document.getElementById('revZh').style.display = '';
  document.getElementById('revFlip').style.display = '';
  document.getElementById('revProg').textContent = `${qi+1} / ${queue.length}`;
  document.getElementById('revWord').textContent = w;
  document.getElementById('revPh').textContent = e.ph ? '/' + e.ph + '/' : '';
  const rsen = document.getElementById('revSen'); // 2026-10-12：复习时看到原句，不是孤词
  if (e.sent) { rsen.textContent = e.sent; rsen.style.display = ''; }
  else rsen.style.display = 'none';
  const zh = document.getElementById('revZh');
  zh.textContent = '点"看意思"显示'; zh.classList.add('hidden');
  document.getElementById('revBtns').style.display = 'none';
  document.getElementById('revFlip').style.display = '';
  speak(w);
}
document.getElementById('revFlip').onclick = () => {
  const v = getVocab(), w = queue[qi], e = v[w] || {};
  const zh = document.getElementById('revZh');
  zh.textContent = e.zh || '（暂无中文意思）'; zh.classList.remove('hidden');
  document.getElementById('revFlip').style.display = 'none';
  document.getElementById('revBtns').style.display = 'flex';
};
// 掌握度同步（2026-10-22）：生词本的复习/拼写结果也写进后端5级掌握度，
// 与 words.html 的 addMastery 同口径：认识/拼对=答对升1级，还不认识/拼错=答错降1级；只做增量写，不动本地逻辑
function syncMastery(word, ok) {
  try {
    fetch('/api/words/mastery', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ word: word, correct: !!ok })
    }).then(r => r.json()).then(d => {
      if (!d.ok && window.__reportError) window.__reportError('vocab mastery sync failed: ok=false word=' + word, location.href, 0, 0, '');
    }).catch(e => { if (window.__reportError) window.__reportError('vocab mastery sync failed: ' + (e && e.message), location.href, 0, 0, ''); });
  } catch (e) { if (window.__reportError) window.__reportError('vocab mastery sync failed: ' + (e && e.message), location.href, 0, 0, ''); }
}
function revMark(known) {
  const v = getVocab(), w = queue[qi];
  if (v[w]) { v[w].reviews = (v[w].reviews||0)+1; if (known) v[w].ok = (v[w].ok||0)+1; else v[w].ok = 0; saveVocab(v); }
  syncMastery(w, known);
  qi++; showRev();
}
document.getElementById('revNo').onclick = () => revMark(false);
document.getElementById('revYes').onclick = () => revMark(true);
document.getElementById('revClose').onclick = () => {
  document.getElementById('revOverlay').style.display = 'none'; render();
};
// ---- 拼写模式（2026-10-12加）：听音/看中文，打英文 ----
// 站长剧情：这是"广播站拼写大赛"，站长报中文，你打出英文
let spellQueue = [], spellQi = 0, spellScore = 0;
document.getElementById('btnSpell').onclick = () => {
  const v = getVocab();
  const words = Object.keys(v);
  if (!words.length) { toast('生词本还是空的，先去课程里点单词加进来吧'); return; }
  spellQueue = words.sort(() => Math.random() - 0.5); // 随机顺序
  spellQi = 0; spellScore = 0;
  showSpell();
  document.getElementById('revOverlay').style.display = 'flex';
};
function showSpell() {
  const v = getVocab();
  // 隐藏复习卡片元素，显示拼写界面
  document.getElementById('revProg').textContent = '';
  document.getElementById('revWord').textContent = '';
  document.getElementById('revPh').textContent = '';
  document.getElementById('revSen').style.display = 'none'; // 拼写时不给原句，会剧透单词
  document.getElementById('revZh').style.display = 'none';
  document.getElementById('revFlip').style.display = 'none';
  document.getElementById('revBtns').style.display = 'none';
  document.getElementById('revDone').style.display = 'none';

  if (spellQi >= spellQueue.length) {
    // 完成
    document.getElementById('revProg').textContent = `完成！`;
    document.getElementById('revWord').textContent = `✅ ${spellScore} / ${spellQueue.length}`;
    document.getElementById('revWord').style.fontSize = '28px';
    const done = document.getElementById('revDone');
    done.style.display = 'block';
    done.innerHTML = `拼写得分：${spellScore}/${spellQueue.length}<br><button onclick="document.getElementById('revOverlay').style.display='none'" style="margin-top:12px;padding:10px 24px;border-radius:10px;border:0;background:var(--blue);color:#fff;font-size:16px;">好的</button>`;
    return;
  }
  const w = spellQueue[spellQi], e = v[w] || {};
  document.getElementById('revProg').textContent = `拼写 ${spellQi+1} / ${spellQueue.length} · 得分 ${spellScore}`;
  document.getElementById('revWord').textContent = '🔊 听发音';
  document.getElementById('revWord').style.fontSize = '24px';
  document.getElementById('revWord').onclick = () => speak(w);
  document.getElementById('revPh').textContent = e.zh || '';
  // 输入框
  let input = document.getElementById('spellInput');
  if (!input) {
    input = document.createElement('input');
    input.id = 'spellInput';
    input.placeholder = '听发音，打出英文单词';
    input.autocomplete = 'off';
    input.style.cssText = 'width:100%;padding:14px;font-size:20px;border:2px solid var(--line);border-radius:12px;margin:16px 0;text-align:center;';
    document.getElementById('revCard').insertBefore(input, document.getElementById('revFlip'));
  }
  input.value = ''; input.style.display = '';
  input.onkeydown = (ev) => { if (ev.key === 'Enter') checkSpell(); };

  let btn = document.getElementById('spellCheckBtn');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'spellCheckBtn';
    btn.textContent = '提交';
    btn.style.cssText = 'width:100%;padding:14px;font-size:17px;border-radius:12px;border:0;background:#e37400;color:#fff;cursor:pointer;margin-top:8px;';
    btn.onclick = checkSpell;
    document.getElementById('revCard').insertBefore(btn, document.getElementById('revFlip'));
  }
  btn.style.display = '';
  speak(w); // 自动播发音
  setTimeout(() => input.focus(), 300);
}
function checkSpell() {
  const v = getVocab();
  const w = spellQueue[spellQi];
  const input = document.getElementById('spellInput');
  const given = (input.value || '').trim().toLowerCase();
  const correct = given === w.toLowerCase();
  if (correct) {
    spellScore++;
    if (v[w]) { v[w].spell_ok = (v[w].spell_ok || 0) + 1; saveVocab(v); }
    input.style.borderColor = '#137333';
    input.style.background = '#e6f4ea';
  } else {
    if (v[w]) { v[w].spell_ok = 0; saveVocab(v); }
    input.style.borderColor = '#c5221f';
    input.style.background = '#fce8e6';
    // 显示正确答案
    setTimeout(() => {
      input.value = w;
      input.style.borderColor = 'var(--line)';
      input.style.background = '#fff8e1';
    }, 800);
  }
  syncMastery(w, correct); // 拼写结果同步后端掌握度（与 words.html 同口径：拼对升1级、拼错降1级）
  setTimeout(() => {
    input.style.display = 'none';
    document.getElementById('spellCheckBtn').style.display = 'none';
    document.getElementById('revWord').onclick = null;
    document.getElementById('revWord').style.fontSize = '';
    spellQi++;
    showSpell();
  }, correct ? 600 : 1800);
}
// ---- 单词消消乐（2026-10-12加）：英文配中文，连连看 ----
// 站长剧情：这是"广播站连连看"，把英文和中文配成对消掉
let matchFirst = null, matchDone = 0, matchTotal = 0;
document.getElementById('btnMatch').onclick = () => {
  const v = getVocab();
  let words = Object.keys(v).filter(w => v[w].zh);
  if (words.length < 2) { prettyAlert('生词太少，先去课程里加点词吧', '📖'); return; }
  words = words.sort(() => Math.random() - 0.5).slice(0, 6);
  matchTotal = words.length; matchDone = 0; matchFirst = null;
  const cards = [];
  words.forEach(w => {
    cards.push({ word: w, text: w, type: 'en' });
    cards.push({ word: w, text: v[w].zh, type: 'zh' });
  });
  cards.sort(() => Math.random() - 0.5);
  document.getElementById('revProg').textContent = `🎮 消消乐：配对 ${matchDone}/${matchTotal}`;
  document.getElementById('revWord').textContent = '';
  document.getElementById('revPh').textContent = '';
  document.getElementById('revZh').style.display = 'none';
  document.getElementById('revFlip').style.display = 'none';
  document.getElementById('revBtns').style.display = 'none';
  document.getElementById('revDone').style.display = 'none';
  const si = document.getElementById('spellInput'); if (si) si.style.display = 'none';
  const sb = document.getElementById('spellCheckBtn'); if (sb) sb.style.display = 'none';
  let grid = document.getElementById('matchGrid');
  if (!grid) {
    grid = document.createElement('div');
    grid.id = 'matchGrid';
    grid.className = 'match-grid';
    document.getElementById('revCard').insertBefore(grid, document.getElementById('revFlip'));
  }
  grid.style.display = 'grid';
  grid.innerHTML = cards.map((c, i) =>
    `<div class="match-card${c.type === 'zh' ? ' zh' : ''}" data-word="${c.word.replace(/"/g,'&quot;')}" data-idx="${i}">${esc(c.text)}</div>`
  ).join('');
  grid.querySelectorAll('.match-card').forEach(card => {
    card.onclick = () => matchClick(card);
  });
  document.getElementById('revOverlay').style.display = 'flex';
};
function matchClick(card) {
  if (card.classList.contains('matched') || card.classList.contains('selected')) return;
  card.classList.add('selected');
  try { speak(card.dataset.word); } catch(e) {}
  if (!matchFirst) { matchFirst = card; return; }
  if (matchFirst.dataset.word === card.dataset.word && matchFirst !== card) {
    const f = matchFirst; matchFirst = null;
    setTimeout(() => {
      f.classList.add('matched'); card.classList.add('matched');
      f.classList.remove('selected'); card.classList.remove('selected');
      matchDone++;
      document.getElementById('revProg').textContent = `🎮 消消乐：配对 ${matchDone}/${matchTotal}`;
      if (matchDone >= matchTotal) {
        setTimeout(() => {
          document.getElementById('matchGrid').style.display = 'none';
          document.getElementById('revProg').textContent = '🎉 全部配对成功！';
          document.getElementById('revWord').textContent = `✅ ${matchTotal}组全对`;
          const done = document.getElementById('revDone');
          done.style.display = 'block';
          done.innerHTML = `太棒了！${matchTotal}组单词全部配对<br><button onclick="document.getElementById('revOverlay').style.display='none'" style="margin-top:12px;padding:10px 24px;border-radius:10px;border:0;background:#7b1fa2;color:#fff;font-size:16px;">再来一局</button>`;
        }, 400);
      }
    }, 300);
  } else {
    const f = matchFirst; matchFirst = null;
    setTimeout(() => {
      f.classList.add('wrong'); card.classList.add('wrong');
      setTimeout(() => {
        f.classList.remove('selected','wrong'); card.classList.remove('selected','wrong');
      }, 500);
    }, 200);
  }
}
render();
</script>
