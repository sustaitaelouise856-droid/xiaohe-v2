<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="/client-error.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小禾英语 · 我的进步</title>
<style>
  :root {
    --blue:#1a73e8; --green:#1e8e3e; --orange:#e8710a;
    --ink:#202124; --muted:#5f6368; --line:#e3e7ee; --bg:#f0f4fa;
    --grad-blue: linear-gradient(135deg, #1a73e8 0%, #4a8ef7 100%);
    --grad-orange: linear-gradient(135deg, #e8710a 0%, #f7a04a 100%);
    --grad-green: linear-gradient(135deg, #1e8e3e 0%, #34a853 100%);
    --soft: #f6f9fd;
  }
  * { box-sizing:border-box; }
  body { font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:22px; line-height:1.7; margin:0; -webkit-font-smoothing:antialiased; }
  #topbar { background:rgba(255,255,255,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:14px 22px; font-weight:800; font-size:25px; letter-spacing:1px; box-shadow:var(--shadow-sm); position:sticky; top:0; z-index:20; }
  #wrap { max-width:900px; margin:0 auto; padding:26px 20px 84px; }
  .card { background:#fff; border:1px solid rgba(227,231,238,.7); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:26px; margin-bottom:22px; }
  h2 { font-size:26px; margin:0 0 10px; font-weight:800; letter-spacing:.5px; }
  .subtitle { color:var(--muted); font-size:19px; margin-bottom:16px; line-height:1.6; }
  .kp { display:flex; align-items:center; gap:14px; padding:13px 14px; margin:0 -14px; border-bottom:1px solid var(--line); border-radius:var(--radius-sm); transition:background .18s ease; }
  .kp:last-child { border-bottom:0; }
  .kp:hover { background:var(--soft); }
  .badge { font-size:17px; font-weight:700; padding:6px 16px; border-radius:999px; color:#fff; white-space:nowrap; box-shadow:0 2px 8px rgba(60,64,67,.18); letter-spacing:1px; }
  .badge.没学 { background:linear-gradient(135deg,#9aa0a6,#bdc1c6); }
  .badge.学过 { background:var(--grad-orange); }
  .badge.会了 { background:var(--grad-blue); }
  .badge.牢固 { background:var(--grad-green); }
  .kp-name { flex:1; font-weight:600; }
  /* 学习趋势（从成长页移过来） */
  .stat-row { display:flex; gap:14px; margin-top:10px; }
  .stat { flex:1; text-align:center; background:linear-gradient(180deg,#ffffff 0%,var(--soft) 100%); border:1px solid rgba(227,231,238,.8); border-radius:var(--radius-md); box-shadow:var(--shadow-sm); padding:18px 6px 14px; position:relative; overflow:hidden; }
  .stat::before { content:""; position:absolute; top:0; left:0; right:0; height:4px; background:var(--grad-blue); }
  .stat b { display:block; font-size:36px; font-weight:800; color:var(--blue); line-height:1.25; }
  .stat span { font-size:17px; color:var(--muted); letter-spacing:1px; }
  #trendChart { background:var(--soft); border-radius:var(--radius-sm); padding:6px; }
  .legend { display:flex; gap:14px; justify-content:center; font-size:17px; color:var(--muted); margin-top:12px; }
  .legend span { background:#fff; border:1px solid var(--line); border-radius:999px; padding:5px 16px; box-shadow:var(--shadow-sm); display:inline-flex; align-items:center; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:8px; box-shadow:0 1px 4px rgba(60,64,67,.3); }
  /* 弱点清单 */
  .wrow { display:flex; align-items:center; gap:12px; padding:13px 16px; margin:8px 0; background:var(--soft); border:1px solid rgba(227,231,238,.7); border-radius:var(--radius-sm); font-size:21px; box-shadow:var(--shadow-sm); }
  .wtag { font-weight:700; flex:1; }
  .wcount { background:var(--grad-orange); color:#fff; border-radius:999px; padding:4px 16px; font-size:18px; font-weight:700; box-shadow:0 2px 8px rgba(232,113,10,.35); white-space:nowrap; }
  .wlast { color:var(--muted); font-size:17px; }
  /* 真人老师风格错题本 */
  .focus-item { background:linear-gradient(90deg,#fff8e1,#fffdf5); border-left:5px solid var(--orange); border-radius:0 var(--radius-md) var(--radius-md) 0; padding:15px 20px; margin:12px 0; box-shadow:var(--shadow-sm); }
  .focus-item .t { font-weight:800; font-size:23px; }
  .focus-item .enc { color:#9a6200; font-size:20px; margin-top:4px; }
  .done-item { background:linear-gradient(90deg,#e8f5e9,#f4faf5); border-left:5px solid var(--green); border-radius:0 var(--radius-md) var(--radius-md) 0; padding:15px 20px; margin:12px 0; box-shadow:var(--shadow-sm); }
  .done-item .t { font-weight:800; font-size:23px; }
  .done-item .enc { color:#1b5e20; font-size:20px; margin-top:4px; }
  .fold { margin-top:16px; }
  .fold summary { cursor:pointer; color:var(--blue); font-size:20px; font-weight:700; padding:10px 4px; list-style:none; }
  .fold summary::before { content:"▸ "; }
  .fold details[open] summary::before { content:"▾ "; }
  .fold-item { padding:10px 0 10px 22px; color:var(--muted); font-size:20px; border-bottom:1px solid var(--line); }
  /* 错题卡片（JS 模板生成，类名样式增强点击感） */
  .mistake-item { background:linear-gradient(180deg,#ffffff 0%,var(--soft) 100%) !important; box-shadow:var(--shadow-sm) !important; border-radius:var(--radius-md) !important; transition:transform .15s ease, box-shadow .2s ease !important; }
  .mistake-item:hover { box-shadow:var(--shadow-md) !important; }
  .mistake-item:active { transform:scale(.985); box-shadow:var(--shadow-sm) !important; }
  /* 错题详情弹窗（JS 内联样式，用 !important 优雅化） */
  #mistakeOv { backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); animation:ovFade .22s ease; }
  #mistakeOv > div { box-shadow:var(--shadow-lg) !important; border-radius:var(--radius-xl) !important; border:1px solid rgba(227,231,238,.6) !important; animation:popIn .28s cubic-bezier(.2,1.2,.4,1); }
  #mistakeOv h3 { font-size:24px !important; font-weight:800 !important; margin-bottom:16px !important; }
  #mistakeOv button { background:var(--grad-blue) !important; box-shadow:0 4px 14px rgba(26,115,232,.35) !important; font-weight:700 !important; border-radius:var(--radius-md) !important; transition:transform .15s ease !important; }
  #mistakeOv button:active { transform:scale(.97); }
  @keyframes ovFade { from { opacity:0; } to { opacity:1; } }
  @keyframes popIn { from { opacity:0; transform:scale(.92) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
  .empty { color:var(--muted); text-align:center; padding:28px 20px; font-size:19px; }
  .tabs { display:flex; gap:10px; margin-bottom:22px; background:#fff; border:1px solid rgba(227,231,238,.7); border-radius:999px; padding:6px; box-shadow:var(--shadow-sm); }
  .tab { flex:1; font-size:20px; font-weight:600; padding:12px 10px; border-radius:999px; border:0; background:transparent; color:var(--muted); cursor:pointer; transition:all .22s ease; }
  .tab.active { background:var(--grad-blue); color:#fff; font-weight:800; box-shadow:0 4px 14px rgba(26,115,232,.35); }
  .tab:not(.active):active { background:var(--soft); }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-top: 1px solid #e8eaed;
    display: flex; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .tabbar a {
    flex: 1; text-align: center; text-decoration: none;
    color: #5f6368; font-size: 11px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .tabbar a .ticon { font-size: 22px; }
  .tabbar a.active { color: #1a73e8; font-weight: 700; }
  body { padding-bottom: 76px; }
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
</head>
<body>
<div id="topbar">学习报告</div>
<div id="wrap">
  <div class="tabs">
    <button class="tab active" onclick="showTab('mistakes')">错题本</button>
    <button class="tab" onclick="showTab('trend')">学习趋势</button>
  </div>
  <div id="tab-trend" style="display:none">
    <div class="card">
      <h2>📈 最近7天学习趋势</h2>
      <canvas id="trendChart" style="width:100%;height:220px;"></canvas>
      <div class="legend">
        <span><span class="dot" style="background:#1a73e8"></span>做题数</span>
        <span><span class="dot" style="background:#1e8e3e"></span>正确率%</span>
      </div>
    </div>
    <div class="card">
      <h2>📊 本周小结</h2>
      <div class="stat-row" id="weeklyRow"><div class="empty">正在加载…</div></div>
    </div>
    <div class="card">
      <h2>🎯 弱点清单</h2>
      <div id="weakList"><div class="empty">正在加载…</div></div>
    </div>
  </div>
  <div id="tab-mistakes">
    <div class="card">
      <h2>我做错过的题</h2>
      <div class="subtitle">这几个知识点正在练习中，换一道同类型的题独立做对，就真正拿下了。</div>
      <!-- 2026-10-18 史诗级加强：统计+筛选+优先级 -->
      <div id="mistakeStats" style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;"></div>
      <div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <select id="kpFilter" onchange="filterByKp()" style="padding:10px 16px;border:2px solid #e3e7ee;border-radius:10px;font-size:14px;background:#fff;cursor:pointer;">
          <option value="">全部知识点</option>
        </select>
        <select id="sortBy" onchange="renderMistakeList()" style="padding:10px 16px;border:2px solid #e3e7ee;border-radius:10px;font-size:14px;background:#fff;cursor:pointer;">
          <option value="wrong">错得最多优先</option>
          <option value="recent">最近错的优先</option>
          <option value="oldest">最早错的优先</option>
        </select>
        <button id="btnSelectMode" onclick="toggleSelectMode()" style="padding:10px 20px;border:2px solid #1a73e8;border-radius:10px;background:#fff;color:#1a73e8;font-size:14px;font-weight:700;cursor:pointer;">☑️ 选择错题</button>
        <button id="btnBatchStart" onclick="startBatchRetry()" style="display:none;padding:10px 20px;border:0;border-radius:10px;background:linear-gradient(135deg,#ff8f00,#ff6f00);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-left:8px;">开始做 (<span id="selCount">0</span>)</button>
      </div>
      <div id="focus-list"><div class="empty">加载中…</div></div>
    </div>
    <div class="card">
      <h2>最近拿下</h2>
      <div class="subtitle">这些是你最近真正掌握的，继续保持。</div>
      <div id="done-list"><div class="empty">还没有，做了练习后会显示在这里。</div></div>
    </div>
    <div class="card fold">
      <details>
        <summary id="fold-summary">查看全部（已折叠）</summary>
        <div id="fold-list"></div>
      </details>
    </div>
  </div>
</div>
<script>
// 知识点中文名映射（不出现内部编号）
const KP_NAMES = {
  'vocab-l1':'基础单词','vocab-l2':'常用单词','vocab-l3':'进阶单词',
  'phonics-1':'拼读（一）','phonics-2':'拼读（二）',
  'grammar-3sg':'三单形式','grammar-therebe':'there be 句型',
  'grammar-since':'since 引导的时间','grammar-for':'for 引导的时间段',
  'reading-l1':'阅读理解（一）','reading-l2':'阅读理解（二）',
  'reading-l3':'阅读理解（三）','reading-l4':'阅读理解（四）',
  'listening-1':'听力（一）','listening-2':'听力（二）',
  'writing-1':'写句子（一）','writing-2':'写句子（二）',
  'readaloud-1':'朗读',
};
function kpName(kp) { return KP_NAMES[kp] || '英语练习'; }
function esc(t) { return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function api(p) { const r = await fetch(p); return r.json(); }

async function loadMistakes() {
  const focusEl = document.getElementById('focus-list');
  const doneEl = document.getElementById('done-list');
  // 用新的错题本API
  try {
    const d = await (await fetch('/api/mistakes')).json();
    if (!d.ok || !d.mistakes.length) {
      focusEl.innerHTML = '<div class="empty">太棒了，一道错题都没有！</div>';
      return;
    }
    window._mistakes = d.mistakes;
    window._selectMode = false;
    window._selected = new Set();
    updateMistakeStats();
    renderMistakeList();
    // 最近拿下（2026-10-14）：已解决的错题
    const resolved = d.resolved || [];
    if (resolved.length) {
      doneEl.innerHTML = resolved.map(m =>
        `<div style="border:1px solid #c8e6c9;border-radius:12px;padding:14px;margin-bottom:10px;background:#f1f8e9;">`
        + `<div style="font-weight:600;margin-bottom:6px;color:#212121;">✅ ${escHtml((m.question || '（题干）').slice(0, 60))}...</div>`
        + `<div style="font-size:14px;color:#666;">正确答案：${escHtml((m.correct || '').slice(0, 60))}</div>`
        + `<div style="font-size:13px;color:#999;margin-top:4px;">${escHtml(m.resolved_at || '').slice(0, 16)} 攻克${m.knowledge_point ? ' · ' + escHtml(m.knowledge_point) : ''}</div>`
        + `</div>`
      ).join('');
    } else {
      doneEl.innerHTML = '<div class="empty">还没有，做了练习后会显示在这里。</div>';
    }
  } catch (e) {
    focusEl.innerHTML = '<div class="empty">加载失败</div>';
  }
}
function showMistake(i) {
  const m = (window._mistakes || [])[i];
  if (!m) return;
  const old = document.getElementById('mistakeOv');
  if (old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'mistakeOv';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px;';
  ov.innerHTML = '<div style="background:#fff;border-radius:16px;padding:24px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;">'
    + '<h3 style="margin:0 0 12px;">📝 错题详情</h3>'
    + '<div style="margin-bottom:12px;"><b>题目：</b><br>' + escHtml(m.question || '（无）') + '</div>'
    + '<div style="margin-bottom:12px;"><b>你的答案：</b><br><span style="color:#c5221f;">' + escHtml(m.given || '（空）') + '</span></div>'
    // 2026-10-15 Elouise：详情页不直接显示正确答案，防止学生复制后重做作弊
    // 想知道正确答案：重做这道题，做对后自然知道；或重做时点"老师教我"（计为求助）
    + '<div style="margin-bottom:12px;padding:10px;background:#fff8e1;border-radius:8px;font-size:13px;color:#7a5c00;">💡 正确答案先不告诉你——点下面"重做这道题"，自己做对一次就记住了。</div>'
    + '<div style="color:#999;font-size:13px;margin-bottom:16px;">' + escHtml(m.created_at || '') + ' · ' + escHtml(m.lesson_id || '') + '</div>'
    + (m.item_id && m.lesson_id ? '<button onclick="location.href=\'/lesson?lesson=' + encodeURIComponent(m.lesson_id) + '&retry_item=' + encodeURIComponent(m.item_id) + '\'" style="width:100%;padding:12px;border-radius:12px;border:0;background:#ff8f00;color:#fff;font-size:16px;font-weight:700;margin-bottom:8px;">🔁 重做这道题</button>' : '')
    + '<button onclick="document.getElementById(\'mistakeOv\').remove()" style="width:100%;padding:12px;border-radius:12px;border:0;background:#1a73e8;color:#fff;font-size:16px;">知道了</button>'
    + '</div>';
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
}

// 2026-10-18 史诗级加强：统计+筛选+排序
function updateMistakeStats() {
  const mistakes = window._mistakes || [];
  const statsEl = document.getElementById('mistakeStats');
  if (!statsEl) return;
  // 按知识点统计
  const kpCount = {};
  mistakes.forEach(m => {
    const kp = m.knowledge_point || '其他';
    kpCount[kp] = (kpCount[kp] || 0) + 1;
  });
  const total = mistakes.length;
  const topKp = Object.entries(kpCount).sort((a,b) => b[1]-a[1]).slice(0, 3);
  statsEl.innerHTML = `<div style="background:#e8f0fe;border-radius:10px;padding:8px 16px;font-size:14px;font-weight:700;color:#1a73e8;">📝 共 ${total} 道</div>`
    + topKp.map(([kp, c]) => `<div style="background:#fff3e0;border-radius:10px;padding:8px 16px;font-size:14px;color:#e65100;">${escHtml(kpName(kp))} ×${c}</div>`).join('');
  // 更新筛选下拉
  const filter = document.getElementById('kpFilter');
  if (filter && filter.options.length <= 1) {
    Object.keys(kpCount).sort().forEach(kp => {
      const opt = document.createElement('option');
      opt.value = kp;
      opt.textContent = `${kpName(kp)} (${kpCount[kp]})`;
      filter.appendChild(opt);
    });
  }
}
function filterByKp() { renderMistakeList(); }

// 2026-10-15 Elouise：错题多选一起做
function renderMistakeList() {
  const focusEl = document.getElementById('focus-list');
  let mistakes = window._mistakes || [];
  const selectMode = window._selectMode || false;
  if (!mistakes.length) {
    focusEl.innerHTML = '<div class="empty">太棒了，一道错题都没有！</div>';
    return;
  }
  // 筛选
  const kpFilter = document.getElementById('kpFilter');
  const filterKp = kpFilter ? kpFilter.value : '';
  if (filterKp) {
    mistakes = mistakes.filter(m => (m.knowledge_point || '其他') === filterKp);
  }
  // 排序
  const sortBy = document.getElementById('sortBy') ? document.getElementById('sortBy').value : 'wrong';
  const sorted = [...mistakes].sort((a, b) => {
    if (sortBy === 'wrong') return (b.wrong_count || 1) - (a.wrong_count || 1);
    if (sortBy === 'recent') return new Date(b.created_at) - new Date(a.created_at);
    if (sortBy === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
    return 0;
  });
  // 建立原索引映射（用于选择和详情）
  const origIndex = new Map(sorted.map(m => [m.item_id, window._mistakes.indexOf(m)]));
  focusEl.innerHTML = sorted.map((m) => {
    const i = origIndex.get(m.item_id);
    const checked = (window._selected || new Set()).has(i) ? 'checked' : '';
    const checkbox = selectMode
      ? `<input type="checkbox" ${checked} onclick="event.stopPropagation();toggleSelect(${i})" style="width:22px;height:22px;margin-right:10px;flex-shrink:0;cursor:pointer;">`
      : '';
    const clickAction = selectMode ? `toggleSelect(${i})` : `showMistake(${i})`;
    const hint = selectMode ? '' : ' · 点击查看详情';
    // 错次徽章：错3次+红色，2次橙色，1次灰色
    const wc = m.wrong_count || 1;
    const wcBadge = wc >= 3
      ? `<span style="background:#c5221f;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:8px;">错${wc}次 🔥</span>`
      : wc === 2
      ? `<span style="background:#e8710a;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:8px;">错2次</span>`
      : '';
    const kpTag = m.knowledge_point ? `<span style="background:#f3e5f5;color:#6a1b9a;border-radius:6px;padding:2px 8px;font-size:12px;margin-left:8px;">${escHtml(kpName(m.knowledge_point))}</span>` : '';
    return `<div class="mistake-item" onclick="${clickAction}" style="display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;${checked ? 'background:#e8f0fe;border-color:#1a73e8;' : ''}${wc >= 3 ? 'border-left:4px solid #c5221f;' : ''}">`
      + checkbox
      + `<div style="flex:1;">`
      + `<div style="font-weight:600;margin-bottom:6px;color:#212121;">${escHtml((m.question || '（题干）').slice(0, 60))}...${wcBadge}${kpTag}</div>`
      + `<div style="font-size:16px;color:#666;">你的答案：<span style="color:#c5221f;">${escHtml((m.given || '（空）').slice(0, 40))}</span></div>`
      + `<div style="font-size:14px;color:#999;margin-top:4px;">${escHtml(m.created_at || '').slice(0, 16)}${hint}</div>`
      + `</div></div>`;
  }).join('') || '<div class="empty">该知识点下没有错题</div>';
}

function toggleSelectMode() {
  window._selectMode = !window._selectMode;
  window._selected = new Set();
  const btn = document.getElementById('btnSelectMode');
  const batchBtn = document.getElementById('btnBatchStart');
  if (window._selectMode) {
    btn.textContent = '❌ 取消选择';
    batchBtn.style.display = 'inline-block';
  } else {
    btn.textContent = '☑️ 选择错题';
    batchBtn.style.display = 'none';
  }
  updateSelCount();
  renderMistakeList();
}

function toggleSelect(i) {
  if (!window._selected) window._selected = new Set();
  if (window._selected.has(i)) window._selected.delete(i);
  else window._selected.add(i);
  updateSelCount();
  renderMistakeList();
}

function updateSelCount() {
  const el = document.getElementById('selCount');
  if (el) el.textContent = (window._selected || new Set()).size;
}

function startBatchRetry() {
  const mistakes = window._mistakes || [];
  const selected = [...(window._selected || new Set())].sort((a, b) => a - b);
  if (!selected.length) { alert('请先选择要做的错题'); return; }
  const itemIds = selected.map(i => mistakes[i] && mistakes[i].item_id).filter(Boolean);
  if (!itemIds.length) { alert('所选题没有有效的题目ID'); return; }
  location.href = '/lesson?lesson=batch-retry&items=' + encodeURIComponent(itemIds.join(','));
}

function showTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-mistakes').style.display = t === 'mistakes' ? '' : 'none';
  document.getElementById('tab-trend').style.display = t === 'trend' ? '' : 'none';
  if (t === 'mistakes') loadMistakes();
  if (t === 'trend') loadTrend();
}
// 学习趋势（从成长页移过来）
let _trendLoaded = false;
async function loadTrend() {
  if (_trendLoaded) return;
  _trendLoaded = true;
  try {
    const g = await (await fetch('/api/growth')).json();
    if (!g.ok) throw new Error('load failed');
    // 趋势图
    drawTrendChart(g.trend || []);
    // 本周小结
    const w = g.weekly || {};
    document.getElementById('weeklyRow').innerHTML =
      statHtml(w.minutes, '分钟') + statHtml(w.attempts, '做题') +
      statHtml(w.lessons, '完成课程') + statHtml(w.avg_rate == null ? '–' : w.avg_rate + '%', '正确率');
    // 弱点清单
    const wl = g.weakness_list || [];
    document.getElementById('weakList').innerHTML = wl.length
      ? wl.map(x => '<div class="wrow"><span class="wtag">' + escHtml(x.tag) + '</span><span class="wcount">' + x.count + '次</span><span class="wlast">' + escHtml(x.last || '') + '</span></div>').join('')
      : '<div class="empty">还没发现明显弱点，继续保持！</div>';
  } catch (e) {
    document.getElementById('weeklyRow').innerHTML = '<div class="empty">加载失败</div>';
  }
}
function statHtml(v, label) {
  return '<div class="stat"><b>' + v + '</b><span>' + label + '</span></div>';
}
function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function drawTrendChart(trend) {
  const cv = document.getElementById('trendChart');
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 300, H = 220;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  if (!trend.length) {
    ctx.fillStyle = '#999'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('暂无数据', W/2, H/2);
    return;
  }
  const maxN = Math.max(...trend.map(t => t.attempts || 0), 1);
  const pad = 30;
  const X = i => pad + i * (W - pad*2) / Math.max(trend.length - 1, 1);
  const Y1 = n => H - pad - (n / maxN) * (H - pad*2);
  const Y2 = r => H - pad - (r / 100) * (H - pad*2);
  // 做题数（蓝线）
  ctx.strokeStyle = '#1a73e8'; ctx.lineWidth = 2; ctx.beginPath();
  trend.forEach((t, i) => { const x = X(i), y = Y1(t.attempts || 0); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  // 正确率（绿线）
  ctx.strokeStyle = '#1e8e3e'; ctx.beginPath();
  trend.forEach((t, i) => { if (t.rate == null) return; const x = X(i), y = Y2(t.rate); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  ctx.fillStyle = '#1a73e8';
  trend.forEach((t, i) => {
    ctx.beginPath(); ctx.arc(X(i), Y1(t.attempts || 0), 4, 0, 7); ctx.fill();
  });
  ctx.fillStyle = '#1e8e3e';
  trend.forEach((t, i) => {
    if (t.rate == null) return;
    ctx.beginPath(); ctx.arc(X(i), Y2(t.rate), 4, 0, 7); ctx.fill();
  });
}

try { loadMistakes(); } catch (e) { if (window.__reportInitFailure) window.__reportInitFailure(e.message || String(e)); }
</script>
