<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="/client-error.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小禾英语 · 我的进步</title>
<style>
  :root { --blue:#1a73e8; --green:#1e8e3e; --orange:#e8710a; --ink:#202124; --muted:#5f6368; --line:#dadce0; --bg:#f8f9fa; }
  * { box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); font-size:22px; line-height:1.7; margin:0; }
  #topbar { background:#fff; border-bottom:1px solid var(--line); padding:12px 20px; font-weight:700; font-size:24px; }
  #wrap { max-width:900px; margin:0 auto; padding:24px 20px 80px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px; margin-bottom:20px; }
  h2 { font-size:26px; margin:0 0 8px; }
  .subtitle { color:var(--muted); font-size:20px; margin-bottom:16px; }
  .kp { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .kp:last-child { border-bottom:0; }
  .badge { font-size:18px; padding:4px 14px; border-radius:20px; color:#fff; white-space:nowrap; }
  .badge.没学 { background:#9aa0a6; } .badge.学过 { background:var(--orange); }
  /* 学习趋势（从成长页移过来） */
  .stat-row { display:flex; gap:12px; margin-top:8px; }
  .stat { flex:1; text-align:center; background:#f1f3f4; border-radius:12px; padding:14px 6px; }
  .stat b { display:block; font-size:32px; color:var(--blue); }
  .stat span { font-size:18px; color:var(--muted); }
  .wrow { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); font-size:21px; }
  .wrow:last-child { border-bottom:0; }
  .wtag { font-weight:700; flex:1; }
  .wcount { background:var(--orange); color:#fff; border-radius:12px; padding:2px 14px; font-size:19px; }
  .wlast { color:var(--muted); font-size:18px; }
  .legend { display:flex; gap:20px; justify-content:center; font-size:18px; color:var(--muted); margin-top:8px; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; }
  .badge.会了 { background:var(--blue); } .badge.牢固 { background:var(--green); }
  .kp-name { flex:1; }
  /* 真人老师风格错题本 */
  .focus-item { background:#fff8e1; border-left:4px solid var(--orange); border-radius:0 12px 12px 0; padding:14px 18px; margin:12px 0; }
  .focus-item .t { font-weight:700; font-size:23px; }
  .focus-item .enc { color:#7a4d00; font-size:20px; margin-top:4px; }
  .done-item { background:#e8f5e9; border-left:4px solid var(--green); border-radius:0 12px 12px 0; padding:14px 18px; margin:12px 0; }
  .done-item .t { font-weight:700; font-size:23px; }
  .done-item .enc { color:#1b5e20; font-size:20px; margin-top:4px; }
  .fold { margin-top:16px; }
  .fold summary { cursor:pointer; color:var(--muted); font-size:20px; padding:8px 0; }
  .fold-item { padding:8px 0 8px 16px; color:var(--muted); font-size:20px; border-bottom:1px solid var(--line); }
  .empty { color:var(--muted); text-align:center; padding:20px; }
  .tabs { display:flex; gap:12px; margin-bottom:20px; }
  .tab { font-size:20px; padding:10px 24px; border-radius:12px; border:2px solid var(--line); background:#fff; cursor:pointer; }
  .tab.active { border-color:var(--blue); color:var(--blue); font-weight:700; }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-top: 1px solid #e8eaed;
    display: flex; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .tabbar a {
    flex: 1; text-align: center; text-decoration: none;
    color: #5f6368; font-size: 11px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .tabbar a .ticon { font-size: 22px; }
  .tabbar a.active { color: #1a73e8; font-weight: 700; }
  body { padding-bottom: 76px; }
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
</head>
<body>
<div id="topbar">学习报告</div>
<div id="wrap">
  <div class="tabs">
    <button class="tab active" onclick="showTab('mastery')">掌握情况</button>
    <button class="tab" onclick="showTab('mistakes')">错题本</button>
    <button class="tab" onclick="showTab('trend')">学习趋势</button>
  </div>
  <div id="tab-trend" style="display:none">
    <div class="card">
      <h2>📈 最近7天学习趋势</h2>
      <canvas id="trendChart" style="width:100%;height:220px;"></canvas>
      <div class="legend">
        <span><span class="dot" style="background:#1a73e8"></span>做题数</span>
        <span><span class="dot" style="background:#1e8e3e"></span>正确率%</span>
      </div>
    </div>
    <div class="card">
      <h2>📊 本周小结</h2>
      <div class="stat-row" id="weeklyRow"><div class="empty">正在加载…</div></div>
    </div>
    <div class="card">
      <h2>🎯 弱点清单</h2>
      <div id="weakList"><div class="empty">正在加载…</div></div>
    </div>
  </div>
  <div id="tab-mastery">
    <div class="card">
      <h2>知识点掌握</h2>
      <div class="subtitle">做完新人能力检测后，这里会显示你的强项和待加强项。</div>
      <div id="mastery-list"><div class="empty">加载中…</div></div>
    </div>
  </div>
  <div id="tab-mistakes" style="display:none">
    <div class="card">
      <h2>正在攻克</h2>
      <div class="subtitle">这几个知识点正在练习中，换一道同类型的题独立做对，就真正拿下了。</div>
      <div id="focus-list"><div class="empty">加载中…</div></div>
    </div>
    <div class="card">
      <h2>最近拿下</h2>
      <div class="subtitle">这些是你最近真正掌握的，继续保持。</div>
      <div id="done-list"><div class="empty">还没有，做了练习后会显示在这里。</div></div>
    </div>
    <div class="card fold">
      <details>
        <summary id="fold-summary">查看全部（已折叠）</summary>
        <div id="fold-list"></div>
      </details>
    </div>
  </div>
</div>
<script>
// 知识点中文名映射（不出现内部编号）
const KP_NAMES = {
  'vocab-l1':'基础单词','vocab-l2':'常用单词','vocab-l3':'进阶单词',
  'phonics-1':'拼读（一）','phonics-2':'拼读（二）',
  'grammar-3sg':'三单形式','grammar-therebe':'there be 句型',
  'grammar-since':'since 引导的时间','grammar-for':'for 引导的时间段',
  'reading-l1':'阅读理解（一）','reading-l2':'阅读理解（二）',
  'reading-l3':'阅读理解（三）','reading-l4':'阅读理解（四）',
  'listening-1':'听力（一）','listening-2':'听力（二）',
  'writing-1':'写句子（一）','writing-2':'写句子（二）',
  'readaloud-1':'朗读',
};
function kpName(kp) { return KP_NAMES[kp] || '英语练习'; }
function esc(t) { return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function api(p) { const r = await fetch(p); return r.json(); }

async function loadMastery() {
  const d = await api('/api/mastery');
  const el = document.getElementById('mastery-list');
  if (!d.ok || !d.items.length) { el.innerHTML = '<div class="empty">还没有数据，做完新人能力检测后会显示在这里。</div>'; return; }
  el.innerHTML = d.items.map(k =>
    `<div class="kp"><span class="badge ${esc(k.status)}">${esc(k.status)}</span><span class="kp-name">${esc(kpName(k.knowledge_point))}</span></div>`
  ).join('');
}

async function loadMistakes() {
  const d = await api('/api/retest/pending');
  const focusEl = document.getElementById('focus-list');
  const foldEl = document.getElementById('fold-list');
  const foldSummary = document.getElementById('fold-summary');
  if (!d.ok || !d.pending.length) {
    focusEl.innerHTML = '<div class="empty">现在没有正在攻克的，继续保持！</div>';
    foldEl.innerHTML = '';
    foldSummary.style.display = 'none';
    return;
  }
  // 真人老师风格：只突出前3-5个，其他折叠
  const items = d.pending;
  const focus = items.slice(0, 5);
  const rest = items.slice(5);
  const encouragements = [
    '多练一次，就离拿下更近一步。',
    '这个类型练熟了，考试就不怕了。',
    '换一道题再试一次，你可以的。',
    '慢慢来，把思路理清楚。',
    '已经比上次进步了，继续。',
  ];
  focusEl.innerHTML = focus.map((m, i) =>
    `<div class="focus-item"><div class="t">${esc(kpName(m.knowledge_point))}</div><div class="enc">${encouragements[i % encouragements.length]}</div></div>`
  ).join('');
  if (rest.length) {
    foldSummary.textContent = `查看其他 ${rest.length} 个（已折叠）`;
    foldSummary.style.display = '';
    foldEl.innerHTML = rest.map(m =>
      `<div class="fold-item">${esc(kpName(m.knowledge_point))}</div>`
    ).join('');
  } else {
    foldSummary.style.display = 'none';
  }
}

function showTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-mastery').style.display = t === 'mastery' ? '' : 'none';
  document.getElementById('tab-mistakes').style.display = t === 'mistakes' ? '' : 'none';
  document.getElementById('tab-trend').style.display = t === 'trend' ? '' : 'none';
  if (t === 'mistakes') loadMistakes();
  if (t === 'trend') loadTrend();
}
// 学习趋势（从成长页移过来）
let _trendLoaded = false;
async function loadTrend() {
  if (_trendLoaded) return;
  _trendLoaded = true;
  try {
    const g = await (await fetch('/api/growth')).json();
    if (!g.ok) throw new Error('load failed');
    // 趋势图
    drawTrendChart(g.trend || []);
    // 本周小结
    const w = g.weekly || {};
    document.getElementById('weeklyRow').innerHTML =
      statHtml(w.minutes, '分钟') + statHtml(w.attempts, '做题') +
      statHtml(w.lessons, '完成课程') + statHtml(w.avg_rate == null ? '–' : w.avg_rate + '%', '正确率');
    // 弱点清单
    const wl = g.weakness_list || [];
    document.getElementById('weakList').innerHTML = wl.length
      ? wl.map(x => '<div class="wrow"><span class="wtag">' + escHtml(x.tag) + '</span><span class="wcount">' + x.count + '次</span><span class="wlast">' + escHtml(x.last || '') + '</span></div>').join('')
      : '<div class="empty">还没发现明显弱点，继续保持！</div>';
  } catch (e) {
    document.getElementById('weeklyRow').innerHTML = '<div class="empty">加载失败</div>';
  }
}
function statHtml(v, label) {
  return '<div class="stat"><b>' + v + '</b><span>' + label + '</span></div>';
}
function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function drawTrendChart(trend) {
  const cv = document.getElementById('trendChart');
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 300, H = 220;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  if (!trend.length) {
    ctx.fillStyle = '#999'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('暂无数据', W/2, H/2);
    return;
  }
  const maxN = Math.max(...trend.map(t => t.attempts || 0), 1);
  const pad = 30;
  const X = i => pad + i * (W - pad*2) / Math.max(trend.length - 1, 1);
  const Y1 = n => H - pad - (n / maxN) * (H - pad*2);
  const Y2 = r => H - pad - (r / 100) * (H - pad*2);
  // 做题数（蓝线）
  ctx.strokeStyle = '#1a73e8'; ctx.lineWidth = 2; ctx.beginPath();
  trend.forEach((t, i) => { const x = X(i), y = Y1(t.attempts || 0); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  // 正确率（绿线）
  ctx.strokeStyle = '#1e8e3e'; ctx.beginPath();
  trend.forEach((t, i) => { if (t.rate == null) return; const x = X(i), y = Y2(t.rate); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  ctx.fillStyle = '#1a73e8';
  trend.forEach((t, i) => {
    ctx.beginPath(); ctx.arc(X(i), Y1(t.attempts || 0), 4, 0, 7); ctx.fill();
  });
  ctx.fillStyle = '#1e8e3e';
  trend.forEach((t, i) => {
    if (t.rate == null) return;
    ctx.beginPath(); ctx.arc(X(i), Y2(t.rate), 4, 0, 7); ctx.fill();
  });
}

try { loadMastery(); } catch (e) { if (window.__reportInitFailure) window.__reportInitFailure(e.message || String(e)); }
</script>

<div class="tabbar">
  <a href="/"><span class="ticon">🏠</span>首页</a>
  <a href="/vocab.html"><span class="ticon">📖</span>生词本</a>
  <a href="/progress.html" class="active"><span class="ticon">📊</span>学习报告</a>
  <a href="/growth.html"><span class="ticon">🌱</span>成长</a>
  <a href="/settings.html"><span class="ticon">⚙️</span>设置</a>
</div>
</body>
</html>
